<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF6F4;
    --panel:#FFFFFF;
    --ink:#3A2C2A;
    --ink-soft:#8A7472;
    --wine:#B4827D;
    --wine-deep:#8F5F5A;
    --gold:#C9A08C;
    --blush:#F5E5E2;
    --blush-line:#EAD4D0;
    --shadow: 0 18px 50px -20px rgba(58,44,42,0.25);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow-x:hidden;}
  html{ touch-action:manipulation; } /* evita zoom por duplo-toque, mantém scroll normal */
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #FBEFED 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, #F6E4E1 0%, transparent 50%),
      var(--cream);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:430px;
    height:min(760px, 92vh);
    background:var(--panel);
    border-radius:28px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--blush-line);
    position:relative; /* trava o painel "Agendamentos" dentro do próprio cartão do celular */
  }
  header.top{
    background:linear-gradient(135deg, var(--wine) 0%, var(--wine-deep) 100%);
    color:#fff;
    padding:20px 22px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
  }
  header.top::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:10px;
    background:
      radial-gradient(circle, var(--wine-deep) 45%, transparent 46%) 0 0/16px 16px repeat-x;
    opacity:.9;
  }
  .head-text{display:flex;flex-direction:column;line-height:1.25;}
  .head-text .name{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;letter-spacing:.2px;}
  .head-text .status{font-size:.75rem;color:#F5E1DD;display:flex;align-items:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#7CE0A6;display:inline-block;}

  main.thread{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background-color:var(--cream);
    background-image:
      none;
    background-repeat:no-repeat, repeat;
    background-size:100% 100%, 150px auto;
    background-position:0 0, 0 0;
  }
  main.thread::-webkit-scrollbar{width:6px;}
  main.thread::-webkit-scrollbar-thumb{background:var(--blush-line);border-radius:10px;}

  .msg{
    max-width:80%;
    padding:11px 14px;
    border-radius:16px;
    font-size:.92rem;
    line-height:1.45;
    animation:rise .25s ease both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .msg.bot{
    align-self:flex-start;
    background:var(--blush);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--wine);
    color:#fff;
    border-bottom-right-radius:4px;
    display:flex;
    align-items:flex-end;
    gap:5px;
  }
  .msg.user .msg-texto{ flex:1; }
  .msg.user .ticks{
    flex-shrink:0;
    display:inline-flex;
    color:rgba(255,255,255,.6);
    transition:color .3s ease;
    margin-bottom:1px;
  }
  .msg.user .ticks.lido{ color:#53BDEB; }
  .msg b{font-weight:700;}
  .msg .price{color:var(--wine-deep); font-weight:700;}
  .msg.bot .price{color:var(--wine);}

  .typing{
    align-self:flex-start;
    display:flex; gap:4px;
    background:var(--blush);
    padding:12px 16px;
    border-radius:16px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--wine);
    opacity:.5;
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.3; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);}}

  .choices{
    align-self:flex-start;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-width:92%;
    margin-top:2px;
  }
  .chip{
    border:1.5px solid var(--wine);
    color:var(--wine);
    background:#fff;
    padding:9px 14px;
    border-radius:999px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
    font-family:'Manrope',sans-serif;
  }
  .chip:hover{background:var(--wine); color:#fff;}
  .chip:disabled{opacity:.4; cursor:default;}
  .chip.ghost{border-color:var(--blush-line); color:var(--ink-soft);}
  .chip.ghost:hover{background:var(--blush); color:var(--ink);}

  .composer{
    display:flex;
    gap:10px;
    padding:14px 16px;
    border-top:1px solid var(--blush-line);
    background:#fff;
  }
  .composer input{
    flex:1;
    border:1.5px solid var(--blush-line);
    border-radius:999px;
    padding:11px 16px;
    font-size:16px; /* >=16px evita zoom automático do iOS ao focar o campo */
    font-family:'Manrope',sans-serif;
    outline:none;
    background:var(--cream);
    color:var(--ink);
  }
  .composer input:focus{border-color:var(--wine);}
  .composer button{
    width:44px;height:44px;
    border-radius:50%;
    border:none;
    background:var(--wine);
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:.15s;
  }
  .composer button:hover{background:var(--wine-deep);}
  .composer button:disabled{opacity:.4; cursor:default;}
  .composer svg{width:18px;height:18px;}

  .back-row{
    align-self:flex-start;
    margin-top:-2px;
  }
  .back-chip{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:.78rem;
    font-family:'Manrope',sans-serif;
    cursor:pointer;
    display:flex;align-items:center;gap:4px;
    padding:4px 2px;
  }
  .back-chip:hover{color:var(--wine);}

  /* ---- header: logo, marca, botão de agendamentos ---- */
  .logo-badge{
    width:44px;height:44px;
    border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
  }
  .logo-badge img{
    width:72%;
    height:auto;
    object-fit:contain;
  }
  .head-text{flex:1; min-width:0;}
  .head-text .name{font-weight:700;}
  .head-text .brand{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:.72rem;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:#F5E1DD;
    display:block;
  }
  .agenda-btn{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:.76rem;
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
    flex-shrink:0;
    transition:.15s;
    white-space:nowrap;
  }
  .agenda-btn:hover{background:rgba(255,255,255,.24);}

  /* ---- card de perfil da profissional (aparece ao escolher horário) ---- */
  .profissional-card{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--blush-line);
    border-radius:16px;
    padding:10px 16px 10px 10px;
    max-width:88%;
    box-shadow:0 6px 18px -10px rgba(43,27,30,.35);
    animation:rise .3s ease both;
  }
  .profissional-card img{
    width:52px;height:52px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:2px solid var(--blush);
  }
  .profissional-card .prof-nome{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:.95rem;
    color:var(--ink);
  }
  .profissional-card .prof-tag{
    font-size:.74rem;
    color:var(--ink-soft);
  }

  /* ---- painel "meus agendamentos" ---- */
  .agenda-overlay{
    position:absolute;
    inset:0;
    background:rgba(43,27,30,.35);
    display:none;
    align-items:flex-end;
    z-index:20;
  }
  .agenda-overlay.open{display:flex;}
  .agenda-panel{
    background:var(--panel);
    width:100%;
    max-height:78%;
    border-radius:22px 22px 0 0;
    padding:20px 20px 24px;
    overflow-y:auto;
    animation:slideUp .25s ease both;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .agenda-panel h3{
    font-family:'Fraunces',serif;
    margin:0 0 12px;
    font-size:1.1rem;
    color:var(--wine-deep);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .agenda-panel h3 button{
    border:none;background:none;color:var(--ink-soft);
    font-size:1.1rem; cursor:pointer; line-height:1;
  }
  .agenda-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--blush-line);
    font-size:.88rem;
  }
  .agenda-item:last-child{border-bottom:none;}
  .agenda-item .ag-servico{font-weight:600; color:var(--ink);}
  .agenda-item .ag-data{color:var(--ink-soft); font-size:.8rem;}
  .ag-alterar-btn{
    flex-shrink:0;
    border:1.5px solid var(--wine);
    background:#fff;
    color:var(--wine);
    font-size:.74rem;
    font-weight:700;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .ag-alterar-btn:hover{ background:var(--blush); }
  .ag-sem-alteracao{
    flex-shrink:0;
    font-size:.7rem;
    color:var(--ink-soft);
    text-align:right;
    max-width:100px;
  }
  .agenda-empty{
    color:var(--ink-soft);
    font-size:.85rem;
    padding:8px 0 4px;
  }
  .agenda-busca{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .agenda-busca input{
    flex:1;
    border:1.5px solid var(--blush-line);
    border-radius:999px;
    padding:10px 14px;
    font-size:16px;
    font-family:'Manrope',sans-serif;
    outline:none;
    background:var(--cream);
    color:var(--ink);
  }
  .agenda-busca input:focus{ border-color:var(--wine); }
  .agenda-busca button{
    border:none;
    background:var(--wine);
    color:#fff;
    font-weight:700;
    font-size:.85rem;
    font-family:'Manrope',sans-serif;
    padding:0 18px;
    border-radius:999px;
    cursor:pointer;
    flex-shrink:0;
  }
  .agenda-busca button:hover{ background:var(--wine-deep); }
  .agenda-erro{
    color:var(--wine);
    font-size:.78rem;
    margin-top:8px;
  }

  /* ---- handoff seguro dentro do painel (quando a busca falha) ---- */
  .agenda-handoff{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:6px 0 4px;
  }
  .agenda-handoff-texto{
    font-size:.88rem;
    color:var(--ink);
    line-height:1.5;
  }
  .agenda-handoff .wa-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:11px;
    border-radius:12px;
    font-weight:700;
    font-size:.85rem;
    font-family:'Manrope',sans-serif;
  }
  .agenda-handoff .wa-btn:hover{ filter:brightness(0.95); }

  /* ---- galeria de trabalhos (dentro do chat) ---- */
  .galeria-msg{
    align-self:flex-start;
    max-width:92%;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .galeria-legenda{
    font-size:.78rem;
    color:var(--ink-soft);
    padding-left:2px;
  }
  .galeria-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    scroll-snap-type:x proximity;
  }
  .galeria-scroll::-webkit-scrollbar{height:5px;}
  .galeria-scroll::-webkit-scrollbar-thumb{background:var(--blush-line); border-radius:10px;}
  .galeria-scroll img{
    width:112px;
    height:140px;
    object-fit:cover;
    border-radius:14px;
    flex-shrink:0;
    scroll-snap-align:start;
    border:1px solid var(--blush-line);
    box-shadow:0 6px 14px -8px rgba(43,27,30,.4);
  }

  /* ---- cartão de confirmação de agendamento ---- */
  /* ---- cartão-resumo oficial do agendamento (simples, sem foto/animação) ---- */
  .confirm-card{
    align-self:flex-start;
    max-width:88%;
    background:var(--panel);
    border:1.5px solid var(--blush-line);
    border-radius:18px;
    padding:16px 18px;
    box-shadow:0 10px 26px -14px rgba(43,27,30,.35);
    animation:rise .3s ease both;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .confirm-card.confirmado{
    border-color:#3F9463;
  }
  .confirm-card .status-badge{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--gold);
    color:#fff;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.3px;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:999px;
    margin-bottom:2px;
  }
  .confirm-card .status-badge.ok{ background:#3F9463; }
  .confirm-card .servico-nome{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:1.05rem;
    color:var(--ink);
    line-height:1.3;
  }
  .confirm-card .linha{
    font-size:.85rem;
    color:var(--ink);
    line-height:1.5;
    display:flex;
    align-items:flex-start;
    gap:7px;
  }
  .confirm-card .linha .check{
    color:#3F9463;
    font-weight:700;
    flex-shrink:0;
  }
  .confirm-card .linha .rotulo{ color:var(--ink-soft); }
  .confirm-card .wa-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:6px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:11px;
    border-radius:12px;
    font-weight:700;
    font-size:.85rem;
    font-family:'Manrope',sans-serif;
    transition:.15s;
  }
  .confirm-card .wa-btn:hover{ filter:brightness(0.95); }

  /* ---- botão de avaliação no Google ---- */
  .avaliacao-card{
    align-self:flex-start;
  }
  .avaliacao-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:#fff;
    border:1.5px solid var(--gold);
    color:var(--wine-deep);
    padding:10px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:.85rem;
    font-family:'Manrope',sans-serif;
    text-decoration:none;
    transition:.15s;
  }
  .avaliacao-btn:hover{ background:var(--blush); }

  /* ---- balão de áudio (estilo WhatsApp) ---- */
  .audio-msg{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--blush);
    padding:10px 14px;
    border-radius:16px;
    border-bottom-left-radius:4px;
    max-width:78%;
  }
  .audio-play{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--wine);
    border:none;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    cursor:pointer;
  }
  .audio-play svg{ width:15px; height:15px; }
  .audio-wave{
    flex:1;
    display:flex;
    align-items:center;
    gap:2px;
    height:22px;
  }
  .audio-wave span{
    width:3px;
    background:var(--wine);
    opacity:.45;
    border-radius:2px;
    transition:opacity .15s;
  }
  .audio-wave.playing span{ opacity:.85; }
  .audio-time{
    font-size:.72rem;
    color:var(--ink-soft);
    flex-shrink:0;
    min-width:28px;
  }

  @media (prefers-reduced-motion: reduce){
    .msg, .typing span, .profissional-card, .agenda-panel{animation:none;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="logo-badge" id="logoBadge" style="visibility:hidden"><img id="logoImg" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Carolina Beauty"></div>
    <div class="head-text">
      <span class="name" id="hdrNome"></span>
      <span class="brand" id="hdrBrand"></span>
    </div>
    <button class="agenda-btn" id="agendaBtn" type="button">Agendamentos</button>
  </header>

  <main class="thread" id="thread"></main>

  <div class="agenda-overlay" id="agendaOverlay">
    <div class="agenda-panel">
      <h3>Seus agendamentos <button id="fecharAgenda" type="button" aria-label="Fechar">✕</button></h3>
      <div id="agendaLista"></div>
    </div>
  </div>

  <div class="composer" id="composer" style="display:none;">
    <input type="text" id="freeInput" placeholder="Digite aqui..." autocomplete="off">
    <button type="button" id="sendBtn" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>


<script>
/* =========================================================================
   CAROLINA BEAUTY — ATENDIMENTO "IZA"
   Padrão: HTML single-file (chat), Google Apps Script (backend),
   Google Calendar (disponibilidade real) + Google Sheets (aba "SQL").
   Mesmo padrão usado na Harmoniziê (Dra. Daniele Caju).

   O ritmo da conversa é propositalmente humano: pausa antes de "ver" a
   mensagem, tempo de digitação proporcional ao tamanho do texto, e
   respostas longas quebradas em mais de uma bolha (como uma pessoa
   digitando de verdade manda, e não um bloco único formatado).

   >>> PREENCHER ANTES DE PUBLICAR <<<
   1) SUPABASE_URL / SUPABASE_KEY (anon) e o slug do negócio (?c=carolina-beauty)
   2) Seção DADOS_FALTANTES abaixo (preços/duração que vieram em branco
      no briefing) e as FAQs.
   ========================================================================= */

const SUPABASE_URL = "https://bbhbqnzaxbyvllunmhwf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiaGJxbnpheGJ5dmxsdW5taHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNzIxMzYsImV4cCI6MjEwNzc0ODEzNn0.jJOjhhBDm1yerCgDHkAtJY7Rtpr62O1am8eW41o_uvU"; // anon: pública por design

// Qual negócio carregar: ?c=slug (ou último trecho do caminho). Sem slug = aviso
const SLUG = (()=>{
  const q = new URLSearchParams(location.search).get('c');
  if(q) return q.toLowerCase();
  const seg = location.pathname.split('/').filter(Boolean).pop() || '';
  if(seg && !/\.html?$/i.test(seg) && /^[a-z0-9-]{3,60}$/i.test(seg)) return seg.toLowerCase();
  return '';
})();

async function rpc(nome, args){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${nome}`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args)
  });
  if(!res.ok) throw new Error("rpc " + nome + " HTTP " + res.status);
  return res.json();
}

// >>> ÁUDIOS <<<
// Cole aqui os áudios em base64 quando o Patrick mandar (formato:
// "data:audio/mpeg;base64,XXXX" pra mp3, ou "data:audio/ogg;base64,XXXX"
// pra ogg/m4a). Enquanto estiver null, o balão de áudio não aparece.
const AUDIO_ANTES_AGENDA = null; // removido a pedido do Patrick — não usar mais
const AUDIO_ANTES_AGENDA_DURACAO = "0:05";

let AUDIO_FINAL = null; // "Muito obrigada pelo seu agendamento, qualquer informação é só me chamar no WhatsApp."
let AUDIO_FINAL_DURACAO = "0:10";

let FOTOS_TRABALHOS = [];

let FOTO_RESPONSAVEL = null;

let STUDIO = { nome:"", nomeRaw:"", responsavel:"", nomeAssistente:"Iza", endereco:"", mapsUrl:null, whatsappApoio:"", diasAtendimento:[], formasPagamento:"", sinal:false, cancelamento:"", atendeDomicilio:false, googleReviewUrl:null, diasFrente:60 };

let HORARIOS = {}; // { "1": ["08:00",...], ... } — carregado do Supabase (dia sem lista = fechado)

// Serviços com dados confirmados no briefing (duração em minutos)
// "incluiEsmaltacao": a esmaltação em gel já está embutida no procedimento
// (não é cobrada/agendada separada) — exceto na remoção.
// "Blindagem" NÃO é um serviço separado: é o mesmo procedimento da
// esmaltação em gel (nome alternativo usado pela Carolina), por isso não
// tem uma entrada própria aqui.
let SERVICOS = [];

const BRL = v => v==null ? "a confirmar" : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

// ---------------------------------------------------------------------
// Estado da conversa
// ---------------------------------------------------------------------
const state = {
  step: "start",
  categoria: null,   // "maos" | "pes" | "ambos"
  servicos: [],       // lista de serviços escolhidos (1 item, ou 2 se "ambos")
  data: null,       // "YYYY-MM-DD"
  hora: null,       // "HH:MM"
  nome: null,
  whatsapp: null,
  history: [],       // pilha de steps pro botão "voltar"
  agendamentos: []   // agendamentos confirmados nesta sessão (pro painel "Agendamentos")
};

// Agrega os serviços escolhidos (relevante quando a cliente pede mãos + pés)
function servicoAgregado(){
  const nome = state.servicos.map(s=>s.nome).join(" + ");
  const duracao = state.servicos.reduce((a,s)=>a+(s.duracao||0), 0);
  const todosConfirmados = state.servicos.every(s=>s.confirmado);
  const preco = todosConfirmados ? state.servicos.reduce((a,s)=>a+(s.preco||0), 0) : null;
  const incluiEsmaltacao = state.servicos.some(s=>s.incluiEsmaltacao);
  return { nome, duracao, preco, confirmado: todosConfirmados, incluiEsmaltacao };
}

const thread = document.getElementById('thread');
const composer = document.getElementById('composer');
const freeInput = document.getElementById('freeInput');

function scrollBottom(){ thread.scrollTop = thread.scrollHeight; }

function addMsg(text, who="bot"){
  const div = document.createElement('div');
  div.className = `msg ${who}`;

  if(who === "user"){
    // simula o "✓✓" de enviado/visto do WhatsApp: cinza ao mandar,
    // vira azul um instante depois (como se a Iza tivesse acabado de ver)
    div.innerHTML = `<span class="msg-texto">${text}</span><span class="ticks" aria-hidden="true">${TICKS_SVG}</span>`;
    thread.appendChild(div);
    scrollBottom();
    const ticksEl = div.querySelector('.ticks');
    setTimeout(()=> ticksEl.classList.add('lido'), 450 + Math.random() * 500);
  } else {
    div.innerHTML = text;
    thread.appendChild(div);
    scrollBottom();
  }
}

const TICKS_SVG = `<svg viewBox="0 0 16 11" width="14" height="10"><path d="M1 5.6L4.2 8.8L10.4 1.8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.6 5.6L8.8 8.8L15 1" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function showTyping(){
  const t = document.createElement('div');
  t.className = 'typing';
  t.id = 'typingIndicator';
  t.innerHTML = '<span></span><span></span><span></span>';
  thread.appendChild(t);
  scrollBottom();
}
function hideTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}

// Tempo de "digitação" proporcional ao tamanho do texto, com variação
// aleatória — evita o ritmo robótico de delay fixo.
function tempoDigitando(text){
  const len = (text || "").replace(/<[^>]+>/g, "").length;
  const base = 500;
  const porCaractere = 16;
  const variacao = Math.random() * 500;
  return Math.min(2600, Math.max(650, base + len * porCaractere + variacao));
}

// pausa curta simulando "viu a mensagem antes de começar a responder"
function pausaAntesDeVer(){
  return 300 + Math.random() * 450;
}

async function bot(text, {comPausaDeVer=true, delay=null} = {}){
  if(comPausaDeVer){
    await new Promise(r=>setTimeout(r, pausaAntesDeVer()));
  }
  showTyping();
  await new Promise(r=>setTimeout(r, delay ?? tempoDigitando(text)));
  hideTyping();
  addMsg(text, "bot");
}

// Envia várias mensagens em sequência, como uma pessoa mandando
// vários balõezinhos em vez de um bloco único. Só a primeira tem a
// pausa de "viu a mensagem" — as seguintes são a mesma pessoa
// continuando a digitar.
async function botSeq(linhas){
  for(let i=0; i<linhas.length; i++){
    await bot(linhas[i], { comPausaDeVer: i===0 });
  }
}

function clearChoices(){
  document.querySelectorAll('.choices, .back-row').forEach(el=>el.remove());
}

function renderChoices(options, onPick, {ghostBack=null}={}){
  clearChoices();
  const wrap = document.createElement('div');
  wrap.className = 'choices';
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = opt.label;
    b.onclick = () => {
      addMsg(opt.label, "user");
      wrap.remove();
      backRow?.remove();
      onPick(opt.value);
    };
    wrap.appendChild(b);
  });
  thread.appendChild(wrap);

  let backRow = null;
  if(ghostBack){
    backRow = document.createElement('div');
    backRow.className = 'back-row';
    const bb = document.createElement('button');
    bb.className = 'back-chip';
    bb.type = 'button';
    bb.innerHTML = '← voltar';
    bb.onclick = ghostBack;
    backRow.appendChild(bb);
    thread.appendChild(backRow);
  }
  scrollBottom();
}

function goBack(){
  const prev = state.history.pop();
  if(prev) prev();
}

function pushHistory(fn){ state.history.push(fn); }

// Fluxo
// ---------------------------------------------------------------------
const esc = v => String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

// Tom de voz: textos editáveis pelo dono no painel. {assistente} {negocio} {nome} viram negrito.
let TOM = {};
const TOM_PADRAO = {
  saudacao: "Oii, tudo bem? Aqui é a {assistente}, da {negocio} 🙂\nAntes de mais nada, qual é o seu nome?",
  boas_vindas: "Muito prazer, {nome}! Já consigo ver os horários livres e marcar direto por aqui",
  finalizacao: "Prontinho, {nome}!",
  avaliacao: "Se puder, deixa uma avaliação pra gente no Google — ajuda demais! ⭐"
};
function tom(chave, vars){
  let t = esc((TOM && TOM[chave]) || TOM_PADRAO[chave]);
  const v = Object.assign({assistente: STUDIO.nomeAssistente, negocio: STUDIO.nome}, vars||{});
  Object.keys(v).forEach(k => { t = t.split("{"+k+"}").join("<b>"+v[k]+"</b>"); });
  return t;
}

async function start(){

  composer.style.display = 'none';
  await botSeq(tom('saudacao').split("\n").filter(Boolean));
  askFreeText(async (texto)=>{
    state.nome = texto;
    await stepBoasVindasComNome();
  }, { ehNome: true });
}

async function stepBoasVindasComNome(){
  await bot(tom('boas_vindas', {nome: primeiroNome(state.nome)}));
  await stepCategoria();
}

async function stepCategoria(){
  state.servicos = [];
  const cats = [...new Set(SERVICOS.map(s=>s.categoria || "Serviços"))];
  if(cats.length <= 1){ await stepListaGenerica(cats[0] || "Serviços"); return; }
  await bot(`Qual tipo de atendimento você procura, <b>${primeiroNome(state.nome)}</b>?`);
  renderChoices(cats.map(c=>({label:capitalizar(c), value:c})), async (v)=>{
    pushHistory(stepCategoriaGenerica);
    await stepListaGenerica(v);
  }, { ghostBack: goBack });
}

async function stepListaGenerica(cat){
  mostrarGaleriaTrabalhos();
  await bot(`O que você vai querer, <b>${primeiroNome(state.nome)}</b>?`);
  const lista = SERVICOS.filter(s=>(s.categoria || "Serviços") === cat);
  renderChoices(lista.map(s=>({label:s.nome, value:s.id})), async (v)=>{
    pushHistory(()=>stepListaGenerica(cat));
    state.servicos = [SERVICOS.find(x=>x.id===v)];
    await stepConfirmaServico();
  }, { ghostBack: goBack });
}

async function stepConfirmaServico(){
  const naoConfirmados = state.servicos.filter(s=>!s.confirmado);
  if(naoConfirmados.length){
    await stepHandoffServicoSemDados(naoConfirmados);
    return;
  }
  const agg = servicoAgregado();
  const nota = "";
  await bot(`<b>${agg.nome}</b>${nota} — dá uns ${formatDuracao(agg.duracao)}, e fica <span class="price">${BRL(agg.preco)}</span>`);
  await bot(`Quer marcar, <b>${primeiroNome(state.nome)}</b>?`);
  renderChoices([
    {label:"Sim, quero marcar", value:"sim"},
    {label:"Só queria saber o preço", value:"nao"}
  ], async (v)=>{
    if(v === "sim"){
      stepEscolherMes();
    } else {
      await bot("Sem problema! Se mudar de ideia é só voltar aqui 🙂");
      state.servicos = [];
      await stepCategoria();
    }
  }, { ghostBack: goBack });
}

async function stepHandoffServicoSemDados(naoConfirmados){
  const nomes = naoConfirmados.map(s=>s.nome.toLowerCase()).join(" e ");
  await bot(`<b>${primeiroNome(state.nome)}</b>, o valor de ${nomes} eu ainda não tenho aqui — me chama no ${STUDIO.whatsappApoio} que a <b>${STUDIO.responsavel}</b> te passa na hora`);
  renderChoices([{label:"Escolher outro serviço", value:"outro"}], async ()=>{
    state.servicos = [];
    await stepCategoria();
  });
}

function formatDuracao(min){
  const h = Math.floor(min/60), m = min%60;
  if(h && m) return `${h}h${m}min`;
  if(h) return `${h}h`;
  return `${m}min`;
}

function proximosDiasUteis(qtd=6){
  const out = [];
  let d = new Date();
  while(out.length < qtd){
    d.setDate(d.getDate()+1);
    if(STUDIO.diasAtendimento.includes(d.getDay())){
      out.push(new Date(d));
    }
  }
  return out;
}

// Guarda o horário já checado da última data selecionada, pra não bater
// duas vezes na agenda pra mesma data (ex.: se ela clicar "voltar").
let cacheDisponibilidade = {};

// Lembra o mês selecionado, pra "escolher outro dia" voltar pro mesmo mês
// em vez de reiniciar do zero.
let mesSelecionadoAtual = null;

// Gera os próximos dias úteis (respeitando dias de atendimento) dentro
// de uma janela de N dias à frente — padrão 60 dias, porque tem cliente
// que já marca de um mês pro outro.
// Formata a data em "YYYY-MM-DD" usando o horário LOCAL do aparelho —
// nunca use toISOString() pra isso, porque ele converte pra UTC e pode
// virar o dia seguinte à noite (é assim que agendamentos apareciam
// caindo em domingo quando a cliente mexia no site tarde da noite de
// sábado: o Brasil está 3h atrás do UTC).
function dataISOLocal(d){
  const ano = d.getFullYear();
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${ano}-${mes}-${dia}`;
}

// Períodos com a agenda fechada por decisão da Carolina (ex.: fechar
// dezembro provisoriamente). Formato "YYYY-MM-DD" (local).
let PERIODOS_BLOQUEADOS = [
  { inicio: "2026-12-01", fim: "2026-12-31", motivo: "Dezembro fechado (provisório)" }
];

function dataBloqueada(dataISO){
  return PERIODOS_BLOQUEADOS.some(p => dataISO >= p.inicio && dataISO <= p.fim);
}

function gerarDiasUteisAte(diasFrente){
  const out = [];
  for(let i=1; i<=diasFrente; i++){
    const d = new Date();
    d.setDate(d.getDate() + i);
    if(STUDIO.diasAtendimento.includes(d.getDay()) && !dataBloqueada(dataISOLocal(d))){
      out.push(d);
    }
  }
  return out;
}

// Agrupa os dias por mês, na ordem em que aparecem (ex.: Agosto, Setembro, Outubro)
function agruparPorMes(dias){
  const meses = [];
  const porChave = {};
  dias.forEach(d=>{
    const chave = `${d.getFullYear()}-${d.getMonth()}`;
    if(!porChave[chave]){
      const novo = { label: d.toLocaleDateString('pt-BR', {month:'long'}), ano: d.getFullYear(), dias: [] };
      porChave[chave] = novo;
      meses.push(novo);
    }
    porChave[chave].dias.push(d);
  });
  return meses;
}

// Passo 1: escolher o MÊS (olhando os próximos 60 dias de atendimento)
async function stepEscolherMes(){
  clearChoices();
  const dias = gerarDiasUteisAte(STUDIO.diasFrente||60);
  const meses = agruparPorMes(dias);

  if(meses.length === 0){
    await bot(`Não achei nenhum dia disponível nos próximos meses 😕 Me chama direto no ${STUDIO.whatsappApoio} que a gente encaixa você.`);
    renderChoices([{label:"Chamar no WhatsApp", value:"wpp"}], ()=>{
      window.open(`https://wa.me/55${STUDIO.whatsappApoio.replace(/\D/g,'')}`, '_blank');
    });
    return;
  }

  await bot(`Pra qual mês fica bom, <b>${primeiroNome(state.nome)}</b>?`);
  renderChoices(
    meses.map(m => ({ label: capitalizar(m.label), value: `${m.label}-${m.ano}` })),
    async (valor) => {
      pushHistory(stepEscolherMes);
      const mes = meses.find(m => `${m.label}-${m.ano}` === valor);
      await stepEscolherDia(mes);
    },
    { ghostBack: goBack }
  );
}

// Passo 2: escolher o DIA dentro do mês escolhido
async function stepEscolherDia(mes){
  mesSelecionadoAtual = mes;
  await bot(`Quais dias de <b>${mes.label}</b> fica bom?`);
  const opcoes = mes.dias.map(d => ({
    label: d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit'}),
    value: dataISOLocal(d)
  }));
  renderChoices(opcoes, async (dataISO) => {
    pushHistory(() => stepEscolherDia(mes));
    state.data = dataISO;
    await stepBuscarDisponibilidade();
  }, { ghostBack: goBack });
}

async function stepBuscarDisponibilidade(){
  await bot(`Peraí, <b>${primeiroNome(state.nome)}</b>, deixa eu ver aqui na agenda... 💅`);
  const agg = servicoAgregado();
  let slots = cacheDisponibilidade[state.data];
  if(!slots){
    try{
      slots = await buscarHorariosDisponiveis(state.data, agg.duracao);
      cacheDisponibilidade[state.data] = slots;
    }catch(e){
      console.warn("Falha ao consultar agenda:", e);
      await bot("Ih, não consegui ver a agenda agora 😕 Tenta de novo ou me chama direto no " + STUDIO.whatsappApoio);
      renderChoices([{label:"Tentar de novo", value:"retry"}], stepBuscarDisponibilidade);
      return;
    }
  }

  const voltarParaDia = () => mesSelecionadoAtual ? stepEscolherDia(mesSelecionadoAtual) : stepEscolherMes();

  if(slots.length === 0){
    await bot("Esse dia já não tá com horário livre pra esse serviço 😕 Quer ver outro dia?");
    renderChoices([{label:"Escolher outro dia", value:"back"}], voltarParaDia);
    return;
  }

  await bot("Esses horários estão livres:");
  renderChoices(
    slots.map(h=>({label:h, value:h})),
    async (hora)=>{
      pushHistory(voltarParaDia);
      state.hora = hora;
      await stepConfirmaHorario();
    },
    { ghostBack: voltarParaDia }
  );
}

// -----------------------------------------------------------------------
// Alterar data de um agendamento já existente (a partir do painel
// "Agendamentos"), reaproveitando o mesmo fluxo mês → dia → horário.
// -----------------------------------------------------------------------
let reagendamento = null; // { id, servicoNome, duracaoMin }

function iniciarAlteracaoData(item){
  reagendamento = {
    id: item.id,
    servicoNome: item.servico,
    duracaoMin: item.duracao,
    nome: item.nome,
    dataAtual: item.data,
    horaAtual: item.hora
  };
  agendaOverlay.classList.remove('open');
  reagendarEscolherMes();
}

async function reagendarEscolherMes(){
  clearChoices();
  const dias = gerarDiasUteisAte(STUDIO.diasFrente||60);
  const meses = agruparPorMes(dias);

  if(meses.length === 0){
    await bot(`Não achei dias disponíveis pra reagendar 😕 Me chama no ${STUDIO.whatsappApoio}.`);
    renderChoices([{label:"Chamar no WhatsApp", value:"wpp"}], ()=>{
      window.open(`https://wa.me/55${STUDIO.whatsappApoio.replace(/\D/g,'')}`, '_blank');
    });
    return;
  }

  await bot(
    `Beleza, <b>${primeiroNome(reagendamento.nome)}</b>! Vamos alterar o agendamento de ` +
    `<b>${reagendamento.servicoNome}</b> que estava em ${formatDataLegivel(reagendamento.dataAtual)} às ${reagendamento.horaAtual}. Qual mês fica bom pra nova data?`
  );
  renderChoices(
    meses.map(m => ({ label: capitalizar(m.label), value: `${m.label}-${m.ano}` })),
    async (valor) => {
      pushHistory(reagendarEscolherMes);
      const mes = meses.find(m => `${m.label}-${m.ano}` === valor);
      await reagendarEscolherDia(mes);
    },
    { ghostBack: goBack }
  );
}

async function reagendarEscolherDia(mes){
  await bot(`Quais dias de <b>${mes.label}</b> fica bom, <b>${primeiroNome(reagendamento.nome)}</b>?`);
  const opcoes = mes.dias.map(d => ({
    label: d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit'}),
    value: dataISOLocal(d)
  }));
  renderChoices(opcoes, async (dataISO) => {
    pushHistory(() => reagendarEscolherDia(mes));
    await reagendarEscolherHorario(dataISO, mes);
  }, { ghostBack: goBack });
}

async function reagendarEscolherHorario(dataISO, mes){
  await bot("Peraí, deixa eu ver aqui na agenda... 💅");
  let slots;
  try{
    slots = await buscarHorariosDisponiveis(dataISO, reagendamento.duracaoMin);
  }catch(e){
    console.warn("Falha ao consultar agenda:", e);
    await bot("Ih, não consegui ver a agenda agora 😕 Tenta de novo.");
    renderChoices([{label:"Tentar de novo", value:"retry"}], () => reagendarEscolherHorario(dataISO, mes));
    return;
  }

  if(slots.length === 0){
    await bot("Esse dia já não tá com horário livre 😕 Escolhe outro dia?");
    renderChoices([{label:"Escolher outro dia", value:"back"}], () => reagendarEscolherDia(mes));
    return;
  }

  await bot("Esses horários estão livres:");
  renderChoices(
    slots.map(h => ({ label: h, value: h })),
    async (hora) => {
      pushHistory(() => reagendarEscolherHorario(dataISO, mes));
      await confirmarAlteracaoData(dataISO, hora);
    },
    { ghostBack: () => reagendarEscolherDia(mes) }
  );
}

async function confirmarAlteracaoData(novaData, novaHora){
  await bot("Só um segundo, já atualizo aqui ⏳");
  try{
    const json = await rpc('alterar_agendamento', {
      p_slug: SLUG, p_id: reagendamento.id, p_nova_data: novaData, p_nova_hora: novaHora
    });
    if(!json.ok) throw new Error(json.erro || "erro ao alterar");
    await bot(
      `Prontinho, <b>${primeiroNome(reagendamento.nome)}</b>! ` +
      `<b>${reagendamento.servicoNome}</b> alterado pra <b>${formatDataLegivel(novaData)}</b> às <b>${novaHora}</b> ✅`
    );
  }catch(e){
    console.warn("Erro ao alterar agendamento:", e);
    await bot(`Não consegui alterar agora, <b>${primeiroNome(reagendamento.nome)}</b> — me chama no WhatsApp que a gente resolve na mão: ${STUDIO.whatsappApoio}`);
  }
  reagendamento = null;
}

async function stepConfirmaHorario(){
  const agg = servicoAgregado();
  await bot(`Fechado ${agg.nome.toLowerCase()} em ${formatDataLegivel(state.data)} às <b>${state.hora}</b>?`);
  renderChoices([
    {label:"Sim, esse horário", value:"sim"},
    {label:"Escolher outro horário", value:"outro"}
  ], async (v)=>{
    if(v === "sim"){
      mostrarPerfilProfissional();
      await new Promise(r=>setTimeout(r, 500));
      await stepWhatsapp();
    } else {
      await stepBuscarDisponibilidade();
    }

}

// Consulta Supabase: horários ocupados do dia
async function buscarHorariosDisponiveis(dataISO, duracaoMin){
  const lista = await rpc('get_ocupados', { p_slug: SLUG, p_data: dataISO });
  if(!Array.isArray(lista)) throw new Error("resposta inválida");
  const ocupados = lista.map(o=>({
    inicio: toMinutes(o.hora),
    fim: toMinutes(o.hora) + Number(o.duracao)
  }));

  const diaSemana = new Date(dataISO + "T00:00:00").getDay(); // 0=Dom ... 6=Sáb
  const horariosDoDia = HORARIOS[String(diaSemana)] || [];

  const livres = [];
  for(const hhmm of horariosDoDia){
    const t = toMinutes(hhmm);
    const fimSlot = t + duracaoMin;
    const conflita = ocupados.some(o => t < o.fim && fimSlot > o.inicio);
    if(!conflita) livres.push(hhmm);
  }
  return livres;
}

function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function toHHMM(min){
  const h = String(Math.floor(min/60)).padStart(2,'0');
  const m = String(min%60).padStart(2,'0');
  return `${h}:${m}`;
}

async function stepWhatsapp(){
  await bot(`Show, <b>${primeiroNome(state.nome)}</b>! Me passa seu WhatsApp pra eu finalizar o cadastro?`);
  askFreeText(async (texto)=>{
    state.whatsapp = texto;
    // Salva lead parcial imediatamente (nome + whatsapp), mesmo antes de finalizar

function primeiroNome(nome){ return (nome||"").trim().split(" ")[0] || nome; }

function formatDataLegivel(dataISO){
  const d = new Date(dataISO + "T00:00:00");
  return d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'2-digit'});
}

async function stepConfirmacaoFinal(){
  const agg = servicoAgregado();
  await bot(`Então: <b>${agg.nome}</b>, ${formatDataLegivel(state.data)} às <b>${state.hora}</b>, <b>${BRL(agg.preco)}</b>. Posso confirmar, <b>${primeiroNome(state.nome)}</b>?`);

}

function renderOpcoesConfirmacaoFinal(){
  renderChoices([
    {label:"Confirmar agendamento", value:"confirmar"},
    {label:"Corrigir horário", value:"corrigir"},
    {label:"Tive dificuldade, chamar no WhatsApp", value:"whatsapp"}

    }

function capitalizar(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

// Monta o link do WhatsApp com o resumo do agendamento já preenchido
// (o wa.me só aceita texto, não dá pra mandar a fotinho por ele — a foto
// fica no cartão aqui no site mesmo).
function linkWhatsapp(agg){
  const texto =
    `Oi! Confirmando meu agendamento na *${STUDIO.nomeRaw}*:\n` +
    `${agg.nome} — ${formatDataLegivel(state.data)} às ${state.hora}\n` +
    `Nome: ${state.nome}`;
  const numero = "55" + STUDIO.whatsappApoio.replace(/\D/g, "");
  return `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
}

// Cartão-resumo oficial do agendamento: sem foto, sem animação chique —
// só o essencial em linhas com "✓", pra parecer um comprovante/carimbo.
// Montado elemento por elemento (nunca innerHTML de string gigante) e
// com fallback em texto puro se algo der errado — nunca fica em branco.
function mostrarCartaoConfirmacao({ confirmado }){
  try {
    const agg = servicoAgregado();
    const nota = "";

    const card = document.createElement('div');
    card.className = confirmado ? 'confirm-card confirmado' : 'confirm-card';

    const badge = document.createElement('span');
    badge.className = 'status-badge' + (confirmado ? ' ok' : '');
    badge.textContent = (confirmado ? '✓ Confirmado' : 'Confira antes de confirmar');
    card.appendChild(badge);

    const servicoNome = document.createElement('div');
    servicoNome.className = 'servico-nome';
    servicoNome.textContent = agg.nome + nota;
    card.appendChild(servicoNome);

    function addLinha(rotulo, valor){
      const linha = document.createElement('div');
      linha.className = 'linha';
      const check = document.createElement('span');
      check.className = 'check';
      check.textContent = '✓';
      const texto = document.createElement('span');
      texto.innerHTML = `<span class="rotulo">${rotulo}:</span> <b>${valor}</b>`;
      linha.appendChild(check);
      linha.appendChild(texto);
      card.appendChild(linha);
    }

    addLinha('Data', formatDataLegivel(state.data));
    addLinha('Horário', state.hora);
    addLinha('Valor', BRL(agg.preco));

    // Botão de WhatsApp só na versão FINAL (já confirmado) — na prévia
    // ele tirava a cliente do fluxo antes de finalizar o agendamento.
    if(confirmado){
      const waBtn = document.createElement('a');
      waBtn.className = 'wa-btn';
      waBtn.href = linkWhatsapp(agg);
      waBtn.target = '_blank';
      waBtn.rel = 'noopener';
      waBtn.textContent = '💬 Enviar no WhatsApp';
      card.appendChild(waBtn);
    }

    thread.appendChild(card);
    scrollBottom();
  } catch (err) {
    console.error("Erro ao montar o cartão de confirmação:", err);
    const agg = servicoAgregado();
    addMsg(
      `💅 <b>${agg.nome}</b><br>` +
      `📅 ${formatDataLegivel(state.data)} às <b>${state.hora}</b><br>` +
      `💰 ${BRL(agg.preco)} — ${STUDIO.formasPagamento}`,
      "bot"
    );
  }
}

// Balão de áudio estilo WhatsApp. Se o áudio (base64) ainda não tiver
// sido configurado, não mostra nada — assim dá pra deixar os pontos de
// chamada no código já prontos antes de ter os arquivos.
function mostrarAudio(base64Audio, duracaoLabel){
  if(!base64Audio) return;

  const barras = Array.from({length: 22}, () => 6 + Math.round(Math.random() * 14));

  const div = document.createElement('div');
  div.className = 'audio-msg';
  div.innerHTML = `
    <button class="audio-play" type="button" aria-label="Tocar áudio">
      <svg viewBox="0 0 24 24" fill="currentColor" class="icone-play"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" fill="currentColor" class="icone-pause" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="audio-wave">
      ${barras.map(h => `<span style="height:${h}px"></span>`).join('')}
    </div>
    <span class="audio-time">${duracaoLabel || ''}</span>
    <audio preload="none" src="${base64Audio}"></audio>
  `;
  thread.appendChild(div);
  scrollBottom();

  const audioEl = div.querySelector('audio');
  const btn = div.querySelector('.audio-play');
  const iconPlay = div.querySelector('.icone-play');
  const iconPause = div.querySelector('.icone-pause');
  const wave = div.querySelector('.audio-wave');
  const timeEl = div.querySelector('.audio-time');

  btn.addEventListener('click', () => {
    if(audioEl.paused){
      audioEl.play();
      iconPlay.style.display = 'none';
      iconPause.style.display = '';
      wave.classList.add('playing');
    } else {
      audioEl.pause();
    }
  });
  audioEl.addEventListener('pause', () => {
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
    wave.classList.remove('playing');
  });
  audioEl.addEventListener('ended', () => {
    iconPlay.style.display = '';
    iconPause.style.display = 'none';
    wave.classList.remove('playing');
    timeEl.textContent = duracaoLabel || '';
  });
  audioEl.addEventListener('timeupdate', () => {
    if(!isNaN(audioEl.duration)){
      const restante = Math.max(0, audioEl.duration - audioEl.currentTime);
      const m = Math.floor(restante / 60);
      const s = Math.floor(restante % 60).toString().padStart(2, '0');
      timeEl.textContent = `${m}:${s}`;
    }
  });
}

async function finalizarAgendamento(){
  await bot("Só um segundo, já confirmo aqui ⏳");
  const agg = servicoAgregado();
  try{
    const json = await rpc('criar_agendamento', {
      p_slug: SLUG, p_data: state.data, p_hora: state.hora, p_duracao: agg.duracao,
      p_servico: agg.nome, p_nome: state.nome, p_whatsapp: state.whatsapp, p_valor: agg.preco
    });
    if(!json.ok) throw new Error(json.erro || "erro ao agendar");

    state.agendamentos.push({
      servico: agg.nome,
      data: state.data,
      hora: state.hora
    });

    await bot(tom('finalizacao', {nome: primeiroNome(state.nome)}));
    mostrarAudio(AUDIO_FINAL, AUDIO_FINAL_DURACAO);
    if(STUDIO.googleReviewUrl){
      await bot(tom('avaliacao'));
      mostrarBotaoAvaliacao();
    }
    mostrarCartaoConfirmacao({ confirmado: true });
    mostrarBotaoComoChegar();
    renderChoices([
      {label:"Marcar outro horário", value:"novo"},
      {label:"Falar no WhatsApp", value:"whatsapp"}
    ], (v)=>{
      if(v === "whatsapp"){
        window.open(linkWhatsapp(agg), '_blank');
      } else {
        resetState();
        start();
      }
    });
  }catch(e){
    console.warn("Erro ao agendar:", e);
    await bot(`Deu um erro pra confirmar aqui pelo sistema 😕 Mas não se preocupa, <b>${primeiroNome(state.nome)}</b> — me chama no WhatsApp de apoio (${STUDIO.whatsappApoio}) que a gente confirma na mão: <b>${agg.nome}</b>, ${formatDataLegivel(state.data)} às ${state.hora}.`);
  }
}

async function salvarLeadParcial(s){
  return rpc('registrar_lead', {
    p_slug: SLUG, p_nome: s.nome, p_whatsapp: s.whatsapp,
    p_interesse: s.servicos.map(x=>x.nome).join(" + ") || null
  });
}

function resetState(){
  state.step = "start";
  state.categoria = null;
  state.servicos = [];
  state.data = null;
  state.hora = null;
  state.nome = null;
  state.whatsapp = null;
  state.history = [];
}

// ---------------------------------------------------------------------
// Entrada de texto livre (nome / whatsapp)
// Sem <form>/submit de propósito: em alguns ambientes de preview em
// iframe, o submit de formulário fica bloqueado — clique direto no
// botão + tecla Enter no campo funcionam em qualquer lugar.
// ---------------------------------------------------------------------
let pendingTextHandler = null;
let pendingEhNome = false;
const sendBtn = document.getElementById('sendBtn');

// Deixa cada palavra do nome com inicial maiúscula (ex.: "ana paula" -> "Ana Paula")
function capitalizarNome(str){
  return str.trim().split(/\s+/).map(palavra =>
    palavra.charAt(0).toLocaleUpperCase('pt-BR') + palavra.slice(1).toLocaleLowerCase('pt-BR')
  ).join(' ');
}

function askFreeText(handler, { ehNome=false, teclado='text' } = {}){
  pendingTextHandler = handler;
  pendingEhNome = ehNome;
  composer.style.display = 'flex';
  freeInput.value = '';
  freeInput.setAttribute('inputmode', teclado === 'tel' ? 'tel' : 'text');
  freeInput.setAttribute('type', teclado === 'tel' ? 'tel' : 'text');
  freeInput.setAttribute('placeholder', teclado === 'tel' ? '(00) 00000-0000' : 'Digite aqui...');
  freeInput.focus();
}

async function enviarTextoLivre(){
  let val = freeInput.value.trim();
  if(!val || !pendingTextHandler) return;
  if(pendingEhNome) val = capitalizarNome(val);
  addMsg(val, "user");
  freeInput.value = '';
  composer.style.display = 'none';
  const handler = pendingTextHandler;
  pendingTextHandler = null;
  await handler(val);
}

sendBtn.addEventListener('click', enviarTextoLivre);
freeInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    enviarTextoLivre();
  }
});

// ---------------------------------------------------------------------
// Painel "Agendamentos" (botão no header)
// ---------------------------------------------------------------------
const agendaBtn = document.getElementById('agendaBtn');
const agendaOverlay = document.getElementById('agendaOverlay');
const agendaLista = document.getElementById('agendaLista');
const fecharAgenda = document.getElementById('fecharAgenda');

function renderAgendaLista(lista){
  if(!lista || lista.length === 0){
    agendaLista.innerHTML = `<div class="agenda-empty">Nenhum agendamento encontrado pra esse número.</div>`;
    return;
  }
  agendaLista.innerHTML = lista.map((a, i) => `
    <div class="agenda-item">
      <div>
        <div class="ag-servico">${a.servico}</div>
        <div class="ag-data">${formatDataLegivel(a.data)} às ${a.hora}</div>
      </div>
      ${a.podeAlterar
        ? `<button type="button" class="ag-alterar-btn" data-idx="${i}">Alterar data</button>`
        : `<span class="ag-sem-alteracao">Fora do prazo p/ alterar</span>`
      }
    </div>
  `).join('');

  agendaLista.querySelectorAll('.ag-alterar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = lista[Number(btn.dataset.idx)];
      iniciarAlteracaoData(item);
    });
  });
}

// Formulário de busca por WhatsApp, mostrado dentro do próprio painel
// quando ainda não sabemos o número da cliente nesta conversa.
function renderBuscaWhatsapp(mensagemErro){
  agendaLista.innerHTML = `
    <div class="agenda-empty">Digite seu WhatsApp pra eu buscar seus agendamentos:</div>
    <div class="agenda-busca">
      <input type="tel" inputmode="tel" id="agendaWhatsappInput" placeholder="(00) 00000-0000">
      <button type="button" id="agendaWhatsappBtn">Buscar</button>
    </div>
    ${mensagemErro ? `<div class="agenda-erro">${mensagemErro}</div>` : ""}
  `;
  const input = document.getElementById('agendaWhatsappInput');
  const btn = document.getElementById('agendaWhatsappBtn');
  const disparar = () => {
    const val = input.value.trim();
    if(val) buscarAgendamentosPorWhatsapp(val);
  };
  btn.addEventListener('click', disparar);
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); disparar(); } });
  input.focus();
}

// Número já usado numa busca manual dentro do painel nesta sessão
// (separado do state.whatsapp, que só existe depois que ela agenda).
let whatsappConsultadoNoPainel = null;

// Handoff seguro dentro do painel: se a busca falhar, não deixa a
// cliente na mão com erro técnico — acolhe e já manda pro WhatsApp,
// igual ao padrão usado em todos os outros atendimentos (Harmoniziê etc).
function renderHandoffAgenda(){
  agendaLista.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'agenda-handoff';

  const texto = document.createElement('div');
  texto.className = 'agenda-handoff-texto';
  texto.textContent = 'Não consegui puxar seus agendamentos agora 😕 Mas fica tranquilo(a) — chama a gente no WhatsApp que a gente confirma certinho pra você.';
  wrap.appendChild(texto);

  const numero = '55' + STUDIO.whatsappApoio.replace(/\D/g, '');
  const textoWpp = 'Oi! Não consegui ver meus agendamentos pelo site, pode me ajudar?';
  const btn = document.createElement('a');
  btn.className = 'wa-btn';
  btn.href = `https://wa.me/${numero}?text=${encodeURIComponent(textoWpp)}`;
  btn.target = '_blank';
  btn.rel = 'noopener';
  btn.textContent = '💬 Chamar no WhatsApp';
  wrap.appendChild(btn);

  agendaLista.appendChild(wrap);
}

async function buscarAgendamentosPorWhatsapp(numero){
  whatsappConsultadoNoPainel = numero;
  agendaLista.innerHTML = `<div class="agenda-empty">Buscando...</div>`;
  try{
    const json = await rpc('meus_agendamentos', { p_slug: SLUG, p_whatsapp: numero });
    if(!json.ok) throw new Error("erro ao buscar");
    renderAgendaLista(json.agendamentos);
  }catch(e){
    console.warn("Falha ao buscar agendamentos:", e);
    renderHandoffAgenda();
  }
}

// Busca os agendamentos reais na planilha (aba "Agenda") pelo WhatsApp:
// usa o que já foi informado nesta conversa (ou já buscado manualmente
// no painel); se ainda não tiver nenhum, pede o número ali mesmo.
async function abrirPainelAgendamentos(){
  agendaOverlay.classList.add('open');

  const numero = state.whatsapp || whatsappConsultadoNoPainel;
  if(!numero){
    renderBuscaWhatsapp();
    return;
  }

  agendaLista.innerHTML = `<div class="agenda-empty">Buscando seus agendamentos...</div>`;
  try{
    const json = await rpc('meus_agendamentos', { p_slug: SLUG, p_whatsapp: numero });
    if(!json.ok) throw new Error("erro ao buscar");
    renderAgendaLista(json.agendamentos);
  }catch(e){
    console.warn("Falha ao buscar agendamentos:", e);
    renderHandoffAgenda();
  }
}

agendaBtn.addEventListener('click', abrirPainelAgendamentos);
fecharAgenda.addEventListener('click', ()=> agendaOverlay.classList.remove('open'));
agendaOverlay.addEventListener('click', (e)=>{
  if(e.target === agendaOverlay) agendaOverlay.classList.remove('open');
});

// ---------------------------------------------------------------------
// Config por cliente (Supabase) + Boot
// ---------------------------------------------------------------------
function aplicarConfig(cfg){
  const c = cfg.config || {};
  const apenasDigitos = v => (v||"").replace(/\D/g,"");

  // Mídia embutida no arquivo é só da Carolina: nunca vaza pra outro negócio
  if(true){
    FOTOS_TRABALHOS = []; FOTO_RESPONSAVEL = null; AUDIO_FINAL = null;
    const ini = encodeURIComponent((c.nome_negocio||"?").trim().charAt(0).toUpperCase());
    document.getElementById('logoImg').src = "data:image/svg+xml;utf8," +
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' fill='%23ffffff'/><text x='20' y='27' font-size='22' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='${encodeURIComponent(c.cor_escura||"#8F5F5A")}'>${ini}</text></svg>`;
    thread.style.backgroundImage = "none";
  }
  TOM = c.tom_voz || {};
  STUDIO = {
    nome: esc(c.nome_negocio),
    nomeRaw: c.nome_negocio,
    responsavel: esc(c.responsavel || c.nome_negocio),
    nomeAssistente: esc(c.nome_assistente || "Iza"),
    endereco: esc(c.endereco || ""),
    mapsUrl: c.maps_url || null,
    whatsappApoio: apenasDigitos(c.whatsapp_apoio),
    diasAtendimento: Object.keys(cfg.horarios||{}).filter(k=>(cfg.horarios[k]||[]).length).map(Number),
    formasPagamento: c.formas_pagamento || "",
    sinal: !!c.sinal,
    cancelamento: c.cancelamento || "",
    atendeDomicilio: !!c.atende_domicilio,
    googleReviewUrl: c.google_review_url || null,
    diasFrente: c.dias_frente || 60
  };
  HORARIOS = cfg.horarios || {};
  SERVICOS = (cfg.servicos||[]).map(x=>({
    id: x.id, categoria: x.categoria, nome: esc(x.nome),
    duracao: x.duracao, preco: x.preco==null ? null : Number(x.preco),
    confirmado: !!x.confirmado, incluiEsmaltacao: !!x.incluiExtra
  }));
  PERIODOS_BLOQUEADOS = (cfg.bloqueios||[]).map(b=>({ inicio:b.inicio, fim:b.fim, motivo:b.motivo }));

  // Mídia: usa a do cliente quando existir; senão mantém a embutida (Carolina, até migrar pro Storage)
  if(c.foto_responsavel_url) FOTO_RESPONSAVEL = c.foto_responsavel_url;
  if(c.audio_final_url){ AUDIO_FINAL = c.audio_final_url; AUDIO_FINAL_DURACAO = c.audio_final_duracao || "0:10"; }
  if(cfg.galeria && cfg.galeria.length) FOTOS_TRABALHOS = cfg.galeria;
  if(c.logo_url) document.getElementById('logoImg').src = c.logo_url;

  // Identidade visual
  const root = document.documentElement.style;
  if(c.cor_primaria) root.setProperty('--wine', c.cor_primaria);
  if(c.cor_escura)   root.setProperty('--wine-deep', c.cor_escura);
  if(c.cor_destaque) root.setProperty('--gold', c.cor_destaque);
  if(c.cor_suave)    root.setProperty('--blush', c.cor_suave);
  if(c.cor_fundo)    root.setProperty('--cream', c.cor_fundo);

  document.getElementById('hdrNome').innerHTML = STUDIO.nomeAssistente;
  document.getElementById('hdrBrand').innerHTML = STUDIO.nome;
  document.title = (c.nome_negocio||'Agendamento') + " — Agendamento";
  document.getElementById('logoBadge').style.visibility = 'visible';
}

async function boot(){
  try{
    if(!SLUG) throw new Error("link sem negócio (use ?c=seu-endereco)");
    const cfg = await rpc('get_public_config', { p_slug: SLUG });
    if(!cfg || !cfg.config) throw new Error("negócio não encontrado: " + SLUG);
    aplicarConfig(cfg);
  }catch(e){
    console.error("Falha ao carregar configuração:", e);
    thread.style.backgroundImage = 'none';
    document.getElementById('thread').innerHTML =
      '<div style="padding:32px 20px;text-align:center;color:#8F5F5A;font-family:sans-serif">Não consegui abrir o atendimento agora 😕<br>Tenta de novo em instantes.</div>';
    return;
  }
  start();
}
boot();
