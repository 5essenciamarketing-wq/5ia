<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numen — Agendamento e gestão na nuvem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02031B; --card:#0D0F2E; --ink:#EEF0FF; --muted:#9AA0C8; --line:#23264F;
  --brand:#4F7BF0; --brand-deep:#9B7BFF; --soft:#161943; --ok:#3DDC97; --err:#FF6B7A;
  --grad:linear-gradient(135deg,#3B6FE0 0%,#8B5CF6 100%);
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'DM Sans',sans-serif;letter-spacing:-.02em;margin:0 0 .4em;line-height:1.15}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:.3em 0 1em;color:var(--muted)}
a{color:var(--brand-deep)}
.hidden{display:none!important}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;letter-spacing:-.01em}
.logo img{height:30px;width:auto;}
.logo-big{display:block;margin:0 auto 16px;width:230px;max-width:72%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}

/* forms */
label{display:block;font-weight:600;font-size:.85rem;margin:14px 0 6px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
input[type=color]{padding:2px;height:44px;cursor:pointer}
input[type=checkbox]{width:auto}
textarea{min-height:76px;resize:vertical}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 22px;background:var(--grad);color:#fff;cursor:pointer;box-shadow:0 4px 18px rgba(99,102,241,.35)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:7px 14px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--err);border:1.5px solid var(--line);box-shadow:none}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}
.msg{margin-top:10px;font-size:.9rem}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)}

/* auth */
.auth{max-width:420px;margin:7vh auto;padding:0 16px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px;margin-bottom:18px}
.tabs button{flex:1;font:inherit;font-weight:600;border:0;background:transparent;padding:9px;border-radius:999px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* wizard */
.steps{display:flex;gap:6px;margin:6px 0 20px}
.steps span{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps span.on{background:var(--grad)}

/* dashboard */
.dash{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:18px 0}
@media(max-width:820px){.dash{grid-template-columns:1fr}}
.nav{display:flex;flex-direction:column;gap:4px}
@media(max-width:980px){.nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.nav button{font:inherit;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button.on{background:var(--soft);color:var(--brand-deep);font-weight:700}
.preview{position:sticky;top:78px;align-self:start}
.phone{width:min(390px,100%);height:min(780px,calc(100vh - 150px));min-height:520px;margin:0 auto;border:10px solid #1b1e4a;border-radius:38px;overflow:hidden;background:#fff}
.phone iframe{width:100%;height:100%;border:0}

/* chips / lists */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--soft);color:var(--brand-deep);border-radius:999px;padding:5px 6px 5px 12px;font-weight:600;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--brand-deep);font-size:1rem;line-height:1}
.dia{border-top:1px solid var(--line);padding:12px 0}
.dia:first-child{border-top:0}
.dia-head{display:flex;align-items:center;gap:10px;font-weight:700}
.dia-add{display:flex;gap:8px;max-width:240px;margin-top:6px}
.item{display:grid;gap:8px;grid-template-columns:2fr 1.2fr .8fr .8fr auto;align-items:end;border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0}
@media(max-width:700px){.item{grid-template-columns:1fr 1fr}.item .full{grid-column:1/-1}}
.item label{margin:0 0 4px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;background:rgba(0,0,0,.6);color:#fff}
.presets{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.presets{grid-template-columns:1fr}}
.preset{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:var(--ink)}
.preset.on{border-color:var(--brand);background:var(--soft)}
.preset b{display:block}
.preset span{font-size:.85rem;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}
.kv:first-child{border-top:0}
.tag{font-size:.75rem;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--brand-deep)}
.linkbox{display:flex;gap:8px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);margin:3px 0}
.check.done{color:var(--ok)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:1.45rem;letter-spacing:-.02em}
.bar{height:8px;border-radius:9px;background:var(--grad);min-width:4px}
.ag-dia{margin-top:14px}.ag-dia h3{margin:0 0 6px;font-size:.95rem;color:var(--muted);text-transform:capitalize}
.ag{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ag .h{font-weight:700;font-variant-numeric:tabular-nums}.ag .h small{display:block;color:var(--muted);font-weight:500}
.ag.bloq{opacity:.7;border-style:dashed}
.ag.cancel{opacity:.5}.ag.cancel .quem{text-decoration:line-through}
.ag .quem{font-weight:600}.ag .sub{color:var(--muted);font-size:.88rem}
.ag .acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:640px){.ag{grid-template-columns:70px 1fr}.ag .acoes{grid-column:1/-1;justify-content:flex-start}}
.tag.ok{background:rgba(61,220,151,.15);color:var(--ok)}.tag.warn{background:rgba(255,107,122,.15);color:var(--err)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 4px}
.toolbar .grow{flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1e4a;border:1px solid var(--line);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
</style>
</head>

/* ---------- utilidades ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==='class') el.className = v;
    else if(k==='value') el.value = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if(c==null||c===false) return; el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
const $ = (sel, root=document) => root.querySelector(sel);

/* ---------- carregamento ---------- */
async function carregarTudo(linha){
  let t = linha;
  if(!t && EMBED){
    const r = await sb.from('tenants').select('*').eq('slug', EMBED.slug).maybeSingle();   // só enxerga se for a dona (ou equipe)
    t = r.data;
  }
  if(!t){ const r = await sb.from('tenants').select('*').eq('owner_id', S.user.id).maybeSingle(); t = r.data; }
  S.tenant = t;
  if(!t) return;
  if(EMBED && S.firstEmbed === undefined){ S.firstEmbed = true; }
  const id = t.id;
  const [c,hs,sv,bl,gl] = await Promise.all([
    sb.from('tenant_config').select('*').eq('tenant_id',id).single(),
    sb.from('tenant_horarios').select('dia_semana,hora').eq('tenant_id',id),
    sb.from('tenant_servicos').select('*').eq('tenant_id',id).order('ordem'),
    sb.from('tenant_bloqueios').select('*').eq('tenant_id',id).order('inicio'),
    sb.from('tenant_galeria').select('*').eq('tenant_id',id).order('ordem')
  ]);
  S.cfg = c.data || {};
  S.horarios = {};
  (hs.data||[]).forEach(r => { (S.horarios[r.dia_semana] ||= []).push(r.hora.slice(0,5)); });
  Object.values(S.horarios).forEach(a => a.sort());
  S.servicos = sv.data || [];
  S.bloqueios = bl.data || [];
  S.galeria = gl.data || [];
}
async function carregarAgenda(){
  const hoje = new Date().toLocaleDateString('sv-SE');
  const [a,l] = await Promise.all([
    sb.from('agendamentos').select('*').eq('tenant_id',S.tenant.id).gte('data',hoje).order('data').order('hora').limit(200),
    sb.from('leads').select('*').eq('tenant_id',S.tenant.id).order('created_at',{ascending:false}).limit(100)
  ]);
  S.agenda = a.data || []; S.leads = l.data || [];
}

/* ---------- AUTH ---------- */
function viewAuth(){
  let modo = 'entrar';
  const msg = h('div',{class:'msg'});
  const email = h('input',{type:'email',placeholder:'voce@email.com',autocomplete:'email'});
  const senha = h('input',{type:'password',placeholder:'mínimo 6 caracteres',autocomplete:'current-password'});
  const btn = h('button',{class:'btn',type:'button'},'Entrar');
  const tEntrar = h('button',{type:'button',class:'on'},'Entrar');
  const tCriar  = h('button',{type:'button'}, 'Criar conta');
  const setModo = m => { modo=m; tEntrar.classList.toggle('on',m==='entrar'); tCriar.classList.toggle('on',m==='criar'); btn.textContent = m==='entrar'?'Entrar':'Criar minha conta'; msg.textContent=''; };
  tEntrar.onclick = () => setModo('entrar'); tCriar.onclick = () => setModo('criar');

  async function enviar(){
    msg.className='msg'; msg.textContent='';
    if(!email.value || senha.value.length<6){ msg.className='msg err'; msg.textContent='Informe e-mail e uma senha de pelo menos 6 caracteres.'; return; }
    btn.disabled = true;
    try{
      if(modo==='entrar'){
        const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: senha.value });
        if(error) throw error;
      }else{
        const { data, error } = await sb.auth.signUp({ email: email.value.trim(), password: senha.value, options:{ emailRedirectTo: location.origin + location.pathname } });
        if(error) throw error;
        if(!data.session){ msg.className='msg ok'; msg.textContent='Conta criada! Confirme o e-mail que enviamos e depois entre aqui.'; btn.disabled=false; return; }
      }
    }catch(e){
      msg.className='msg err';
      msg.textContent = /Invalid login/i.test(e.message) ? 'E-mail ou senha incorretos.' : (/already/i.test(e.message) ? 'Esse e-mail já tem conta. Use "Entrar".' : e.message);
      btn.disabled=false;
    }
  }
  btn.onclick = enviar;
  senha.addEventListener('keydown', e => { if(e.key==='Enter') enviar(); });

  $app.replaceChildren(h('div',{class:'auth'},
    h('img',{class:'logo-big',src:LOGO_FULL,alt:'Numen'}),
    h('p',{style:'text-align:center'}, 'Sistema inteligente de agendamento e gestão na nuvem'),
    h('div',{class:'card'},
      EMBED ? null : h('div',{class:'tabs'},tEntrar,tCriar),
      h('label',{},'E-mail'),email,
      h('label',{},'Senha'),senha,
      h('div',{class:'actions'},btn), msg)));
}

/* ---------- componentes de formulário ---------- */
function campo(label, key, opts={}){
  const el = opts.area ? h('textarea',{placeholder:opts.ph||''}) : h('input',{type:opts.type||'text',placeholder:opts.ph||'',inputmode:opts.mode});
  el.value = S.cfg[key] ?? '';
  el.dataset.key = key; if(opts.num) el.dataset.num = '1';
  return h('div',{},h('label',{},label,opts.hint?h('small',{}, ' — '+opts.hint):null),el);
}
function lerCampos(root){
  const out = {};
  root.querySelectorAll('[data-key]').forEach(el => {
    let v = el.value.trim();
    out[el.dataset.key] = el.dataset.num ? (v===''?null:Number(v)) : (v===''?null:v);
  });
  return out;
}
async function salvarConfig(patch){
  const { error } = await sb.from('tenant_config').update({ ...patch, updated_at: new Date().toISOString() }).eq('tenant_id', S.tenant.id);
  if(error) throw error;
  Object.assign(S.cfg, patch);
}

async function enviarArquivo(file, prefixo, imagem){
  let blob = file, ext = (file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5);
  let type = file.type;
  if(imagem){ blob = await reduzirImagem(file, 1100); type = blob.type; ext = type==='image/png' ? 'png' : 'jpg'; }
  const path = `${S.tenant.id}/${prefixo}-${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('media').upload(path, blob, { contentType:type, upsert:true });
  if(error) throw error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
function reduzirImagem(file, max){
  return new Promise((res,rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const png = file.type==='image/png';
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('Imagem inválida')); }, png?'image/png':'image/jpeg', .86);
    };
    img.onerror = () => rej(new Error('Não consegui ler a imagem'));
    img.src = url;
  });
}
function duracaoAudio(file){
  return new Promise(res => {
    const a = new Audio(URL.createObjectURL(file));
    a.onloadedmetadata = () => { const s = Math.round(a.duration||0); res(Math.floor(s/60)+':'+String(s%60).padStart(2,'0')); };
    a.onerror = () => res('0:10');
  });
}

  const slug = h('input',{placeholder:'studio-bela'});
  const msg = h('div',{class:'msg'});
  let mexeuSlug = false;
  nome.oninput = () => { if(!mexeuSlug) slug.value = slugify(nome.value); };
  slug.oninput = () => { mexeuSlug = true; slug.value = slugify(slug.value); };
  const btn = h('button',{class:'btn',type:'button',onclick:async()=>{
    msg.className='msg'; msg.textContent='';
    if(!nome.value.trim() || slug.value.length<3){ msg.className='msg err'; msg.textContent='Informe o nome e um endereço com pelo menos 3 letras.'; return; }
    btn.disabled=true;
    const { data, error } = await sb.rpc('criar_meu_negocio',{ p_slug:slug.value, p_nome:nome.value.trim() });
    if(error || !data?.ok){ msg.className='msg err'; msg.textContent = data?.erro==='slug_em_uso' ? 'Esse endereço já está em uso. Tente outro.' : (data?.erro==='ja_possui_negocio' ? 'Sua conta já tem um negócio.' : (error?.message||'Erro ao criar.')); btn.disabled=false; return; }
    await carregarTudo(); S.wizard = true; S.step = 0; render();
  }},'Começar');
  $app.replaceChildren(topbar(), h('div',{class:'auth'},
    h('h1',{},'Vamos criar seu atendimento'),
    h('p',{},'Em 6 passos rápidos você deixa tudo pronto. Depois é só divulgar o link.'),
    h('div',{class:'card'},
      h('label',{},'Nome do seu negócio'),nome,
      h('label',{},'Endereço do seu atendimento ',h('small',{},'— vira o link que você divulga')),slug,
      h('p',{style:'margin-top:6px;font-size:.85rem'},'Ex.: ',h('b',{},'.../studio-bela')),
      h('div',{class:'actions'},btn),msg)));
}

function viewWizard(){
  const key = ORDEM[S.step], sec = SECOES[key];
  const inst = sec.render();
  const msg = h('div',{class:'msg'});
  const avancar = h('button',{class:'btn',type:'button',onclick:async()=>{
    avancar.disabled = true; msg.textContent='';
    try{
      await inst.salvar();
      if(S.step < ORDEM.length-1){ S.step++; render(); } else { S.wizard=false; S.tab='simular'; render(); }
    }catch(e){ msg.className='msg err'; msg.textContent=e.message; avancar.disabled=false; }
  }}, S.step===ORDEM.length-1 ? 'Concluir' : 'Salvar e continuar');
  const pular = h('button',{class:'btn ghost',type:'button',onclick:()=>{ if(S.step<ORDEM.length-1){S.step++;render();}else{S.wizard=false;S.tab='link';render();} }},'Pular');
  const voltar = S.step>0 ? h('button',{class:'btn ghost',type:'button',onclick:()=>{S.step--;render();}},'Voltar') : null;
  $app.replaceChildren(topbar(), h('div',{class:'wrap',style:'max-width:720px;padding-top:24px;padding-bottom:50px'},
    h('div',{class:'steps'}, ORDEM.map((_,i)=>h('span',{class:i<=S.step?'on':''}))),
    h('p',{style:'margin:0;font-size:.85rem'},`Passo ${S.step+1} de ${ORDEM.length}`),
    h('h1',{},sec.titulo), h('p',{},sec.desc),
    h('div',{class:'card'}, inst.root),
    h('div',{class:'actions'},voltar,avancar,pular), msg));
}

const ABAS_CFG = [['negocio','Negócio'],['horarios','Horários'],['servicos','Serviços'],['bloqueios','Períodos fechados'],['visual','Visual e mídia'],['tom','Tom de voz'],...(EMBED?[]:[['contexto','Conte mais']]),['simular','Testar atendimento']];

                         : [...ABAS_CFG,['link','Enviar para criação']];

function progresso(){
  const itens = [
    ['Dados do negócio', !!(S.cfg.nome_negocio && S.cfg.whatsapp_apoio)],
    ['Horários definidos', Object.keys(S.horarios).length>0],
    ['Serviços cadastrados', S.servicos.length>0],
    ['Foto ou logo enviados', !!(S.cfg.logo_url || S.cfg.foto_responsavel_url)],
  ];
  return itens;
}

function viewDash(){
  const faixa = S.adminEditando ? h('div',{class:'card',style:'margin:14px 0 0;padding:10px 16px;font-size:.9rem'},'Editando como equipe Numen: ',h('b',{},S.cfg.nome_negocio||S.tenant.slug)) : null;
  const nav = h('div',{class:'nav'}, abas().map(([k,l]) => h('button',{type:'button',class:S.tab===k?'on':'',onclick:()=>{S.tab=k;render();}},l)));
  const main = h('div');
  $app.replaceChildren(topbar(), h('div',{class:'wrap'}, faixa, h('div',{class:'dash'}, nav, main)));

  if(S.tab==='simular') return desenharSimular(main);
  if(S.tab==='agenda') return desenharAgenda(main);
  if(S.tab==='resumo') return desenharResumo(main);
  if(S.tab==='clientes') return desenharClientes(main);
  if(S.tab==='link') return desenharLink(main);

  const sec = SECOES[S.tab], inst = sec.render();

/* ---------- helpers de data ---------- */
const isoDia = d => d.toLocaleDateString('sv-SE');
const addDias = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
function inicioSemana(d){ const x = new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
function fimHora(hora, min){ const [h,m] = hora.slice(0,5).split(':').map(Number); const t = h*60+m+min; return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
const nomeDia = iso => new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
const zapLink = n => n ? 'https://wa.me/' + (n.length<=11 ? '55'+n : n) : null;
S.sem = inicioSemana(new Date());

const STATUS_COR = { 'Concluído':'ok', 'Cancelado':'warn', 'Faltou':'warn' };

async function mudarStatus(a, novo, main){
  const { error } = await sb.from('agendamentos').update({ status:novo, updated_at:new Date().toISOString() }).eq('id',a.id);
  if(error){ toast('Erro: '+error.message); return; }
  toast(novo==='Agendado' ? 'Reaberto' : 'Marcado como '+novo.toLowerCase()); desenharAgenda(main);
}

function formAgendamento(main, tipo){
  const bloqueio = tipo === 'bloqueio';
  const hoje = isoDia(new Date());
  const f = { servico:'', nome:'', whats:'', data:hoje, hora:'09:00', dur:60, valor:'' };
  const msg = h('div',{class:'msg'});
  const inp = (k,attrs) => h('input',{...attrs,value:f[k],oninput:e=>f[k]=e.target.value});
  let selServ = null, inpDur, inpValor, inpServ;
  if(!bloqueio){
    selServ = h('select',{onchange:e=>{
      const sv = S.servicos.find(x=>x.id===e.target.value);
      if(sv){ f.servico = sv.nome; f.dur = sv.duracao_min||60; f.valor = sv.preco??''; inpServ.value = sv.nome; inpDur.value = f.dur; inpValor.value = f.valor; }
    }}, h('option',{value:''},'Escolher serviço cadastrado...'), S.servicos.map(sv => h('option',{value:sv.id},`${sv.nome} · ${sv.duracao_min||'?'} min`)));
    inpServ = inp('servico',{placeholder:'Ou digite o serviço'});
  }
  inpDur = inp('dur',{type:'number',inputmode:'numeric'});
  if(!bloqueio) inpValor = inp('valor',{type:'number',inputmode:'decimal',step:'0.01'});
  const salvar = h('button',{class:'btn',type:'button',onclick:async()=>{
    msg.className='msg'; msg.textContent='';
    const nome = bloqueio ? (f.servico||'Bloqueio') : f.nome;
    if(!bloqueio && (!f.nome.trim() || !f.servico.trim())){ msg.className='msg err'; msg.textContent='Informe o nome da cliente e o serviço.'; return; }
    salvar.disabled = true;
    const { data, error } = await sb.rpc('agendar_manual',{ p_tenant:S.tenant.id, p_data:f.data, p_hora:f.hora, p_duracao:Number(f.dur),
      p_servico: bloqueio ? (f.servico||'Bloqueio') : f.servico.trim(), p_nome:nome, p_whatsapp:f.whats||null,
      p_valor: bloqueio ? null : (f.valor===''?null:Number(f.valor)), p_bloqueio:bloqueio });
    if(error || !data?.ok){ msg.className='msg err'; msg.textContent = data?.erro==='conflito' ? 'Esse horário já está ocupado.' : (error?.message || 'Não consegui salvar.'); salvar.disabled=false; return; }
    S.sem = inicioSemana(new Date(f.data+'T12:00:00')); toast(bloqueio?'Horário bloqueado ✓':'Agendamento criado ✓'); desenharAgenda(main);
  }},'Salvar');
  return h('div',{class:'card'}, h('h3',{},bloqueio?'Bloquear horário':'Novo agendamento'),
    bloqueio ? h('div',{},h('label',{},'Motivo'),inp('servico',{placeholder:'Ex.: almoço, consulta, folga'})) :
      h('div',{}, h('div',{class:'row'},h('div',{},h('label',{},'Cliente'),inp('nome',{placeholder:'Nome'})),h('div',{},h('label',{},'WhatsApp'),inp('whats',{inputmode:'tel',placeholder:'47999999999'}))),
        h('label',{},'Serviço'),selServ,h('div',{style:'margin-top:8px'},inpServ)),
    h('div',{class:'row'},h('div',{},h('label',{},'Data'),inp('data',{type:'date'})),h('div',{},h('label',{},'Hora'),inp('hora',{type:'time'}))),
    h('div',{class:'row'},h('div',{},h('label',{},'Duração (min)'),inpDur),bloqueio?h('div'):h('div',{},h('label',{},'Valor (R$)'),inpValor)),
    h('div',{class:'actions'},salvar,h('button',{class:'btn ghost',type:'button',onclick:()=>desenharAgenda(main)},'Cancelar')),msg);
}

function linhaAgendamento(a, main){
  const bloq = a.origem === 'bloqueio';
  const fim = fimHora(a.hora, a.duracao_min);
  const zap = zapLink(a.whatsapp);
  const btn = (rot,fn,cls) => h('button',{class:'btn sm '+(cls||'ghost'),type:'button',onclick:fn},rot);
  let acoes = [];
  if(bloq) acoes = [btn('Remover', async()=>{ await sb.from('agendamentos').delete().eq('id',a.id); desenharAgenda(main); },'danger')];
  else if(a.status === 'Agendado') acoes = [
    btn('Concluir',()=>mudarStatus(a,'Concluído',main),''),
    btn('Remarcar',()=>remarcar(a,main)),
    btn('Faltou',()=>mudarStatus(a,'Faltou',main)),
    btn('Cancelar',()=>{ if(confirm('Cancelar este agendamento?')) mudarStatus(a,'Cancelado',main); },'danger')];
  else acoes = [btn('Reabrir',()=>mudarStatus(a,'Agendado',main))];
  return h('div',{class:'ag'+(bloq?' bloq':'')+(a.status==='Cancelado'?' cancel':'')},
    h('div',{class:'h'}, a.hora.slice(0,5), h('small',{},'até '+fim)),
    h('div',{}, h('div',{class:'quem'}, bloq ? '⛔ '+a.servico : a.nome),
      bloq ? null : h('div',{class:'sub'}, [a.servico, brl(a.valor), zap?null:null].filter(Boolean).join(' · '),
        zap ? [' · ', h('a',{href:zap,target:'_blank',rel:'noopener'},'WhatsApp')] : null)),
    h('div',{class:'acoes'}, bloq?null:h('span',{class:'tag '+(STATUS_COR[a.status]||'')},a.status), acoes));
}

function remarcar(a, main){
  const d = h('input',{type:'date',value:a.data}), t = h('input',{type:'time',value:a.hora.slice(0,5)});
  const msg = h('div',{class:'msg'});
  const box = h('div',{class:'card'}, h('h3',{},'Remarcar '+a.nome), h('div',{class:'row'},h('div',{},h('label',{},'Nova data'),d),h('div',{},h('label',{},'Nova hora'),t)),
    h('div',{class:'actions'}, h('button',{class:'btn',type:'button',onclick:async()=>{
      const { data, error } = await sb.rpc('mover_agendamento',{ p_id:a.id, p_data:d.value, p_hora:t.value });
      if(error || !data?.ok){ msg.className='msg err'; msg.textContent = data?.erro==='conflito' ? 'Esse horário já está ocupado.' : (error?.message||'Não consegui remarcar.'); return; }
      S.sem = inicioSemana(new Date(d.value+'T12:00:00')); toast('Remarcado ✓'); desenharAgenda(main);
    }},'Confirmar'), h('button',{class:'btn ghost',type:'button',onclick:()=>desenharAgenda(main)},'Voltar')), msg);
  main.replaceChildren(h('h2',{},'Agenda'), box);
}

async function desenharAgenda(main){
  main.replaceChildren(h('h2',{},'Agenda'), h('p',{},'Carregando...'));
  const ini = S.sem, fim = addDias(ini,6);
  const { data } = await sb.from('agendamentos').select('*').eq('tenant_id',S.tenant.id).gte('data',isoDia(ini)).lte('data',isoDia(fim)).order('data').order('hora');
  const por = {}; (data||[]).forEach(a => (por[a.data] ||= []).push(a));
  const dias = Array.from({length:7},(_,i)=>isoDia(addDias(ini,i)));
  const hoje = isoDia(new Date());
  const falta = progresso().filter(p=>!p[1]);
  const fmt = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});

  const corpo = dias.filter(d => por[d] || d===hoje).map(d => h('div',{class:'ag-dia'},
    h('h3',{}, nomeDia(d) + (d===hoje?' · hoje':'')),
    por[d] ? por[d].map(a => linhaAgendamento(a,main)) : h('p',{style:'margin:0'},'Nada marcado.')));
  main.replaceChildren(h('h2',{},'Agenda'),
    falta.length ? h('div',{class:'card'}, h('h3',{},'Falta pouco para o atendimento ficar completo'), progresso().map(([l,ok])=>h('div',{class:'check'+(ok?' done':'')},ok?'✓':'○',' ',l))) : null,
    h('div',{class:'toolbar'},
      h('button',{class:'btn sm ghost',type:'button',onclick:()=>{S.sem=addDias(S.sem,-7);desenharAgenda(main);}},'‹'),
      h('b',{},`${fmt(ini)} a ${fmt(fim)}`),
      h('button',{class:'btn sm ghost',type:'button',onclick:()=>{S.sem=addDias(S.sem,7);desenharAgenda(main);}},'›'),
      h('button',{class:'btn sm ghost',type:'button',onclick:()=>{S.sem=inicioSemana(new Date());desenharAgenda(main);}},'Hoje'),
      h('span',{class:'grow'}),
      h('button',{class:'btn sm',type:'button',onclick:()=>main.replaceChildren(h('h2',{},'Agenda'),formAgendamento(main,'agendamento'))},'+ Agendamento'),
      h('button',{class:'btn sm ghost',type:'button',onclick:()=>main.replaceChildren(h('h2',{},'Agenda'),formAgendamento(main,'bloqueio'))},'Bloquear horário')),
    ...(corpo.length ? corpo : [h('p',{},'Nenhum agendamento nesta semana.')]));
}

async function desenharResumo(main){
  main.replaceChildren(h('h2',{},'Resumo'), h('p',{},'Carregando...'));
  const mes = S.mes || isoDia(new Date()).slice(0,7);
  const [ano,m] = mes.split('-').map(Number);
  const ini = `${mes}-01`, fim = isoDia(new Date(ano, m, 0, 12));
  const { data } = await sb.from('agendamentos').select('*').eq('tenant_id',S.tenant.id).gte('data',ini).lte('data',fim);
  const L = (data||[]).filter(a => a.origem !== 'bloqueio');
  const soma = arr => arr.reduce((t,a)=>t+Number(a.valor||0),0);
  const conc = L.filter(a=>a.status==='Concluído'), agend = L.filter(a=>a.status==='Agendado'),
        canc = L.filter(a=>a.status==='Cancelado'), falt = L.filter(a=>a.status==='Faltou');
  const realizado = soma(conc), previsto = realizado + soma(agend);
  const ticket = conc.length ? realizado/conc.length : 0;
  const perdidos = canc.length + falt.length, base = L.length;
  const taxa = base ? Math.round(perdidos/base*100) : 0;

  const porServ = {}; L.filter(a=>a.status!=='Cancelado').forEach(a => { const k=a.servico; (porServ[k] ||= {n:0,v:0}); porServ[k].n++; porServ[k].v += Number(a.valor||0); });
  const topServ = Object.entries(porServ).sort((a,b)=>b[1].v-a[1].v).slice(0,8); const maxV = Math.max(1,...topServ.map(x=>x[1].v));
  const porDia = [0,0,0,0,0,0,0]; L.filter(a=>a.status!=='Cancelado').forEach(a => porDia[new Date(a.data+'T12:00:00').getDay()]++); const maxD = Math.max(1,...porDia);
  const nd = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  const kpi = (r,v) => h('div',{class:'kpi'},h('span',{},r),h('b',{},v));
  const mesInp = h('input',{type:'month',value:mes,style:'max-width:190px',onchange:e=>{ S.mes=e.target.value||mes; desenharResumo(main); }});
  main.replaceChildren(h('h2',{},'Resumo'), h('div',{class:'toolbar'}, mesInp),
    h('div',{class:'kpis'}, kpi('Faturamento realizado',brl(realizado)||'R$ 0,00'), kpi('Previsto no mês',brl(previsto)||'R$ 0,00'), kpi('Atendimentos concluídos',conc.length),
      kpi('Ainda agendados',agend.length), kpi('Ticket médio',brl(ticket)||'R$ 0,00'), kpi('Cancelamentos',canc.length), kpi('Faltas',falt.length), kpi('Perdas (cancel. + faltas)',taxa+'%')),
    h('p',{style:'margin-top:-4px;font-size:.85rem'},'O faturamento realizado conta os atendimentos que você marcou como "Concluído" na Agenda.'),
    h('div',{class:'card'}, h('h3',{},'Serviços que mais faturam'), topServ.length ? topServ.map(([k,v]) => h('div',{style:'margin:10px 0'},
      h('div',{style:'display:flex;justify-content:space-between;font-size:.92rem'},h('span',{},k),h('span',{style:'color:var(--muted)'},`${v.n}× · ${brl(v.v)}`)),
      h('div',{class:'bar',style:`width:${Math.max(3,v.v/maxV*100)}%`}))) : h('p',{},'Sem dados neste mês.')),
    h('div',{class:'card'}, h('h3',{},'Movimento por dia da semana'), h('div',{style:'display:flex;gap:8px;align-items:flex-end;height:110px;margin-top:10px'},
      porDia.map((n,i)=>h('div',{style:'flex:1;text-align:center;font-size:.8rem;color:var(--muted)'}, h('div',{style:'color:var(--ink);font-weight:600'},n||''), h('div',{class:'bar',style:`height:${Math.max(4,n/maxD*70)}px;margin:4px 0`}), nd[i])))));
}

async function desenharClientes(main){
  main.replaceChildren(h('h2',{},'Clientes'), h('p',{},'Carregando...'));
  const [a,l] = await Promise.all([
    sb.from('agendamentos').select('*').eq('tenant_id',S.tenant.id).neq('origem','bloqueio').order('data',{ascending:false}).limit(3000),
    sb.from('leads').select('*').eq('tenant_id',S.tenant.id).order('created_at',{ascending:false}).limit(100)]);
  const grupos = {};
  (a.data||[]).forEach(x => { const k = x.whatsapp || ('n:'+x.nome.toLowerCase()); const g = (grupos[k] ||= { nome:x.nome, whats:x.whatsapp, n:0, gasto:0, ultima:x.data, prox:null, canc:0 });
    if(x.status==='Cancelado'){ g.canc++; return; } g.n++; if(x.status==='Concluído') g.gasto += Number(x.valor||0);
    if(x.data > g.ultima) g.ultima = x.data; if(x.status==='Agendado' && x.data >= isoDia(new Date()) && (!g.prox || x.data < g.prox)) g.prox = x.data; });
  const lista = Object.values(grupos).sort((x,y)=> y.ultima.localeCompare(x.ultima));
  const caixa = h('div'); const busca = h('input',{placeholder:'Buscar por nome ou WhatsApp',oninput:()=>desenhar()});
  function desenhar(){
    const q = busca.value.trim().toLowerCase();
    const f = lista.filter(c => !q || c.nome.toLowerCase().includes(q) || (c.whats||'').includes(q.replace(/\D/g,'')||'§'));
    caixa.replaceChildren(...(f.length ? f.map(c => { const z = zapLink(c.whats); return h('div',{class:'kv',style:'align-items:center'},
      h('div',{}, h('b',{},c.nome), h('div',{style:'color:var(--muted);font-size:.85rem'}, `${c.n} atendimento(s) · ${brl(c.gasto)||'R$ 0,00'} · última: ${new Date(c.ultima+'T12:00:00').toLocaleDateString('pt-BR')}`+(c.prox?` · próxima: ${new Date(c.prox+'T12:00:00').toLocaleDateString('pt-BR')}`:''))),
      z ? h('a',{class:'btn sm ghost',href:z,target:'_blank',rel:'noopener',style:'text-decoration:none'},'WhatsApp') : null); }) : [h('p',{},'Nenhuma cliente encontrada.')]));
  }
  desenhar();
  main.replaceChildren(h('h2',{},'Clientes'), h('div',{class:'card'}, busca, h('div',{style:'margin-top:8px'},caixa)),
    (l.data||[]).length ? h('div',{class:'card'}, h('h3',{},'Começaram a conversar e não agendaram'), l.data.slice(0,20).map(x => { const z = zapLink(x.whatsapp); return h('div',{class:'kv'}, h('span',{},`${x.nome||'—'}${x.interesse?' · '+x.interesse:''}`), z?h('a',{href:z,target:'_blank',rel:'noopener'},'Chamar'):null); })) : null);
}

function montarPacote(){
  const c = S.cfg, nomes = {1:'segunda',2:'terca',3:'quarta',4:'quinta',5:'sexta',6:'sabado',0:'domingo'};
  const horarios = {}; Object.keys(nomes).forEach(d => { horarios[nomes[d]] = S.horarios[d] || []; });
  return {
    formato:'numen-briefing', versao:1, gerado_em:new Date().toISOString(),
    slug:S.tenant.slug, conta_email:S.user.email,
    negocio:{ nome:c.nome_negocio, responsavel:c.responsavel, nome_da_assistente:c.nome_assistente, whatsapp_apoio:c.whatsapp_apoio,
      endereco:c.endereco, maps_url:c.maps_url, formas_pagamento:c.formas_pagamento, cancelamento:c.cancelamento,
      google_review_url:c.google_review_url, horas_minimas_para_remarcar:c.horas_min_alterar, dias_a_frente:c.dias_frente },
    horarios_de_inicio_por_dia:horarios,
    servicos:S.servicos.map(x => ({ nome:x.nome, categoria:x.categoria, duracao_min:x.duracao_min, preco:x.preco, preco_confirmado:!!x.confirmado })),
    periodos_fechados:S.bloqueios.map(b => ({ de:b.inicio, ate:b.fim, motivo:b.motivo })),
    visual:{ cor_principal:c.cor_primaria, cor_escura:c.cor_escura, cor_suave:c.cor_suave, cor_fundo:c.cor_fundo,
      logo_url:c.logo_url, foto_profissional_url:c.foto_responsavel_url, audio_final_url:c.audio_final_url, audio_final_duracao:c.audio_final_duracao,
      galeria_urls:S.galeria.map(g=>g.url) },
    tom_de_voz:(({briefing,...t})=>t)(c.tom_voz||{}),
    briefing_livre:(c.tom_voz&&c.tom_voz.briefing)||{}
  };
}

function faltaParaEnviar(){
  const c = S.cfg, f = [];
  if(!c.nome_negocio) f.push('nome do negócio'); if(!c.whatsapp_apoio) f.push('WhatsApp de apoio');
  if(!Object.keys(S.horarios).length) f.push('horários'); if(!S.servicos.length) f.push('pelo menos um serviço');
  return f;
}

function desenharSimular(main){
  const fr = h('iframe',{title:'Simulação do atendimento'});
  if(IZA_DOC_B64){
    let doc = new TextDecoder().decode(Uint8Array.from(atob(IZA_DOC_B64), c => c.charCodeAt(0)));
    const ctx = JSON.stringify({ slug:S.tenant.slug }).replace(/</g,'\\u003c');
    doc = doc.replace('<head>', '<head><script>window.NMN_PREVIEW = ' + ctx + ';<\/script>');
    fr.srcdoc = doc;
  } else { fr.src = previewLink(); }
  main.append(h('h2',{},'Testar atendimento'),
    h('p',{},'É exatamente o que o seu cliente vai usar. Escolha um serviço, um dia e um horário e conclua o agendamento. Nada é salvo de verdade. Mudou algo nas outras abas? Salve e volte aqui.'),
    h('div',{class:'phone'}, fr),
    h('div',{class:'actions',style:'justify-content:center'}, h('button',{class:'btn ghost',type:'button',onclick:()=>{ S.tab='simular'; render(); }},'Recomeçar o teste')));
}

function telaCriando(trabalho){
  const c = S.cfg, b = (c.tom_voz && c.tom_voz.briefing) || {};
  const nS = S.servicos.length, nD = Object.keys(S.horarios).length;
  const nF = S.galeria.length + (Array.isArray(b.refs)?b.refs.length:0) + (c.logo_url?1:0) + (c.foto_responsavel_url?1:0);
  const preset = ((c.tom_voz||{}).preset)||'acolhedora';
  const etapas = [
    `Lendo tudo o que você contou sobre ${c.nome_negocio||'o seu negócio'}`,
    `Aprendendo ${nS} serviço${nS===1?'':'s'} e os valores de cada um`,
    `Organizando a agenda: ${nD} dia${nD===1?'':'s'} de atendimento por semana`,
    `Treinando o jeito de falar (${preset})`,
    nF ? `Estudando ${nF} imagem${nF===1?'':'ns'} da sua marca` : 'Preparando a identidade visual',
    `Dando personalidade à ${c.nome_assistente||'assistente'}`,
    'Conectando tudo ao sistema de agendamento',
    'Revisão final'
  ];
  if(!document.getElementById('nmn-criando-css')){
    const st = document.createElement('style'); st.id='nmn-criando-css';
    st.textContent = `.nmn-cr{position:fixed;inset:0;z-index:99998;background:radial-gradient(circle at 50% 18%,#14185a 0,#02031B 62%);display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;font-family:inherit}
.nmn-cr .in{width:min(460px,100%);text-align:center}
.nmn-orb{width:92px;height:92px;border-radius:50%;margin:0 auto 22px;background:conic-gradient(from 0deg,#3B6FE0,#8B5CF6,#3B6FE0);filter:blur(.3px);animation:nmnspin 3s linear infinite;box-shadow:0 0 50px #8B5CF6aa;position:relative}
.nmn-orb:after{content:'';position:absolute;inset:9px;border-radius:50%;background:#02031B}
.nmn-orb.ok{animation:none;box-shadow:0 0 60px #22c55eaa;background:#22c55e}
.nmn-orb.ok:after{background:#02031B}
@keyframes nmnspin{to{transform:rotate(360deg)}}
.nmn-cr h2{margin:0 0 6px;font-size:1.5rem}
.nmn-cr .sub{color:#9aa0d0;margin:0 0 18px;font-size:.95rem}
.nmn-bar{height:6px;border-radius:9px;background:#ffffff1a;overflow:hidden;margin:0 0 20px}
.nmn-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3B6FE0,#8B5CF6);transition:width .9s ease}
.nmn-li{list-style:none;margin:0;padding:0;text-align:left;font-size:.95rem}
.nmn-li li{display:flex;gap:10px;align-items:center;padding:7px 0;opacity:0;transform:translateY(6px);transition:all .45s}
.nmn-li li.on{opacity:1;transform:none}
.nmn-li li .d{width:18px;height:18px;border-radius:50%;border:2px solid #8B5CF6;flex:none;display:grid;place-items:center;font-size:11px}
.nmn-li li.fim .d{background:#22c55e;border-color:#22c55e;color:#02031B}
.nmn-li li:not(.fim) .d{border-top-color:transparent;animation:nmnspin .8s linear infinite}
.nmn-li li.fim{color:#9aa0d0}
.nmn-cr .btn{margin-top:22px}
@media (prefers-reduced-motion:reduce){.nmn-orb,.nmn-li li .d{animation:none}}`;
    document.head.appendChild(st);
  }
  const orb = h('div',{class:'nmn-orb'}), tit = h('h2',{},'Criando o seu agente de IA'), sub = h('p',{class:'sub'},'Isso leva só alguns instantes. Não feche esta tela.');
  const barra = h('i'), lis = etapas.map(t => h('li',{},h('span',{class:'d'}),h('span',{},t)));
  const ov = h('div',{class:'nmn-cr'}, h('div',{class:'in'}, orb, tit, sub, h('div',{class:'nmn-bar'},barra), h('ul',{class:'nmn-li'},lis)));
  document.body.appendChild(ov);
  const espera = ms => new Promise(r => setTimeout(r, ms));
  let terminou = false, erro = null;
  trabalho.then(()=>{ terminou = true; }, e => { erro = e; });
  return (async()=>{
    for(let i=0;i<etapas.length;i++){
      lis[i].classList.add('on');
      barra.style.width = Math.round((i+0.6)/etapas.length*92)+'%';
      if(i>0){ lis[i-1].classList.add('fim'); lis[i-1].querySelector('.d').textContent='✓'; }
      if(erro) break;
      await espera(i===etapas.length-1 ? 600 : 1300);
    }
    // última etapa só fecha quando o envio de verdade terminou
    while(!terminou && !erro) await espera(300);
    if(erro){ ov.remove(); throw erro; }
    lis[etapas.length-1].classList.add('fim'); lis[etapas.length-1].querySelector('.d').textContent='✓';
    barra.style.width='100%'; orb.classList.add('ok');
    tit.textContent = 'Tudo recebido! 🎉';
    sub.textContent = 'Já temos tudo para criar o seu agente. Falta só o pagamento para começarmos.';
    await new Promise(res => { const bt = h('button',{class:'btn',type:'button',onclick:()=>res()},'Continuar'); ov.querySelector('.in').appendChild(bt); });
    ov.remove();
  })();
}

function desenharLink(main){
  const st = S.tenant.status, msg = h('div',{class:'msg'}), cards = [];
  async function enviar(btn){
    const falta = faltaParaEnviar();
    if(falta.length){ msg.className='msg err'; msg.textContent = 'Antes de enviar, preencha: ' + falta.join(', ') + '.'; return; }
    if(!ENVIO_URL){ msg.className='msg err'; msg.textContent = 'Envio ainda não configurado (ENVIO_URL).'; return; }
    btn.disabled = true; msg.className='msg'; msg.textContent = '';
    const trabalho = (async()=>{
      const res = await fetch(ENVIO_URL,{ method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(montarPacote()) });
      const j = await res.json(); if(!j.ok) throw new Error(j.erro || 'falha no envio');
      if(st === 'configurando') await sb.rpc('solicitar_publicacao');
    })();
    try{
      await telaCriando(trabalho);
      S.tenant.status = st === 'configurando' ? 'solicitado' : st; render();
    }catch(e){ msg.className='msg err'; msg.textContent = 'Não consegui enviar agora. Tente de novo em instantes.'; btn.disabled = false; }
  }
  if(st === 'configurando'){
    cards.push(h('div',{class:'card'}, h('h3',{},'Teste e envie'),
      h('p',{},'Já testou na aba "Testar atendimento"? Se estiver como você quer, envie. A nossa equipe recebe tudo o que você preencheu e escreveu, cria o seu agente de IA e avisa você quando ele estiver pronto.'),
      h('div',{class:'actions'}, h('button',{class:'btn',type:'button',onclick:e=>enviar(e.target)},'Enviar para criação')), msg));
  } else if(st === 'solicitado'){
    cards.push(h('div',{class:'card'}, h('span',{class:'tag'},'Último passo'),
      h('h3',{style:'margin-top:10px'},'Recebemos a sua configuração 🎉'),
      h('p',{},'Para a nossa equipe criar e publicar o seu sistema, falta só o pagamento. Assim que for confirmado, começamos e avisamos você quando estiver no ar.'),
      h('p',{style:'font-weight:600;color:var(--ink)'},PLANO_TXT),
      CHECKOUT_URL ? h('div',{class:'actions'}, h('a',{class:'btn',href:CHECKOUT_URL+(CHECKOUT_URL.includes('?')?'&':'?')+'email='+encodeURIComponent(S.user.email),target:'_blank',rel:'noopener',style:'text-decoration:none'},'Ir para o pagamento')) : h('p',{},'Link de pagamento em breve.'),
      h('p',{style:'font-size:.85rem'},'Quer mudar algo antes de pagar? Ajuste nas abas e reenvie.'),
      h('div',{class:'actions'}, h('button',{class:'btn ghost',type:'button',onclick:e=>enviar(e.target)},'Reenviar com alterações')), msg));
  } else {
    cards.push(h('div',{class:'card'}, h('span',{class:'tag ok'},'Entregue'),
      h('h3',{style:'margin-top:10px'},'Seu sistema está pronto'),
      h('p',{},'A nossa equipe já criou o seu agente de IA e enviou os acessos para você. Qualquer ajuste, é só falar com a gente.')));
  }
  if(S.isAdmin){
    const muda = (novo,rot,cls) => h('button',{class:'btn sm '+(cls||'ghost'),type:'button',onclick:async()=>{
      const { data } = await sb.rpc('admin_definir_status',{ p_tenant:S.tenant.id, p_status:novo });
      if(data?.ok){ S.tenant.status = novo; toast('Status: '+novo); render(); } else toast('Sem permissão');
    }},rot);
    cards.push(h('div',{class:'card'}, h('h3',{},'Equipe Numen'), h('p',{},st==='publicado' ? `No ar. Link: ${linkPublico()}` : `Status atual: ${st}. Ao publicar, o link do cliente passa a funcionar.`),
      h('div',{class:'actions'}, st!=='publicado'?muda('publicado','Publicar','') : muda('configurando','Tirar do ar'))));
  }
  main.append(h('h2',{},'Enviar para criação'), ...cards);
}

async function viewAdminLista(){
  $app.replaceChildren(topbar(), h('div',{class:'wrap',style:'max-width:860px;padding:24px 16px 50px'}, h('h1',{},'Negócios'), h('p',{},'Carregando...')));
  const { data } = await sb.rpc('admin_listar_negocios');
  S.lista = data || [];
  const rot = {configurando:'Configurando', solicitado:'Aguardando finalização', publicado:'No ar'};
  $app.replaceChildren(topbar(), h('div',{class:'wrap',style:'max-width:860px;padding:24px 16px 50px'},
    h('h1',{},'Negócios'), h('p',{},'Quem pediu finalização aparece primeiro.'),
    h('div',{class:'card'}, S.lista.length ? S.lista.map(n => h('div',{class:'kv',style:'align-items:center;flex-wrap:wrap'},
      h('div',{}, h('b',{}, n.nome || '(sem nome)'), h('div',{style:'color:var(--muted);font-size:.85rem'}, `${n.slug} · ${n.email||'sem dono'} · ${n.servicos} serviços · ${n.horarios} horários`)),
      h('div',{style:'display:flex;gap:8px;align-items:center'}, h('span',{class:'tag'},rot[n.status]||n.status),
        h('button',{class:'btn sm',type:'button',onclick:async()=>{
          const r = await sb.from('tenants').select('*').eq('id',n.id).single();
          await carregarTudo(r.data); S.adminLista=false; S.adminEditando=true; S.wizard=false; S.tab = 'link'; render();
        }},'Abrir')))) : h('p',{},'Nenhum negócio ainda.'))));
}

function topbar(){
  return h('div',{class:'topbar'}, h('div',{class:'logo'},h('img',{src:LOGO_NUVEM,alt:''}),'Numen'),
    h('div',{style:'display:flex;gap:10px;align-items:center'}, S.isAdmin && !EMBED ? h('button',{class:'btn sm ghost',type:'button',onclick:()=>{ S.adminLista=true; S.adminEditando=false; render(); }},'Todos os negócios') : null,
      S.user ? h('span',{style:'font-size:.85rem;color:var(--muted)'}, S.user.email) : null,
      S.user ? h('button',{class:'btn sm ghost',type:'button',onclick:sair},'Sair') : null,
      EMBED ? h('button',{class:'btn sm',type:'button',onclick:()=>parent.postMessage({type:'numen-fechar'},'*')},'Voltar ao atendimento') : null));
}

/* ---------- roteador ---------- */
function viewSemAcesso(){
  $app.replaceChildren(topbar(), h('div',{class:'auth'}, h('div',{class:'card'},
    h('h3',{},'Acesso não liberado'),
    h('p',{},'Esta conta não é a dona deste atendimento. Entre com o e-mail e a senha que você criou no painel de configuração.'),
    h('div',{class:'actions'}, h('button',{class:'btn ghost',type:'button',onclick:sair},'Entrar com outro e-mail')))));
}

async function sair(){
  try{ await sb.auth.signOut({ scope:'local' }); }catch(e){}
  try{ Object.keys(localStorage).filter(k=>/^sb-.*auth/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  S.user=null; S.tenant=null; S.wizard=false; S.carregado=false; S.isAdmin=false; S.adminLista=false;
  render();
}
function render(){
  if(!S.user) return viewAuth();
  if(EMBED){
    if(!S.tenant) return viewSemAcesso();
    if(S.wizard) return viewWizard();
    return viewDash();
  }
  if(S.isAdmin && (S.adminLista || !S.tenant)) return viewAdminLista();
  if(!S.tenant) return viewCriarNegocio();
  if(S.wizard) return viewWizard();
  return viewDash();
}

let iniciando = false;
async function iniciar(session){
  const novo = session?.user || null;
  // eventos repetidos (ex.: voltar para a aba) não podem recarregar nem resetar o que a pessoa está editando
  if(novo && S.user && novo.id === S.user.id && S.tenant !== undefined && !iniciando && S.carregado) return;
  S.user = novo;
  if(S.user){
    iniciando = true;
    try{
      const a = await sb.rpc('sou_admin'); S.isAdmin = a.data === true; await carregarTudo(); S.carregado = true;
    }finally{ iniciando = false; }
  } else { S.tenant = null; S.wizard = false; S.carregado = false; S.isAdmin = false; S.adminLista = false; }
  render();
}
const VEIO_DO_EMAIL = /type=(signup|email|magiclink|recovery)/.test(location.hash);
if(VEIO_DO_EMAIL){ setTimeout(()=>{ const b=document.createElement('div'); b.textContent='✓ E-mail confirmado! Sua conta Numen está pronta.'; b.style.cssText='position:fixed;top:0;left:0;right:0;background:#16a34a;color:#fff;text-align:center;padding:12px;font-weight:600;z-index:99999;font-family:inherit'; b.onclick=()=>b.remove(); document.body.appendChild(b); setTimeout(()=>b.remove(),9000); history.replaceState(null,'',location.pathname+location.search); },400); }
sb.auth.onAuthStateChange((evento, session) => {
  if(evento === 'TOKEN_REFRESHED') return;
  setTimeout(() => iniciar(session), 0); // evita deadlock dentro do callback do supabase-js
});
