<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talismã · CRM</title>
<style>
:root{
  --side:#2E3061; --side-hov:#3B3E78; --side-on:#4A4E8F;
  --acc:#2E3061; --acc-h:#23264D; --acc-soft:#E6E7F2;
  --bg:#f5f7f8; --card:#ffffff; --line:#e3e8ea;
  --txt:#2d3e50; --mut:#7c8a99;
  --red:#c2412d; --red-soft:#fbe9e6;
  --green:#2c7a5a; --green-soft:#e3f3ec;
  --gray-soft:#eceff1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
.hidden{display:none!important}
input,select,textarea{width:100%;background:#fff;color:var(--txt);border:1px solid #cdd5da;border-radius:6px;padding:8px 10px;font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px;font-weight:600}
.btn{color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 14px -2px rgba(74,78,143,.55),0 6px 16px -6px rgba(46,48,97,.6);transition:transform .15s,box-shadow .2s}
.btn:hover{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--acc-h);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 22px 2px rgba(74,78,143,.7),0 8px 20px -6px rgba(46,48,97,.7);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
.btn.sec{background:rgba(255,255,255,.55);color:var(--acc);border:1px solid rgba(46,48,97,.25);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 14px -6px rgba(46,48,97,.35)}
.btn.sec:hover{background:rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 18px rgba(74,78,143,.4);transform:translateY(-1px)}
.btn.small{padding:6px 12px;font-size:13px}

/* login */
#login:not(.hidden){min-height:100vh;background:#2E3061;padding-top:7vh;box-sizing:border-box}
.pe-login{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:rgba(255,255,255,.75);font-size:13px;letter-spacing:.3px}
.login{max-width:340px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px}
.login h1{font-size:22px;color:var(--acc);margin:0 0 4px;text-align:center}
.login p{margin:0 0 16px;text-align:center;color:var(--mut)}
.erro{color:var(--red);font-size:13px;margin-top:10px}

/* layout */
#app{display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:#dfe4e8;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.marca{font-size:20px;font-weight:700;color:#fff;padding:4px 10px 18px;letter-spacing:.02em}
.nav-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:6px;cursor:pointer;color:#cfd5db;margin-bottom:2px}
.nav-item:hover{background:var(--side-hov)}
.nav-item.on{background:var(--side-on);color:#fff;font-weight:600}
.nav-item .n{font-size:12px;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px}
.nav-item .n.alerta{background:var(--red);color:#fff}
.rodape{margin-top:auto;border-top:1px solid #434851;padding:14px 10px 0;font-size:13px}
.rodape button{margin-top:8px;background:transparent;border:1px solid #545a64;color:#dfe4e8;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.rodape button:hover{background:var(--side-hov)}
main{flex:1;padding:24px 28px;min-width:0}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.topo h1{font-size:22px;margin:0;font-weight:600}
.barra{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.barra input{width:260px}
.barra select{width:190px}

/* cards e tabelas */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#fbfcfc;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #eef2f3;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.linha{cursor:pointer}
tr.linha:hover td{background:#f4faf9}
.nome{font-weight:600;color:var(--acc)}
.sub{color:var(--mut);font-size:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--gray-soft);color:var(--txt);white-space:nowrap}
.pill.venda{background:var(--green-soft);color:var(--green)}
.pill.perd{background:#eef0f2;color:var(--mut)}
.pill.atras{background:var(--red-soft);color:var(--red)}
.pill.acc{background:var(--acc-soft);color:var(--acc)}
.wa{color:var(--acc);text-decoration:none;font-weight:600;font-size:13px}
.alerta{background:var(--red-soft);color:#8e2a1c;border:1px solid #f1c3bb;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.vazio{background:#fff;border:1px dashed #cdd5da;border-radius:8px;padding:28px;text-align:center;color:var(--mut)}
.linha-acoes{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.linha-acoes select{width:180px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,35,40,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.box{background:#fff;border-radius:10px;padding:22px;width:100%;max-width:500px;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.box h2{font-size:18px;margin:0 0 4px}
.box .sub{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acoes-modal{margin-top:16px;display:flex;justify-content:flex-end;gap:8px}
.meu{display:flex;gap:10px;align-items:center;margin-bottom:6px;color:#fff;font-weight:600}
.row-av{display:flex;gap:10px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700}
.kpi .l{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.alerta .v{color:var(--red)}
.bar{height:6px;background:var(--gray-soft);border-radius:999px;overflow:hidden;margin-top:4px;min-width:90px}
.bar i{display:block;height:100%;background:var(--acc)}
tr.total td{font-weight:700;background:#fbfcfc}
.qual{background:#fbfcfc;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:14px 0 4px}
.qual.ok{background:var(--green-soft);color:var(--green);border-color:#cfe8dc;font-weight:600}
.qual b{font-size:14px}
.det{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;margin:14px 0 6px;font-size:13px;padding:12px 14px;background:#fbfcfc;border:1px solid var(--line);border-radius:8px}
.det dt{color:var(--mut);font-weight:600}
.det dd{margin:0;color:var(--txt)}
@media(max-width:800px){aside{display:none}main{padding:16px}.barra input,.barra select{width:100%}.grid2{grid-template-columns:1fr}}
</style>
</head>

<script>
const STATUS = ['Novo','Em contato','Visita agendada','Proposta enviada','Negociação','Venda fechada','Sem resposta','Perdido'];
let sess = null, painel = {leads:[], corretores:[]}, secao = 'entrada', atual = null;
let fTexto = '', fStatus = '', fCorr = '';
let fMes = mesAtual();

function mesAtual(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
// Lead entra no filtro se a data de entrada for do mês escolhido ('' = todos os meses)
const noMes = l => !fMes || (l.dataEntrada && l.dataEntrada.slice(6, 10) + '-' + l.dataEntrada.slice(3, 5) === fMes);
const nomesMeses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function nomeMes(m){ const p = m.split('-'); return nomesMeses[+p[1] - 1] + ' de ' + p[0]; }

function barraMes(){
  const meses = [...new Set([mesAtual(), ...painel.leads.map(l => l.dataEntrada && l.dataEntrada.slice(6, 10) + '-' + l.dataEntrada.slice(3, 5))].filter(Boolean))]
    .sort().reverse();
  return '<select id="fMesSel" style="width:190px"><option value="">Todos os meses</option>' +
    meses.map(m => '<option value="' + m + '"' + (fMes === m ? ' selected' : '') + '>' + nomeMes(m) + '</option>').join('') +
    '</select>';
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Endereço do App da web (URL /exec). Usado quando a tela não roda dentro do Apps Script (ex.: GitHub Pages).
const API_URL = 'https://script.google.com/macros/s/AKfycbxPPF7iUW18adnMDb7RcbGAHXLOWjJc_9uISw-74RXyeeoD4dqZ7gVBfCy8N76VxUKpDQ/exec';

function chamar(fn, ...args){
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.erro); return j.data; });
  }
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(e => rej(new Error(e && e.message ? e.message : String(e))))
      [fn](...args);
  });
}

function salvarSessao(s){ try{ localStorage.setItem('talisma_sessao', JSON.stringify(s)); }catch(e){} }
function lerSessao(){ try{ return JSON.parse(localStorage.getItem('talisma_sessao') || 'null'); }catch(e){ return null; } }
function limparSessao(){ try{ localStorage.removeItem('talisma_sessao'); }catch(e){} }

function sair(){
  limparSessao(); sess = null; baseCompleta = false;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
}
$('btnSair').onclick = sair;
$('btnConta').onclick = () => abrirMinhaConta();
$('meuBloco').style.cursor = 'pointer';
$('meuBloco').title = 'Minha conta: foto e senha';
$('meuBloco').onclick = () => abrirMinhaConta();

$('formLogin').onsubmit = async e => {
  e.preventDefault(); $('lErro').textContent = '';
  try{
    sess = await chamar('login', $('lUsuario').value, $('lSenha').value);
    salvarSessao(sess);
    await entrar();
  }catch(err){ $('lErro').textContent = err.message; }
};

async function entrar(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('quem').textContent = sess.nome + (sess.papel === 'matriz' ? ' · Matriz' : ' · Corretor');
  fotos = await chamar('fotosCorretores', sess.token).catch(() => ({}));
  $('avatarMeu').innerHTML = avatar(sess.usuario, sess.nome, 36);
  secao = sess.papel === 'matriz' ? 'entrada' : 'meus';
  await carregar();
}

let baseCompleta = false; // vira true quando o usuário pede "Carregar anteriores"; fica assim até sair
async function carregar(todos){
  try{
    if (todos) baseCompleta = true;
    painel = await chamar('carregarPainel', sess.token, baseCompleta);
    render();
    avisarPendentes();
  }catch(err){
    if (/Sessão/.test(err.message)){ sair(); $('lErro').textContent = err.message; return; }
    $('conteudo').innerHTML = '<div class="alerta">' + esc(err.message) + '</div>';
  }
}

// ---------- Dados ----------
const ehAtrasado = l => l.atrasado;
const ativo = l => l.corretorUsuario && !['Venda fechada','Perdido'].includes(l.status);

function filtrados(){
  let lista = secao === 'atrasados'
    ? painel.leads.filter(ehAtrasado)
    : painel.leads.filter(l => l.status !== 'Entrada');
  const t = fTexto.trim().toLowerCase();
  if (t) lista = lista.filter(l => (l.nome + ' ' + l.telefone + ' ' + l.interesse + ' ' + l.origem).toLowerCase().indexOf(t) !== -1);
  if (fStatus) lista = lista.filter(l => l.status === fStatus);
  if (fCorr) lista = lista.filter(l => l.corretorUsuario === fCorr);
  return lista.filter(noMes).slice().sort((a, b) => (b.atrasado - a.atrasado));
}

// ---------- Renderização ----------
function pillStatus(l){
  const cls = l.status === 'Venda fechada' ? 'venda' : l.status === 'Perdido' ? 'perd' : l.status === 'Entrada' ? 'acc' : '';
  return '<span class="pill ' + cls + '">' + esc(l.status) + '</span>' +
    (l.atrasado ? ' <span class="pill atras">sem atualização</span>' : '');
}

function linkWa(tel){
  const d = String(tel || '').replace(/\D/g, '');
  if (!d) return '';
  const num = d.length <= 11 ? '55' + d : d;
  return '<a class="wa" href="https://wa.me/' + esc(num) + '" target="_blank" onclick="event.stopPropagation()">WhatsApp</a>';
}

let desemp = null;
async function carregarDesemp(){
  $('conteudo').innerHTML = '<div class="vazio">Carregando desempenho…</div>';
  try{
    const d = await chamar('carregarDesempenho', sess.token, fMes);
    if (secao !== 'desempenho') return;
    desemp = d;
    $('conteudo').innerHTML = tabelaDesempenho(d);
  }catch(err){
    if (/Sessão/.test(err.message)){ sair(); $('lErro').textContent = err.message; return; }
    if (secao === 'desempenho') $('conteudo').innerHTML = '<div class="alerta">' + esc(err.message) + '</div>';
  }
}

function tabelaDesempenho(d){
  const t = d.total;
  const barra = v => '<div class="bar"><i style="width:' + Math.min(100, v) + '%"></i></div>';
  const kpi = (v, l, cls) => '<div class="kpi ' + (cls || '') + '"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>';
  const kpis = '<div class="kpis">' +
    kpi(t.recebidos, 'Leads no período') +
    kpi(t.taxaContato + '%', 'Taxa de contato') +
    kpi(t.visitas, 'Visitas agendadas') +
    kpi(t.vendas, 'Vendas fechadas') +
    kpi(t.taxaVenda + '%', 'Taxa de venda') +
    kpi(t.atrasados, 'Sem atualização há 2+ dias', t.atrasados ? 'alerta' : '') +
    '</div>';
  const aviso = d.semCorretor
    ? '<div class="alerta" style="background:#fff8e6;color:#7a5a00;border-color:#f3e0a6">' + d.semCorretor + ' lead(s) ainda sem corretor neste período.</div>' : '';
  if (!d.linhas.length) return kpis + aviso + '<div class="vazio">Nenhum corretor ativo.</div>';
  const linhas = d.linhas.map(r => '<tr>' +
    '<td><div class="row-av">' + avatar(r.usuario, r.nome, 30) + '<div class="nome">' + esc(r.nome) + '</div></div></td>' +
    '<td>' + r.recebidos + '</td>' +
    '<td>' + r.contatados + ' <span class="sub">(' + r.taxaContato + '%)</span>' + barra(r.taxaContato) + '</td>' +
    '<td>' + r.emAndamento + '</td>' +
    '<td>' + r.visitas + '</td>' +
    '<td>' + r.propostas + '</td>' +
    '<td><b>' + r.vendas + '</b></td>' +
    '<td>' + r.perdidos + '</td>' +
    '<td>' + r.semResposta + '</td>' +
    '<td>' + (r.atrasados ? '<span class="pill atras">' + r.atrasados + '</span>' : '0') + '</td>' +
    '<td>' + r.taxaVenda + '%' + barra(r.taxaVenda) + '</td>' +
    '</tr>').join('');
  const totalLinha = '<tr class="total"><td>Total</td><td>' + t.recebidos + '</td>' +
    '<td>' + t.contatados + ' <span class="sub">(' + t.taxaContato + '%)</span></td>' +
    '<td>' + t.emAndamento + '</td><td>' + t.visitas + '</td><td>' + t.propostas + '</td>' +
    '<td>' + t.vendas + '</td><td>' + t.perdidos + '</td><td>' + t.semResposta + '</td>' +
    '<td>' + t.atrasados + '</td><td>' + t.taxaVenda + '%</td></tr>';
  return kpis + aviso +
    '<table><thead><tr><th>Corretor</th><th>Recebidos</th><th>Contatados</th><th>Em andamento</th>' +
    '<th>Visitas</th><th>Propostas</th><th>Vendas</th><th>Perdidos</th><th>Sem resposta</th>' +
    '<th>Sem atualização</th><th>Conversão</th></tr></thead><tbody>' + linhas + totalLinha + '</tbody></table>' +
    '<div class="sub" style="margin-top:10px">Contatados = saiu de "Novo". Conversão = vendas sobre leads recebidos. Período: pela data de entrada do lead.</div>';
}

function render(){
  renderNav(); renderAvisos();
  const titulos = {entrada:'Entrada', todos:'Todos os leads', meus:'Meus leads', atrasados:'Sem atualização', corretores:'Corretores', desempenho:'Desempenho dos corretores'};
  $('titulo').textContent = titulos[secao];
  $('acoes').innerHTML =
    secao === 'entrada' ? '<button class="btn" id="btnNovoLead">+ Novo lead</button>' :
    secao === 'corretores' ? '<button class="btn" id="btnNovoCorr">+ Novo corretor</button>' :
    (painel && !painel.completo && secao !== 'desempenho') ? '<button class="btn" id="btnCarregarTodos">Carregar anteriores</button>' : '';

  if (secao === 'entrada'){ $('barra').innerHTML = barraMes(); $('conteudo').innerHTML = tabelaEntrada(); }
  else if (secao === 'corretores'){ $('barra').innerHTML = ''; $('conteudo').innerHTML = tabelaCorretores(); }
  else if (secao === 'desempenho'){ $('barra').innerHTML = barraMes(); carregarDesemp(); }
  else { $('barra').innerHTML = barraFiltros(); $('conteudo').innerHTML = tabelaLeads(filtrados()); }
  ligar();
}

function renderNav(){
  const L = painel.leads;
  const entrada = L.filter(l => l.status === 'Entrada' && !l.corretorUsuario).length;
  const atrasados = L.filter(ehAtrasado).length;
  const itens = sess.papel === 'matriz'
    ? [['entrada','Entrada', entrada, false], ['todos','Todos os leads', '', false], ['atrasados','Sem atualização', atrasados, atrasados > 0], ['desempenho','Desempenho', '', false], ['corretores','Corretores', '', false]]
    : [['meus','Meus leads', '', false], ['atrasados','Sem atualização', atrasados, atrasados > 0]];
  $('nav').innerHTML = itens.map(([k, n, c, alerta]) =>
    '<div class="nav-item' + (secao === k ? ' on' : '') + '" data-s="' + k + '"><span>' + n + '</span>' +
    (c !== '' ? '<span class="n' + (alerta ? ' alerta' : '') + '">' + c + '</span>' : '') + '</div>'
  ).join('');
  $('nav').querySelectorAll('.nav-item').forEach(el => el.onclick = () => {
    secao = el.dataset.s; fTexto = ''; fStatus = ''; fCorr = ''; render();
  });
}

function renderAvisos(){
  const n = painel.leads.filter(ehAtrasado).length;
  if (!n){ $('avisos').innerHTML = ''; return; }
  const txt = sess.papel === 'matriz'
    ? n + ' lead(s) com corretor sem atualização há mais de 2 dias.'
    : 'Você tem ' + n + ' lead(s) sem atualização há mais de 2 dias. Atualize o status.';
  $('avisos').innerHTML = '<div class="alerta">' + txt + '</div>';
}

function barraFiltros(){
  const opcCorr = sess.papel === 'matriz'
    ? '<select id="fCorrSel"><option value="">Todos os corretores</option>' +
      painel.corretores.filter(c => c.papel === 'corretor').map(c =>
        '<option value="' + esc(c.usuario) + '"' + (fCorr === c.usuario ? ' selected' : '') + '>' + esc(c.nome) + '</option>').join('') +
      '</select>' : '';
  return barraMes() + '<input id="fTexto" placeholder="Pesquisar nome, telefone, interesse…" value="' + esc(fTexto) + '">' +
    '<select id="fStatusSel"><option value="">Todos os status</option>' +
    STATUS.map(s => '<option' + (fStatus === s ? ' selected' : '') + '>' + esc(s) + '</option>').join('') +
    '</select>' + opcCorr;
}

function tabelaLeads(lista){
  if (!lista.length) return '<div class="vazio">Nenhum lead por aqui.</div>';
  const colCorr = sess.papel === 'matriz' ? '<th>Corretor</th>' : '';
  return '<table><thead><tr><th>Nome</th><th>Telefone</th><th>Interesse</th><th>Origem</th>' + colCorr +
    '<th>Status</th><th>Última atualização</th><th></th></tr></thead><tbody>' +
    lista.map(l => '<tr class="linha" data-lead="' + esc(l.id) + '">' +
      '<td><div class="nome">' + esc(l.nome) + '</div></td>' +
      '<td>' + esc(l.telefone) + '</td>' +
      '<td>' + esc(l.interesse) + '</td>' +
      '<td>' + esc(l.origem) + '</td>' +
      (sess.papel === 'matriz' ? '<td>' + esc(l.corretorNome) + '</td>' : '') +
      '<td>' + pillStatus(l) + '</td>' +
      '<td class="sub">' + esc(l.ultimaAtualizacao || '—') + '</td>' +
      '<td>' + linkWa(l.telefone) + '</td>' +
      '</tr>').join('') +
    '</tbody></table>';
}

function tabelaEntrada(){
  const entrada = painel.leads.filter(l => l.status === 'Entrada' && !l.corretorUsuario && noMes(l));
  if (!entrada.length) return '<div class="vazio">Nenhum lead aguardando distribuição.</div>';
  const opts = painel.corretores.filter(c => c.papel === 'corretor' && c.ativo)
    .map(c => '<option value="' + esc(c.usuario) + '">' + esc(c.nome) + '</option>').join('');
  return '<table><thead><tr><th>Nome</th><th>Telefone</th><th>Origem</th><th>Interesse</th><th>Entrou em</th><th>Distribuir para</th></tr></thead><tbody>' +
    entrada.map(l => '<tr>' +
      '<td><div class="nome">' + esc(l.nome) + '</div>' + '' + '</td>' +
      '<td>' + esc(l.telefone) + '</td>' +
      '<td>' + esc(l.origem) + '</td>' +
      '<td>' + esc(l.interesse) + '</td>' +
      '<td class="sub">' + esc(l.dataEntrada) + '</td>' +
      '<td><div class="linha-acoes"><select data-sel="' + esc(l.id) + '"><option value="">Escolher corretor…</option>' + opts + '</select>' +
      '<button class="btn small" data-atr="' + esc(l.id) + '">Atribuir</button></div></td>' +
      '</tr>').join('') +
    '</tbody></table>';
}

function tabelaCorretores(){
  const ativos = {}, atrasos = {};
  painel.leads.forEach(l => {
    if (l.corretorUsuario && ativo(l)) ativos[l.corretorUsuario] = (ativos[l.corretorUsuario] || 0) + 1;
    if (l.atrasado) atrasos[l.corretorUsuario] = (atrasos[l.corretorUsuario] || 0) + 1;
  });
  return '<table><thead><tr><th>Nome</th><th>Login</th><th>Telefone</th><th>Leads ativos</th><th>Sem atualização</th></tr></thead><tbody>' +
    painel.corretores.map(c => '<tr>' +
      '<td><div class="row-av">' + avatar(c.usuario, c.nome, 34) + '<div><div class="nome">' + esc(c.nome) + '</div><div class="sub">' + esc(c.papel) + '</div></div></div></td>' +
      '<td>' + esc(c.usuario) + '</td>' +
      '<td>' + esc(c.telefone) + '</td>' +
      '<td><span class="pill acc">' + (ativos[c.usuario] || 0) + '</span></td>' +
      '<td><span class="pill' + (atrasos[c.usuario] ? ' atras' : '') + '">' + (atrasos[c.usuario] || 0) + '</span></td>' +
      '</tr>').join('') +
    '</tbody></table>';
}

// ---------- Eventos ----------
function ligar(){
  const bNovo = $('btnNovoLead'); if (bNovo) bNovo.onclick = abrirNovoLead;
  const bCorr = $('btnNovoCorr'); if (bCorr) bCorr.onclick = abrirNovoCorr;
  const bTodos = $('btnCarregarTodos'); if (bTodos) bTodos.onclick = () => { bTodos.textContent = 'Carregando…'; bTodos.disabled = true; carregar(true); };

  const fm = $('fMesSel');
  if (fm) fm.onchange = e => { fMes = e.target.value; render(); };
  const ft = $('fTexto');
  if (ft) ft.oninput = e => { fTexto = e.target.value; $('conteudo').innerHTML = tabelaLeads(filtrados()); ligarLinhas(); };
  const fs = $('fStatusSel');
  if (fs) fs.onchange = e => { fStatus = e.target.value; $('conteudo').innerHTML = tabelaLeads(filtrados()); ligarLinhas(); };
  const fc = $('fCorrSel');
  if (fc) fc.onchange = e => { fCorr = e.target.value; $('conteudo').innerHTML = tabelaLeads(filtrados()); ligarLinhas(); };

  document.querySelectorAll('[data-atr]').forEach(btn => btn.onclick = async () => {
    const sel = document.querySelector('[data-sel="' + btn.dataset.atr + '"]');
    if (!sel.value) return alert('Escolha um corretor.');
    btn.disabled = true;
    try{ await chamar('atribuirLead', sess.token, btn.dataset.atr, sel.value); await carregar(); }
    catch(err){ alert(err.message); btn.disabled = false; }
  });

  ligarLinhas();
}

function ligarLinhas(){
  document.querySelectorAll('tr[data-lead]').forEach(el => el.onclick = () => abrirLead(el.dataset.lead));
}

// ---------- Fotos e conta ----------
let fotos = {};
const iniciais = nome => String(nome || '?').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();

function avatar(usuario, nome, tam){
  const st = 'width:' + tam + 'px;height:' + tam + 'px;border-radius:50%;flex:none;';
  const f = fotos[usuario];
  return f
    ? '<img src="' + f + '" style="' + st + 'object-fit:cover">'
    : '<span style="' + st + 'display:inline-flex;align-items:center;justify-content:center;background:var(--acc-soft);color:var(--acc);font-weight:700;font-size:' + Math.round(tam * 0.38) + 'px">' + esc(iniciais(nome)) + '</span>';
}

// Reduz a foto para 160x160 (quadrada) antes de enviar
function redimensionar(arquivo){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const T = 160, lado = Math.min(img.width, img.height);
      const c = document.createElement('canvas'); c.width = T; c.height = T;
      c.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, T, T);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => rej(new Error('Não consegui ler essa imagem.'));
    img.src = URL.createObjectURL(arquivo);
  });
}

function abrirMinhaConta(){
  abrirForm('Minha conta',
    '<div style="display:flex;gap:14px;align-items:center">' + avatar(sess.usuario, sess.nome, 72) +
    '<div style="flex:1"><label>Foto (qualquer imagem)</label><input id="cFoto" type="file" accept="image/*"></div></div>' +
    '<h3 style="font-size:14px;margin:22px 0 0">Trocar senha</h3>' +
    '<label>Senha atual</label><input id="cSenhaAtual" type="password">' +
    '<div class="grid2"><div><label>Nova senha (mín. 6)</label><input id="cSenhaNova" type="password"></div>' +
    '<div><label>Repita a nova senha</label><input id="cSenhaNova2" type="password"></div></div>',
    async () => {
      const arq = $('cFoto').files[0];
      const sn = $('cSenhaNova').value, sn2 = $('cSenhaNova2').value, sa = $('cSenhaAtual').value;
      if (!arq && !sn) throw new Error('Escolha uma foto ou preencha a troca de senha.');
      if (sn) {
        if (sn !== sn2) throw new Error('As senhas novas não coincidem.');
        await chamar('alterarSenha', sess.token, sa, sn);
      }
      if (arq) {
        const dataUrl = await redimensionar(arq);
        await chamar('salvarFoto', sess.token, dataUrl);
        fotos = await chamar('fotosCorretores', sess.token).catch(() => fotos);
        $('avatarMeu').innerHTML = avatar(sess.usuario, sess.nome, 36);
      }
    });
}

// Transforma a observação ("Rótulo: valor | Rótulo: valor") em uma ficha de dois campos
function detalhes(texto){
  const partes = String(texto || '').split(' | ').map(p => p.trim()).filter(Boolean);
  if (!partes.length) return '';
  return '<dl class="det">' + partes.map(p => {
    const i = p.indexOf(':');
    if (i === -1) {
      const m = p.match(/ID HubSpot #(\d+)/);
      return m ? '<dt>ID HubSpot</dt><dd>' + esc(m[1]) + '</dd>' : '<dt>Observação</dt><dd>' + esc(p) + '</dd>';
    }
    return '<dt>' + esc(p.slice(0, i)) + '</dt><dd>' + esc(p.slice(i + 1).trim()) + '</dd>';
  }).join('') + '</dl>';
}

// ---------- Modal do lead ----------
// Pergunta "O lead respondeu?" depois que o Fabrício atribuiu o lead ao corretor
function blocoQualif(l){
  if (!l.corretorUsuario || l.status === 'Entrada') return '';
  if (sess.papel !== 'matriz' && l.corretorUsuario !== sess.usuario) return '';
  if (l.qualificado && l.enviadoMeta) return '<div class="qual ok">✔ Qualificado. Enviado ao Meta em ' + esc(l.enviadoMeta) + '.</div>';
  if (l.qualificado) return '<div class="qual"><b>Marcado como qualificado</b><div class="sub">Ainda não chegou ao Meta. Tente de novo.</div><div style="margin-top:10px"><button class="btn" id="btnQualSim">Enviar ao Meta</button></div></div>';
  return '<div class="qual"><b>O lead respondeu?</b><div class="sub">Se sim, o lead vai para o Meta como qualificado e as campanhas passam a buscar leads de melhor qualidade.</div><div style="margin-top:10px"><button class="btn" id="btnQualSim">Sim, respondeu</button></div></div>';
}

// Pop-up: leads novos com 24h ou mais sem mudança de status. Aparece uma vez por carregamento da tela.
let popupMostrado = false;
function avisarPendentes(){
  if (popupMostrado || !sess || sess.papel === 'matriz') return;
  const pend = painel.leads.filter(l => l.pendenteStatus && l.corretorUsuario === sess.usuario);
  if (!pend.length) return;
  popupMostrado = true;
  $('pBase').textContent = pend.length === 1
    ? 'Você tem 1 lead novo há mais de 24 horas sem mudança de status.'
    : 'Você tem ' + pend.length + ' leads novos há mais de 24 horas sem mudança de status.';
  $('pLista').innerHTML = pend.map(l =>
    '<div class="row-av" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">' +
    '<div><div class="nome">' + esc(l.nome) + '</div><div class="sub">' + esc(l.interesse || l.origem) + '</div></div>' +
    '<button class="btn sm" data-pend="' + esc(l.id) + '">Atualizar</button></div>'
  ).join('');
  $('pLista').querySelectorAll('[data-pend]').forEach(b => b.onclick = () => {
    $('modalPendentes').classList.remove('on');
    abrirLead(b.dataset.pend);
  });
  $('modalPendentes').classList.add('on');
}
$('pFechar').onclick = () => $('modalPendentes').classList.remove('on');

function abrirLead(id){
  const l = painel.leads.find(x => x.id === id);
  if (!l) return;
  atual = l;
  $('mNome').textContent = l.nome;
  $('mInfo').textContent = [l.telefone, l.interesse, l.origem].filter(Boolean).join(' · ');
  $('mCorretorWrap').classList.toggle('hidden', sess.papel !== 'matriz');
  $('mCorretor').innerHTML = '<option value="">Sem corretor</option>' +
    painel.corretores.filter(c => c.papel === 'corretor' && c.ativo)
      .map(c => '<option value="' + esc(c.usuario) + '"' + (c.usuario === l.corretorUsuario ? ' selected' : '') + '>' + esc(c.nome) + '</option>').join('');
  $('mStatus').innerHTML = STATUS.map(s => '<option' + (s === l.status ? ' selected' : '') + '>' + esc(s) + '</option>').join('');
  $('mDetalhes').innerHTML = detalhes(l.obsEntrada);
  $('mQualBloco').innerHTML = blocoQualif(l);
  const bQ = $('btnQualSim');
  if (bQ) bQ.onclick = async () => {
    bQ.disabled = true; $('mErro').textContent = '';
    try{
      const r = await chamar('qualificarLead', sess.token, l.id, true);
      await carregar();
      abrirLead(l.id);
      if (r.motivo) $('mErro').textContent = r.motivo;
    }catch(err){ $('mErro').textContent = err.message; bQ.disabled = false; }
  };
  $('mObs').value = l.obsCorretor || '';
  $('mErro').textContent = '';
  $('modalLead').classList.add('on');
}

$('mFechar').onclick = () => $('modalLead').classList.remove('on');

$('formAtualiza').onsubmit = async e => {
  e.preventDefault();
  const status = $('mStatus').value, obs = $('mObs').value.trim();
  if (status === 'Perdido' && !obs){ $('mErro').textContent = 'Registre o motivo para marcar como perdido.'; return; }
  const btn = $('mSalvar'); btn.disabled = true;
  try{
    const novo = $('mCorretor').value;
    if (sess.papel === 'matriz' && novo && novo !== atual.corretorUsuario) {
      await chamar('atribuirLead', sess.token, atual.id, novo);
    }
    await chamar('atualizarLead', sess.token, atual.id, status, obs);
    $('modalLead').classList.remove('on');
    await carregar();
  }catch(err){ $('mErro').textContent = err.message; }
  finally{ btn.disabled = false; }
};

// ---------- Modal de formulário (novo lead / novo corretor) ----------
function abrirForm(titulo, corpo, salvar){
  $('fTitulo').textContent = titulo;
  $('fCorpo').innerHTML = corpo;
  $('fErro').textContent = '';
  $('fSalvar').onclick = async () => {
    $('fErro').textContent = '';
    const btn = $('fSalvar'); btn.disabled = true;
    try{ await salvar(); $('modalForm').classList.remove('on'); await carregar(); }
    catch(err){ $('fErro').textContent = err.message; }
    finally{ btn.disabled = false; }
  };
  $('modalForm').classList.add('on');
}

$('fCancelar').onclick = () => $('modalForm').classList.remove('on');

function abrirNovoLead(){
  abrirForm('Novo lead',
    '<div class="grid2"><div><label>Nome</label><input id="nNome"></div><div><label>Telefone</label><input id="nTel"></div>' +
    '<div><label>E-mail</label><input id="nEmail"></div><div><label>Origem</label><input id="nOrigem" placeholder="Meta Ads, site, indicação..."></div></div>' +
    '<label>Interesse (imóvel / empreendimento)</label><input id="nInteresse">' +
    '<label>Observações da matriz</label><textarea id="nObs" rows="2"></textarea>',

      const dados = {

        origem: $('nOrigem').value.trim(), interesse: $('nInteresse').value.trim(), obsEntrada: $('nObs').value.trim()
      };
      return chamar('criarLead', sess.token, dados);
    });
}

function abrirNovoCorr(){
  abrirForm('Novo corretor',
    '<div class="grid2"><div><label>Nome</label><input id="cNome"></div><div><label>Usuário (login)</label><input id="cUsuario"></div>' +
    '<div><label>Senha inicial (mín. 6)</label><input id="cSenha" type="password"></div><div><label>Telefone</label><input id="cTel"></div></div>',
    () => {
      const dados = {
        nome: $('cNome').value.trim(), usuario: $('cUsuario').value.trim(),
        senha: $('cSenha').value, telefone: $('cTel').value.trim()
      };
      return chamar('criarCorretor', sess.token, dados);
    });
}

// ---------- Início ----------
(function init(){
  const s = lerSessao();
  if (s && s.token){ sess = s; entrar(); }
  else $('login').classList.remove('hidden');
})();
</script>
