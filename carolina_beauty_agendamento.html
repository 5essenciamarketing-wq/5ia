<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Carolina Beauty — Agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF5EF;
    --panel:#FFFFFF;
    --ink:#2B1B1E;
    --ink-soft:#6B5B5C;
    --wine:#7A2036;
    --wine-deep:#5C1727;
    --gold:#B08A4E;
    --blush:#F1DDD3;
    --blush-line:#E7CFC0;
    --shadow: 0 18px 50px -20px rgba(43,27,30,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow-x:hidden;}
  html{ touch-action:manipulation; } /* evita zoom por duplo-toque, mantém scroll normal */
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:
      radial-gradient(circle at 15% 0%, #FBEDE4 0%, transparent 55%),
      radial-gradient(circle at 100% 100%, #F7E4D8 0%, transparent 50%),
      var(--cream);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:430px;
    height:min(760px, 92vh);
    background:var(--panel);
    border-radius:28px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid var(--blush-line);
  }
  header.top{
    background:linear-gradient(135deg, var(--wine) 0%, var(--wine-deep) 100%);
    color:#fff;
    padding:20px 22px 18px;
    display:flex;
    align-items:center;
    gap:14px;
    position:relative;
  }
  header.top::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:10px;
    background:
      radial-gradient(circle, var(--wine-deep) 45%, transparent 46%) 0 0/16px 16px repeat-x;
    opacity:.9;
  }
  .head-text{display:flex;flex-direction:column;line-height:1.25;}
  .head-text .name{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;letter-spacing:.2px;}
  .head-text .status{font-size:.75rem;color:#F1DDD3;display:flex;align-items:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:#7CE0A6;display:inline-block;}

  main.thread{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:
      repeating-linear-gradient(135deg, rgba(122,32,54,0.02) 0 2px, transparent 2px 40px);
  }
  main.thread::-webkit-scrollbar{width:6px;}
  main.thread::-webkit-scrollbar-thumb{background:var(--blush-line);border-radius:10px;}

  .msg{
    max-width:80%;
    padding:11px 14px;
    border-radius:16px;
    font-size:.92rem;
    line-height:1.45;
    animation:rise .25s ease both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .msg.bot{
    align-self:flex-start;
    background:var(--blush);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--wine);
    color:#fff;
    border-bottom-right-radius:4px;
    display:flex;
    align-items:flex-end;
    gap:5px;
  }
  .msg.user .msg-texto{ flex:1; }
  .msg.user .ticks{
    flex-shrink:0;
    display:inline-flex;
    color:rgba(255,255,255,.6);
    transition:color .3s ease;
    margin-bottom:1px;
  }
  .msg.user .ticks.lido{ color:#53BDEB; }
  .msg b{font-weight:700;}
  .msg .price{color:var(--wine-deep); font-weight:700;}
  .msg.bot .price{color:var(--wine);}

  .typing{
    align-self:flex-start;
    display:flex; gap:4px;
    background:var(--blush);
    padding:12px 16px;
    border-radius:16px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--wine);
    opacity:.5;
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.3; transform:translateY(0);} 40%{opacity:1; transform:translateY(-2px);}}

  .choices{
    align-self:flex-start;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-width:92%;
    margin-top:2px;
  }
  .chip{
    border:1.5px solid var(--wine);
    color:var(--wine);
    background:#fff;
    padding:9px 14px;
    border-radius:999px;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
    font-family:'Manrope',sans-serif;
  }
  .chip:hover{background:var(--wine); color:#fff;}
  .chip:disabled{opacity:.4; cursor:default;}
  .chip.ghost{border-color:var(--blush-line); color:var(--ink-soft);}
  .chip.ghost:hover{background:var(--blush); color:var(--ink);}

  .composer{
    display:flex;
    gap:10px;
    padding:14px 16px;
    border-top:1px solid var(--blush-line);
    background:#fff;
  }
  .composer input{
    flex:1;
    border:1.5px solid var(--blush-line);
    border-radius:999px;
    padding:11px 16px;
    font-size:16px; /* >=16px evita zoom automático do iOS ao focar o campo */
    font-family:'Manrope',sans-serif;
    outline:none;
    background:var(--cream);
    color:var(--ink);
  }
  .composer input:focus{border-color:var(--wine);}
  .composer button{
    width:44px;height:44px;
    border-radius:50%;
    border:none;
    background:var(--wine);
    color:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:.15s;
  }
  .composer button:hover{background:var(--wine-deep);}
  .composer button:disabled{opacity:.4; cursor:default;}
  .composer svg{width:18px;height:18px;}

  .back-row{
    align-self:flex-start;
    margin-top:-2px;
  }
  .back-chip{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:.78rem;
    font-family:'Manrope',sans-serif;
    cursor:pointer;
    display:flex;align-items:center;gap:4px;
    padding:4px 2px;
  }
  .back-chip:hover{color:var(--wine);}

  /* ---- header: logo, marca, botão de agendamentos ---- */
  .logo-badge{
    width:44px;height:44px;
    border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
  }
  .logo-badge img{
    width:78%;
    object-fit:contain;
  }
  .head-text{flex:1; min-width:0;}
  .head-text .name{font-weight:700;}
  .head-text .brand{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:.72rem;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:#F1DDD3;
    display:block;
  }
  .agenda-btn{
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.35);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:.76rem;
    padding:8px 13px;
    border-radius:999px;
    cursor:pointer;
    flex-shrink:0;
    transition:.15s;
    white-space:nowrap;
  }
  .agenda-btn:hover{background:rgba(255,255,255,.24);}

  /* ---- card de perfil da profissional (aparece ao escolher horário) ---- */
  .profissional-card{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--blush-line);
    border-radius:16px;
    padding:10px 16px 10px 10px;
    max-width:88%;
    box-shadow:0 6px 18px -10px rgba(43,27,30,.35);
    animation:rise .3s ease both;
  }
  .profissional-card img{
    width:52px;height:52px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    border:2px solid var(--blush);
  }
  .profissional-card .prof-nome{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:.95rem;
    color:var(--ink);
  }
  .profissional-card .prof-tag{
    font-size:.74rem;
    color:var(--ink-soft);
  }

  /* ---- painel "meus agendamentos" ---- */
  .agenda-overlay{
    position:absolute;
    inset:0;
    background:rgba(43,27,30,.35);
    display:none;
    align-items:flex-end;
    z-index:20;
  }
  .agenda-overlay.open{display:flex;}
  .agenda-panel{
    background:var(--panel);
    width:100%;
    max-height:78%;
    border-radius:22px 22px 0 0;
    padding:20px 20px 24px;
    overflow-y:auto;
    animation:slideUp .25s ease both;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .agenda-panel h3{
    font-family:'Fraunces',serif;
    margin:0 0 12px;
    font-size:1.1rem;
    color:var(--wine-deep);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .agenda-panel h3 button{
    border:none;background:none;color:var(--ink-soft);
    font-size:1.1rem; cursor:pointer; line-height:1;
  }
  .agenda-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--blush-line);
    font-size:.88rem;
  }
  .agenda-item:last-child{border-bottom:none;}
  .agenda-item .ag-servico{font-weight:600; color:var(--ink);}
  .agenda-item .ag-data{color:var(--ink-soft); font-size:.8rem;}
  .agenda-empty{
    color:var(--ink-soft);
    font-size:.85rem;
    padding:8px 0 4px;
  }

  /* ---- galeria de trabalhos (dentro do chat) ---- */
  .galeria-msg{
    align-self:flex-start;
    max-width:92%;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .galeria-legenda{
    font-size:.78rem;
    color:var(--ink-soft);
    padding-left:2px;
  }
  .galeria-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    scroll-snap-type:x proximity;
  }
  .galeria-scroll::-webkit-scrollbar{height:5px;}
  .galeria-scroll::-webkit-scrollbar-thumb{background:var(--blush-line); border-radius:10px;}
  .galeria-scroll img{
    width:112px;
    height:140px;
    object-fit:cover;
    border-radius:14px;
    flex-shrink:0;
    scroll-snap-align:start;
    border:1px solid var(--blush-line);
    box-shadow:0 6px 14px -8px rgba(43,27,30,.4);
  }

  /* ---- cartão de confirmação de agendamento ---- */
  .confirm-card{
    align-self:flex-start;
    max-width:88%;
    background:var(--panel);
    border:1px solid var(--blush-line);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 26px -14px rgba(43,27,30,.4);
    animation:rise .3s ease both;
  }
  .confirm-card .foto{
    width:100%;
    height:130px;
    object-fit:cover;
    display:block;
  }
  .confirm-card .conteudo{
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .confirm-card .status-badge{
    align-self:flex-start;
    background:var(--gold);
    color:#fff;
    font-size:.68rem;
    font-weight:700;
    letter-spacing:.3px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:2px;
  }
  .confirm-card .status-badge.ok{ background:#3F9463; }
  .confirm-card .servico-nome{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:1.02rem;
    color:var(--ink);
    line-height:1.3;
  }
  .confirm-card .linha{
    font-size:.85rem;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .confirm-card .linha b{ color:var(--ink); }
  .confirm-card .wa-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:8px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:11px;
    border-radius:12px;
    font-weight:700;
    font-size:.85rem;
    font-family:'Manrope',sans-serif;
    transition:.15s;
  }
  .confirm-card .wa-btn:hover{ filter:brightness(0.95); }
  .confirm-card .wa-btn svg{ width:16px; height:16px; flex-shrink:0; }

  @media (prefers-reduced-motion: reduce){
    .msg, .typing span, .profissional-card, .agenda-panel{animation:none;}
  }
</style>
</head>

// Agrega os serviços escolhidos (relevante quando a cliente pede mãos + pés)
function servicoAgregado(){
  const nome = state.servicos.map(s=>s.nome).join(" + ");
  const duracao = state.servicos.reduce((a,s)=>a+(s.duracao||0), 0);
  const todosConfirmados = state.servicos.every(s=>s.confirmado);
  const preco = todosConfirmados ? state.servicos.reduce((a,s)=>a+(s.preco||0), 0) : null;
  const incluiEsmaltacao = state.servicos.some(s=>s.incluiEsmaltacao);
  return { nome, duracao, preco, confirmado: todosConfirmados, incluiEsmaltacao };
}

// Tempo de "digitação" proporcional ao tamanho do texto, com variação
// aleatória — evita o ritmo robótico de delay fixo.
function tempoDigitando(text){
  const len = (text || "").replace(/<[^>]+>/g, "").length;
  const base = 500;
  const porCaractere = 16;
  const variacao = Math.random() * 500;
  return Math.min(2600, Math.max(650, base + len * porCaractere + variacao));
}

// pausa curta simulando "viu a mensagem antes de começar a responder"
function pausaAntesDeVer(){
  return 300 + Math.random() * 450;
}

async function bot(text, {comPausaDeVer=true, delay=null} = {}){
  if(comPausaDeVer){
    await new Promise(r=>setTimeout(r, pausaAntesDeVer()));
  }
  showTyping();
  await new Promise(r=>setTimeout(r, delay ?? tempoDigitando(text)));
  hideTyping();
  addMsg(text, "bot");
}

// Envia várias mensagens em sequência, como uma pessoa mandando
// vários balõezinhos em vez de um bloco único. Só a primeira tem a
// pausa de "viu a mensagem" — as seguintes são a mesma pessoa
// continuando a digitar.
async function botSeq(linhas){
  for(let i=0; i<linhas.length; i++){
    await bot(linhas[i], { comPausaDeVer: i===0 });
  }
}

function renderChoices(options, onPick, {ghostBack=null}={}){

      backRow?.remove();

    bb.type = 'button';

    backRow.appendChild(bb);
    thread.appendChild(backRow);
  }
  scrollBottom();
}

function proximosDiasUteis(qtd=6){
  const out = [];
  let d = new Date();
  while(out.length < qtd){
    d.setDate(d.getDate()+1);
    if(STUDIO.diasAtendimento.includes(d.getDay())){
      out.push(new Date(d));
    }
  }
  return out;
}

// Guarda os horários já checados no pré-carregamento, pra não bater na
// agenda de novo quando a cliente escolher um dos dias que a gente já
// sabe que tem vaga.
let cacheDisponibilidade = {};

// Em vez de mostrar 6 dias genéricos e só descobrir depois que estão
// lotados, a Iza checa a agenda ANTES e só oferece dias que realmente
// têm horário livre pra esse serviço.
async function renderDatePicker(){
  clearChoices();
  await bot(`Deixa eu ver os próximos dias com vaga, <b>${primeiroNome(state.nome)}</b>...`);

  const agg = servicoAgregado();
  const candidatos = proximosDiasUteis(14); // procura até 14 dias úteis à frente
  const diasComVaga = [];
  cacheDisponibilidade = {};

  for(const d of candidatos){
    const dataISO = d.toISOString().slice(0,10);
    try{
      const slots = await buscarHorariosDisponiveis(dataISO, agg.duracao);
      if(slots.length > 0){
        cacheDisponibilidade[dataISO] = slots;
        diasComVaga.push({ data: d, dataISO });
      }
    }catch(e){
      console.warn("Erro checando disponibilidade em", dataISO, e);
    }
    if(diasComVaga.length >= 6) break;
  }

  if(diasComVaga.length === 0){
    await bot(`Não achei vaga nos próximos dias pra esse serviço 😕 Me chama direto no ${STUDIO.whatsappApoio} que a gente encaixa você.`);
    renderChoices([{label:"Chamar no WhatsApp", value:"wpp"}], ()=>{
      window.open(`https://wa.me/55${STUDIO.whatsappApoio.replace(/\D/g,'')}`, '_blank');
    });
    return;
  }

  const options = diasComVaga.map(({ data, dataISO }) => ({
    label: data.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'}),
    value: dataISO
  }));
  renderChoices(options, async (dataISO)=>{
    pushHistory(stepConfirmaServico);
    state.data = dataISO;
    await stepBuscarDisponibilidade();
  }, { ghostBack: goBack });
}

async function stepBuscarDisponibilidade(){
  await bot(`Peraí, <b>${primeiroNome(state.nome)}</b>, deixa eu ver aqui na agenda... 💅`);
  const agg = servicoAgregado();
  let slots = cacheDisponibilidade[state.data];
  if(!slots){
    try{
      slots = await buscarHorariosDisponiveis(state.data, agg.duracao);
    }catch(e){
      console.warn("Falha ao consultar agenda:", e);
      await bot("Ih, não consegui ver a agenda agora 😕 Tenta de novo ou me chama direto no " + STUDIO.whatsappApoio);
      renderChoices([{label:"Tentar de novo", value:"retry"}], stepBuscarDisponibilidade);
      return;
    }
  }

  if(slots.length === 0){
    await bot("Esse horário acabou de ser ocupado 😕 Quer ver outra data?");
    renderChoices([{label:"Escolher outro dia", value:"back"}], renderDatePicker);
    return;
  }

  await bot("Esses horários estão livres:");
  renderChoices(
    slots.map(h=>({label:h, value:h})),
    async (hora)=>{
      pushHistory(renderDatePicker);
      state.hora = hora;
      await stepConfirmaHorario();
    },
    { ghostBack: renderDatePicker }
  );
}

// Consulta Apps Script: GET ?action=disponibilidade&data=YYYY-MM-DD
async function buscarHorariosDisponiveis(dataISO, duracaoMin){
  const url = `${APPS_SCRIPT_URL}?action=disponibilidade&data=${dataISO}`;
  const res = await fetch(url);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "erro desconhecido");

  const ocupados = (json.ocupados || []).map(o=>({
    inicio: toMinutes(o.inicio),
    fim: toMinutes(o.fim)
  }));

  const abre = toMinutes(STUDIO.abre);
  const fecha = toMinutes(STUDIO.fecha);
  const passo = 30; // grade de 30 em 30 min
  const livres = [];

  for(let t=abre; t + duracaoMin <= fecha; t += passo){
    const fimSlot = t + duracaoMin;
    const conflita = ocupados.some(o => t < o.fim && fimSlot > o.inicio);
    if(!conflita) livres.push(toHHMM(t));
  }
  return livres;
}

function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function toHHMM(min){
  const h = String(Math.floor(min/60)).padStart(2,'0');
  const m = String(min%60).padStart(2,'0');
  return `${h}:${m}`;
}

    `Nome: ${state.nome}`;
  const numero = "55" + STUDIO.whatsappApoio.replace(/\D/g, "");
  return `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
}

// Cartão visual de confirmação (em vez de texto cheio de emoji). Usado
// tanto na prévia (antes de confirmar) quanto na versão final confirmada.
function mostrarCartaoConfirmacao({ confirmado }){
  const agg = servicoAgregado();
  const nota = agg.incluiEsmaltacao ? " (inclui esmaltação em gel)" : "";
  const foto = FOTOS_TRABALHOS[Math.floor(Math.random() * FOTOS_TRABALHOS.length)];

  const card = document.createElement('div');
  card.className = 'confirm-card';
  card.innerHTML = `
    <img class="foto" src="${foto}" alt="Trabalho ${STUDIO.nome}">
    <div class="conteudo">
      <span class="status-badge ${confirmado ? 'ok' : ''}">${confirmado ? 'Confirmado' : 'Confira antes de confirmar'}</span>
      <div class="servico-nome">${agg.nome}${nota}</div>
      <div class="linha">📅 <b>${formatDataLegivel(state.data)}</b> às <b>${state.hora}</b></div>
      <div class="linha">💰 <b>${BRL(agg.preco)}</b> — ${STUDIO.formasPagamento}</div>
      <div class="linha">📍 ${STUDIO.endereco}${STUDIO.atendeDomicilio ? "" : " (atendimento só no studio)"}</div>
      <div class="linha">⚠️ ${capitalizar(STUDIO.cancelamento)}</div>
      <a class="wa-btn" href="${linkWhatsapp(agg)}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.12h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.35c0-4.54 3.7-8.24 8.26-8.24a8.2 8.2 0 0 1 5.83 2.42 8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.7 8.21-8.25 8.21zm4.52-6.16c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.04-.38-1.99-1.22-.73-.66-1.23-1.46-1.37-1.71-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.42-.14-.01-.31-.01-.48-.01a.92.92 0 0 0-.67.31c-.23.25-.87.85-.87 2.08 0 1.22.89 2.4 1.02 2.57.12.17 1.75 2.67 4.24 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.14-1.18-.06-.1-.23-.16-.48-.28z"/></svg>
        Enviar no WhatsApp
      </a>
    </div>
  `;
  thread.appendChild(card);
  scrollBottom();
}

async function finalizarAgendamento(){
  await bot("Só um segundo, já confirmo aqui ⏳");
  const agg = servicoAgregado();
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain"}, // evita preflight CORS no Apps Script
      body: JSON.stringify({
        action: "agendar",
        servico: agg.nome,
        duracao: agg.duracao,
        preco: agg.preco,
        data: state.data,
        hora: state.hora,
        nome: state.nome,
        whatsapp: state.whatsapp
      })
    });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || "erro ao agendar");

    state.agendamentos.push({
      servico: agg.nome,
      data: state.data,
      hora: state.hora
    });

    await bot(`Prontinho, <b>${primeiroNome(state.nome)}</b>!`);
    mostrarCartaoConfirmacao({ confirmado: true });
    renderChoices([{label:"Marcar outro horário", value:"novo"}], ()=>{ resetState(); start(); });
  }catch(e){
    console.warn("Erro ao agendar:", e);
    await bot(`Deu um erro pra confirmar aqui pelo sistema 😕 Mas não se preocupa, <b>${primeiroNome(state.nome)}</b> — me chama no WhatsApp de apoio (${STUDIO.whatsappApoio}) que a gente confirma na mão: <b>${agg.nome}</b>, ${formatDataLegivel(state.data)} às ${state.hora}.`);
  }
}

async function salvarLeadParcial(s){
  return fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain"},
    body: JSON.stringify({
      action: "lead_parcial",
      nome: s.nome,
      whatsapp: s.whatsapp,
      servicoInteresse: s.servicos.map(x=>x.nome).join(" + ") || null
    })
  });
}

function resetState(){
  state.step = "start";
  state.categoria = null;
  state.servicos = [];
  state.data = null;
  state.hora = null;
  state.nome = null;
  state.whatsapp = null;
  state.history = [];
}

// ---------------------------------------------------------------------
// Entrada de texto livre (nome / whatsapp)
// Sem <form>/submit de propósito: em alguns ambientes de preview em
// iframe, o submit de formulário fica bloqueado — clique direto no
// botão + tecla Enter no campo funcionam em qualquer lugar.
// ---------------------------------------------------------------------
let pendingTextHandler = null;
let pendingEhNome = false;
const sendBtn = document.getElementById('sendBtn');

// Deixa cada palavra do nome com inicial maiúscula (ex.: "ana paula" -> "Ana Paula")
function capitalizarNome(str){
  return str.trim().split(/\s+/).map(palavra =>
    palavra.charAt(0).toLocaleUpperCase('pt-BR') + palavra.slice(1).toLocaleLowerCase('pt-BR')
  ).join(' ');
}

function askFreeText(handler, { ehNome=false, teclado='text' } = {}){
  pendingTextHandler = handler;
  pendingEhNome = ehNome;
  composer.style.display = 'flex';
  freeInput.value = '';
  freeInput.setAttribute('inputmode', teclado === 'tel' ? 'tel' : 'text');
  freeInput.setAttribute('type', teclado === 'tel' ? 'tel' : 'text');
  freeInput.setAttribute('placeholder', teclado === 'tel' ? '(00) 00000-0000' : 'Digite aqui...');
  freeInput.focus();
}

async function enviarTextoLivre(){
  let val = freeInput.value.trim();
  if(!val || !pendingTextHandler) return;
  if(pendingEhNome) val = capitalizarNome(val);
  addMsg(val, "user");
  freeInput.value = '';
  composer.style.display = 'none';
  const handler = pendingTextHandler;
  pendingTextHandler = null;
  await handler(val);
}

sendBtn.addEventListener('click', enviarTextoLivre);
freeInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    enviarTextoLivre();
  }
});

// ---------------------------------------------------------------------
// Painel "Agendamentos" (botão no header)
// ---------------------------------------------------------------------
const agendaBtn = document.getElementById('agendaBtn');
const agendaOverlay = document.getElementById('agendaOverlay');
const agendaLista = document.getElementById('agendaLista');
const fecharAgenda = document.getElementById('fecharAgenda');

function renderAgendaLista(lista){
  if(!lista || lista.length === 0){
    agendaLista.innerHTML = `<div class="agenda-empty">Você ainda não tem nenhum agendamento confirmado por aqui.</div>`;
    return;
  }
  agendaLista.innerHTML = lista.map(a => `
    <div class="agenda-item">
      <div>
        <div class="ag-servico">${a.servico}</div>
        <div class="ag-data">${formatDataLegivel(a.data)} às ${a.hora}</div>
      </div>
    </div>
  `).join('');
}

// Busca os agendamentos reais na planilha (aba "Agenda") pelo WhatsApp já
// informado nesta conversa. Se ainda não tiver WhatsApp (cliente não
// chegou nessa etapa), mostra só o que foi confirmado nesta sessão.
async function abrirPainelAgendamentos(){
  agendaOverlay.classList.add('open');
  agendaLista.innerHTML = `<div class="agenda-empty">Buscando seus agendamentos...</div>`;

  if(!state.whatsapp){
    renderAgendaLista(state.agendamentos);
    return;
  }

  try{
    const url = `${APPS_SCRIPT_URL}?action=meus_agendamentos&whatsapp=${encodeURIComponent(state.whatsapp)}`;
    const res = await fetch(url);
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || "erro desconhecido");
    renderAgendaLista(json.agendamentos);
  }catch(e){
    console.warn("Falha ao buscar agendamentos:", e);
    renderAgendaLista(state.agendamentos); // fallback: pelo menos o desta sessão
  }
}

agendaBtn.addEventListener('click', abrirPainelAgendamentos);
fecharAgenda.addEventListener('click', ()=> agendaOverlay.classList.remove('open'));
agendaOverlay.addEventListener('click', (e)=>{
  if(e.target === agendaOverlay) agendaOverlay.classList.remove('open');
});

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
start();
</script>
