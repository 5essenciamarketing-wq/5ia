    background:var(--bg);
    color:var(--chrome);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}

  /* ===== Textured backdrop ===== */
  .asphalt{
    position:fixed; inset:0; z-index:-1;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 64px),
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(225,58,46,0.12), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(199,205,212,0.05), transparent 55%),
      var(--bg);
  }

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px;
    background:rgba(11,13,16,0.82);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand-logo{
    height:34px; width:auto;
  }
  .header-cta{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:12px;
    color:var(--chrome-dim);
  }
  .header-cta strong{color:var(--chrome); font-weight:700;}

  /* ===== Hero ===== */
  .hero{
    padding:88px 28px 56px;
    max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns:1.3fr 1fr; gap:40px; align-items:end;
  }
  .hero-tag{
    font-family:var(--font-mono); font-size:12px; letter-spacing:2px; text-transform:uppercase;
    color:var(--amber); margin-bottom:18px; display:flex; align-items:center; gap:10px;
  }
  .hero-tag::before{content:''; width:22px; height:1px; background:var(--amber);}
  h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(40px, 6vw, 74px);
    line-height:0.95;
    color:#fff;
    letter-spacing:-0.5px;
  }
  h1 em{font-style:normal; color:var(--amber);}
  .hero-sub{
    font-size:15px; line-height:1.6; color:var(--chrome-dim); max-width:380px;
    padding-bottom:6px;
  }
  .hero-stats{
    display:flex; gap:28px; margin-top:22px;
  }
  .stat{font-family:var(--font-mono);}
  .stat b{display:block; font-size:26px; color:#fff; font-family:var(--font-display); font-weight:700;}
  .stat span{font-size:11px; color:var(--chrome-dim); text-transform:uppercase; letter-spacing:1px;}

  /* ===== Filters ===== */
  .filters{
    position:sticky; top:66px; z-index:40;
    max-width:1180px; margin:0 auto; padding:0 28px 18px;
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background:linear-gradient(var(--bg) 70%, transparent);
  }
  .search-box{
    flex:1; min-width:200px;
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:11px 14px;
  }
  .search-box input{
    background:none; border:none; outline:none; color:#fff; font-family:var(--font-body);
    font-size:14px; width:100%;
  }
  .search-box input::placeholder{color:var(--chrome-dim);}
  .pill{
    padding:10px 16px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--chrome-dim); font-size:13px; font-weight:600;
    cursor:pointer; transition:all .15s ease; white-space:nowrap;
  }
  .pill:hover{border-color:var(--amber-dim); color:var(--chrome);}
  .pill.active{background:var(--amber); color:#1a1102; border-color:var(--amber);}

  /* ===== Grid ===== */
  .grid-wrap{max-width:1180px; margin:0 auto; padding:24px 28px 100px;}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:22px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:transform .2s ease, border-color .2s ease;
  }
  .card:hover{transform:translateY(-3px); border-color:rgba(232,163,61,0.35);}

  .carousel{position:relative; aspect-ratio:4/3; background:var(--surface-2); overflow:hidden;}
  .carousel .track{
    display:flex; height:100%; transition:transform .35s ease;
  }
  .carousel img{width:100%; height:100%; object-fit:cover; flex-shrink:0;}
  .carousel .no-photo{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--chrome-dim); font-family:var(--font-mono); font-size:12px; flex-direction:column; gap:8px;
  }
  .carousel-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border-radius:50%;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    color:#fff; cursor:pointer; opacity:0; transition:opacity .15s ease;
    border:none;
  }
  .carousel:hover .carousel-nav{opacity:1;}
  .carousel-nav.prev{left:8px;} .carousel-nav.next{right:8px;}
  .dots{
    position:absolute; bottom:10px; left:0; right:0;
    display:flex; justify-content:center; gap:5px;
  }
  .dots span{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,0.35);}
  .dots span.active{background:var(--amber); width:14px; border-radius:3px;}

  .plate{
    position:absolute; top:10px; left:10px;
    font-family:var(--font-mono); font-size:11px; font-weight:700;
    background:rgba(11,13,16,0.75); color:var(--amber);
    padding:4px 8px; border-radius:6px; border:1px solid rgba(232,163,61,0.3);
    letter-spacing:1px;
  }

  .card-body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .card-title{font-family:var(--font-display); font-weight:700; font-size:20px; color:#fff; line-height:1.1;}
  .card-meta{display:flex; gap:14px; font-family:var(--font-mono); font-size:11.5px; color:var(--chrome-dim);}
  .card-desc{font-size:12.5px; color:var(--chrome-dim); line-height:1.5; flex:1;}
  .card-footer{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:4px;}
  .price{font-family:var(--font-display); font-weight:800; font-size:22px; color:#fff; font-variant-numeric:tabular-nums;}
  .price span{display:block; font-family:var(--font-mono); font-size:9.5px; color:var(--chrome-dim); font-weight:400; letter-spacing:1px;}
  .whats-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--whats); color:#08160c; font-weight:700; font-size:12.5px;
    padding:10px 14px; border-radius:9px; white-space:nowrap;
  }
  .whats-btn svg{width:14px; height:14px; flex-shrink:0;}

  /* ===== States ===== */
  .state{
    grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--chrome-dim);
    font-family:var(--font-mono); font-size:13px;
  }
  .state b{display:block; font-family:var(--font-display); font-size:24px; color:#fff; margin-bottom:8px; font-weight:700;}
  .skeleton{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;}
  .skeleton .sk-img{aspect-ratio:4/3; background:linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size:200% 100%; animation:shimmer 1.4s infinite;}
  .skeleton .sk-line{height:12px; margin:14px 16px; border-radius:4px; background:var(--surface-2);}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* ===== Footer ===== */
  footer{
    border-top:1px solid var(--line); padding:36px 28px; text-align:center;
    font-family:var(--font-mono); font-size:11.5px; color:var(--chrome-dim);
  }
  footer strong{color:var(--chrome); font-family:var(--font-body);}

  @media (max-width: 860px){
    .hero{grid-template-columns:1fr; gap:20px;}
    .filters{top:60px;}
  }
</style>
</head>

  <div class="header-cta"><strong>Bagé/RS</strong> — seminovos selecionados</div>

<section class="hero">
  <div>
    <div class="hero-tag">Estoque ao vivo</div>
    <h1>Carro certo,<br><em>direto no zap.</em></h1>
  </div>
  <div>
    <p class="hero-sub">Vitrine atualizada com fotos reais de cada veículo em estoque. Escolhe, chama no WhatsApp e vem ver de perto.</p>
    <div class="hero-stats">
      <div class="stat"><b id="stat-total">—</b><span>veículos</span></div>
      <div class="stat"><b id="stat-marcas">—</b><span>marcas</span></div>
    </div>
  </div>
</section>

<div class="filters" id="filters">
  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="search" placeholder="Buscar modelo, marca, ano...">
  </div>
  <div id="brand-pills" style="display:flex; gap:8px; flex-wrap:wrap;">
    <button class="pill active" data-brand="todas">Todas</button>
  </div>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid">
    <!-- skeleton inicial -->
    <div class="skeleton"><div class="sk-img"></div><div class="sk-line" style="width:60%"></div><div class="sk-line" style="width:40%"></div></div>
    <div class="skeleton"><div class="sk-img"></div><div class="sk-line" style="width:60%"></div><div class="sk-line" style="width:40%"></div></div>
    <div class="skeleton"><div class="sk-img"></div><div class="sk-line" style="width:60%"></div><div class="sk-line" style="width:40%"></div></div>
  </div>
</div>

<footer>
  <strong>Sibele Multimarcas</strong> · Bagé, RS<br>
  Estoque atualizado automaticamente
</footer>

<script>
// ============ CONFIG ============
const APPS_SCRIPT_URL = 'COLE_AQUI_A_URL_DO_APPS_SCRIPT_/exec';
const WHATSAPP_NUMBER = '55XXXXXXXXXXX'; // com DDI e DDD, só números

// ============ STATE ============
let CARROS = [];
let carouselIndex = {};

const gridEl = document.getElementById('grid');
const searchEl = document.getElementById('search');
const pillsEl = document.getElementById('brand-pills');

function formatPrice(v){
  const n = Number(v) || 0;
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
}
function formatKm(v){
  const n = Number(v) || 0;
  return n.toLocaleString('pt-BR') + ' km';
}
function whatsLink(carro){
  const msg = `Olá! Vi o ${carro.modelo} ${carro.ano} na vitrine e quero saber mais.`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function renderPills(){
  const marcas = [...new Set(CARROS.map(c => c.marca).filter(Boolean))].sort();
  pillsEl.innerHTML = '<button class="pill active" data-brand="todas">Todas</button>' +
    marcas.map(m => `<button class="pill" data-brand="${m}">${m}</button>`).join('');
  pillsEl.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      pillsEl.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    });
  });
}

function cardHTML(carro, i){
  const fotos = carro.fotos && carro.fotos.length ? carro.fotos : null;
  carouselIndex[carro.id] = 0;

  const media = fotos
    ? `<div class="track" id="track-${carro.id}">${fotos.map(f => `<img src="${f}" loading="lazy" alt="${carro.modelo}">`).join('')}</div>
       ${fotos.length > 1 ? `
         <button class="carousel-nav prev" onclick="moveCarousel('${carro.id}', -1)">‹</button>
         <button class="carousel-nav next" onclick="moveCarousel('${carro.id}', 1)">›</button>
         <div class="dots" id="dots-${carro.id}">${fotos.map((_,d) => `<span class="${d===0?'active':''}"></span>`).join('')}</div>
       ` : ''}`
    : `<div class="no-photo">
         <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7 10 4h4l2 3"/><circle cx="12" cy="13.5" r="3.5"/></svg>
         fotos em breve
       </div>`;

  return `
  <div class="card">
    <div class="carousel">
      ${media}
      <div class="plate">SIB-${String(carro.id).padStart(3,'0')}</div>
    </div>
    <div class="card-body">
      <div class="card-title">${carro.marca || ''} ${carro.modelo || ''}</div>
      <div class="card-meta">
        <span>${carro.ano || '—'}</span>
        <span>${formatKm(carro.km)}</span>
      </div>
      ${carro.descricao ? `<div class="card-desc">${carro.descricao}</div>` : ''}
      <div class="card-footer">
        <div class="price">${formatPrice(carro.preco)}<span>à vista</span></div>
        <a class="whats-btn" href="${whatsLink(carro)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.4 1.26 4.83L2 22l5.4-1.42a9.9 9.9 0 0 0 4.64 1.18h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.83 9.83 0 0 0 12.04 2Z"/></svg>
          Chamar
        </a>
      </div>
    </div>
  </div>`;
}

function moveCarousel(id, dir){
  const carro = CARROS.find(c => String(c.id) === String(id));
  if(!carro || !carro.fotos) return;
  const total = carro.fotos.length;
  carouselIndex[id] = (carouselIndex[id] + dir + total) % total;
  const track = document.getElementById(`track-${id}`);
  track.style.transform = `translateX(-${carouselIndex[id] * 100}%)`;
  document.querySelectorAll(`#dots-${id} span`).forEach((d, i) => d.classList.toggle('active', i === carouselIndex[id]));
}
window.moveCarousel = moveCarousel;

function applyFilters(){
  const term = searchEl.value.trim().toLowerCase();
  const activeBrand = pillsEl.querySelector('.pill.active')?.dataset.brand || 'todas';

  const filtered = CARROS.filter(c => {
    const matchBrand = activeBrand === 'todas' || c.marca === activeBrand;
    const haystack = `${c.marca} ${c.modelo} ${c.ano}`.toLowerCase();
    const matchTerm = !term || haystack.includes(term);
    return matchBrand && matchTerm;
  });

  if(!filtered.length){
    gridEl.innerHTML = `<div class="state"><b>Nenhum veículo encontrado</b>Tenta outro termo ou fala com a gente no WhatsApp.</div>`;
    return;
  }
  gridEl.innerHTML = filtered.map((c,i) => cardHTML(c,i)).join('');
}

async function carregarEstoque(){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {cache:'no-store'});
    const data = await res.json();
    CARROS = data.carros || [];

    document.getElementById('stat-total').textContent = CARROS.length;
    document.getElementById('stat-marcas').textContent = new Set(CARROS.map(c=>c.marca)).size;

    renderPills();
    applyFilters();
  }catch(err){
    gridEl.innerHTML = `<div class="state"><b>Estoque indisponível no momento</b>Chama no WhatsApp que a gente te passa as opções direto.</div>`;
    console.error(err);
  }
}

searchEl.addEventListener('input', applyFilters);
carregarEstoque();
</script>
