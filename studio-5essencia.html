<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5essência · Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{
  --bg:#07070D;--bg1:#0D0D17;--bg2:#12121C;--bg3:#181826;
  --b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.11);--b3:rgba(255,255,255,0.18);
  --ink:#F0F0FF;--ink2:#9898BA;--ink3:#50506A;--ink4:#2A2A3E;
  --blue:#4C82FB;--blue-g:linear-gradient(135deg,#4C82FB,#7C3AED);
  --green:#2DD47A;--orange:#FF9A0A;--red:#FF3B45;--purple:#A855F7;--teal:#22D3EE;--gold:#FBBF24;
  --font:'Inter',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;}

/* ── LAYOUT PRINCIPAL ── */
.app{
  display:flex;flex-direction:column;
  height:100dvh;overflow:hidden;
}

/* ── TOPBAR ── */
.topbar{
  flex-shrink:0;
  height:calc(50px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:flex-end;justify-content:space-between;
  padding-left:16px;padding-right:16px;padding-bottom:9px;
  background:rgba(7,7,13,0.9);
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border-bottom:1px solid var(--b1);
  position:relative;z-index:20;
}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(76,130,251,0.4),transparent);}
.t-logo{display:flex;align-items:center;gap:9px;}
.t-dot{width:28px;height:28px;border-radius:8px;background:var(--blue-g);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;box-shadow:0 3px 12px rgba(76,130,251,0.4);}
.t-info{display:flex;flex-direction:column;}
.t-nome{font-size:13.5px;font-weight:700;letter-spacing:-0.3px;}
.t-date{font-size:10px;color:var(--ink3);}
.t-right{display:flex;align-items:center;gap:7px;}
.t-pill{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--bg3);border:1px solid var(--b1);color:var(--ink2);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all 0.15s;}
.t-pill.active{background:rgba(45,212,122,0.12);border-color:rgba(45,212,122,0.3);color:var(--green);}

/* ── FAIXA DE CLIENTES ── */
.clientes-strip{
  flex-shrink:0;
  padding:12px 0 10px;
  border-bottom:1px solid var(--b1);
  background:rgba(9,9,18,0.95);
  backdrop-filter:blur(20px);
}
.clientes-scroll{
  display:flex;gap:10px;overflow-x:auto;
  padding:0 16px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.clientes-scroll::-webkit-scrollbar{display:none;}

.c-card{
  flex-shrink:0;width:88px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  -webkit-tap-highlight-color:transparent;
  transition:all 0.2s;
}
.c-card:active{transform:scale(0.94);}
.c-avatar{
  width:54px;height:54px;border-radius:17px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;color:#fff;
  border:2.5px solid transparent;
  transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1);
  overflow:hidden;position:relative;
}
.c-card.selected .c-avatar{
  border-color:#fff;
  transform:scale(1.08);
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.c-timer-dot{
  position:absolute;top:3px;right:3px;
  width:8px;height:8px;border-radius:50%;
  background:var(--green);border:1.5px solid var(--bg);
  display:none;animation:pulse 1.5s ease infinite;
}
.c-timer-dot.show{display:block;}
.c-nome{
  font-size:10px;font-weight:600;color:var(--ink3);
  text-align:center;line-height:1.3;
  width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color 0.2s;
}
.c-card.selected .c-nome{color:var(--ink);}
.c-add{
  flex-shrink:0;width:88px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  -webkit-tap-highlight-color:transparent;
}
.c-add-circle{
  width:54px;height:54px;border-radius:17px;
  border:1.5px dashed var(--b2);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--ink3);
  transition:all 0.15s;
}
.c-add:active .c-add-circle{border-color:var(--blue);color:var(--blue);}
.c-add-label{font-size:10px;color:var(--ink4);}

/* ── DASHBOARD ── */
.dashboard{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 16px calc(20px + env(safe-area-inset-bottom));
}

/* Cliente selecionado header */
.dash-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.dash-cliente-info{display:flex;align-items:center;gap:10px;}
.dash-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;overflow:hidden;flex-shrink:0;}
.dash-nome{font-size:16px;font-weight:800;letter-spacing:-0.5px;}
.dash-empresa{font-size:11px;color:var(--ink3);margin-top:1px;}
.dash-actions{display:flex;gap:7px;}
.dash-btn{
  display:flex;align-items:center;gap:5px;
  padding:7px 12px;border-radius:10px;border:1px solid var(--b2);
  background:var(--bg2);color:var(--ink2);font-family:var(--font);
  font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.dash-btn:active{transform:scale(0.96);}
.dash-btn.primary{background:var(--blue-g);border-color:transparent;color:#fff;box-shadow:0 3px 14px rgba(76,130,251,0.3);}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.stat-card{background:var(--bg1);border:1px solid var(--b1);border-radius:14px;padding:12px 11px;}
.stat-val{font-size:20px;font-weight:900;letter-spacing:-0.8px;margin-bottom:3px;}
.stat-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);}

/* Timer ativo */
.timer-ativo{
  background:rgba(45,212,122,0.06);border:1px solid rgba(45,212,122,0.25);
  border-radius:16px;padding:13px 15px;margin-bottom:14px;
  display:none;align-items:center;gap:12px;
}
.timer-ativo.show{display:flex;}
.ta-pulse{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse 1.5s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.5);}}
.ta-info{flex:1;min-width:0;}
.ta-titulo{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.ta-cat{font-size:10px;color:var(--ink3);}
.ta-time{font-size:22px;font-weight:900;letter-spacing:-0.5px;color:var(--green);font-variant-numeric:tabular-nums;flex-shrink:0;}
.ta-stop{
  width:32px;height:32px;border-radius:9px;
  background:rgba(255,59,69,0.12);border:1px solid rgba(255,59,69,0.25);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--red);cursor:pointer;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}

/* Nova tarefa */
.nova-tarefa{display:flex;gap:7px;margin-bottom:14px;align-items:center;}
.nt-input{
  flex:1;background:var(--bg1);border:1px solid var(--b1);
  border-radius:12px;color:var(--ink);font-family:var(--font);
  font-size:14px;padding:12px 14px;outline:none;transition:all 0.15s;
  -webkit-appearance:none;
}
.nt-input:focus{border-color:rgba(76,130,251,0.5);background:var(--bg3);box-shadow:0 0 0 3px rgba(76,130,251,0.08);}
.nt-input::placeholder{color:var(--ink4);}
.nt-cat{
  background:var(--bg1);border:1px solid var(--b1);border-radius:12px;
  color:var(--ink2);font-family:var(--font);font-size:13px;
  padding:12px 8px;outline:none;-webkit-appearance:none;
  cursor:pointer;flex-shrink:0;
}
.nt-add{
  width:44px;height:44px;border-radius:12px;border:none;
  background:var(--blue-g);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all 0.15s;
  box-shadow:0 3px 12px rgba(76,130,251,0.3);
}
.nt-add:active{transform:scale(0.94);}

/* Tarefas */
.tarefas-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;margin-top:4px;}
.tarefas-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink3);}
.tarefas-count{font-size:10px;background:var(--bg3);border-radius:20px;padding:2px 8px;color:var(--ink3);}

.tarefa-card{
  background:var(--bg1);border:1px solid var(--b1);border-radius:14px;
  padding:11px 13px;margin-bottom:7px;
  display:flex;align-items:center;gap:11px;
  transition:all 0.15s;
}
.tarefa-card.running{background:rgba(45,212,122,0.04);border-color:rgba(45,212,122,0.25);}
.tarefa-card.concluida{opacity:0.45;}

.tc-btn{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:1px solid var(--b2);background:var(--bg2);
  font-size:12px;color:var(--ink2);transition:all 0.18s;
  -webkit-tap-highlight-color:transparent;
}
.tc-btn:active{transform:scale(0.9);}
.tc-btn.play:not(.running):hover{background:rgba(45,212,122,0.1);border-color:rgba(45,212,122,0.3);color:var(--green);}
.tc-btn.running{background:rgba(255,59,69,0.1);border-color:rgba(255,59,69,0.25);color:var(--red);}
.tc-btn.done{background:rgba(45,212,122,0.08);border-color:rgba(45,212,122,0.2);color:var(--green);cursor:default;}

.tc-info{flex:1;min-width:0;}
.tc-titulo{font-size:13.5px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tc-row{display:flex;align-items:center;gap:7px;}
.tc-badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;}
.cat-design{background:rgba(168,85,247,0.12);color:#A855F7;}
.cat-edicao{background:rgba(34,211,238,0.12);color:#22D3EE;}
.cat-captacao{background:rgba(251,191,36,0.12);color:#FBBF24;}
.cat-trafego{background:rgba(76,130,251,0.12);color:#4C82FB;}
.cat-reuniao{background:rgba(255,154,10,0.12);color:#FF9A0A;}
.cat-pesquisa{background:rgba(45,212,122,0.12);color:#2DD47A;}
.cat-copy{background:rgba(255,59,69,0.12);color:#FF3B45;}
.cat-dev{background:rgba(76,130,251,0.12);color:#4C82FB;}
.cat-geral{background:rgba(255,255,255,0.05);color:#50506A;}

.tc-tempo{font-size:11px;color:var(--ink3);font-weight:600;font-variant-numeric:tabular-nums;}
.tc-tempo.running{color:var(--green);}

.tc-ok{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;
  border:1px solid var(--b1);background:transparent;color:var(--ink3);
  font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;-webkit-tap-highlight-color:transparent;
}
.tc-ok:active{background:rgba(45,212,122,0.1);color:var(--green);}

/* Agenda strip */
.agenda-cards{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
.agenda-cards::-webkit-scrollbar{display:none;}
.ag-card{
  flex-shrink:0;background:var(--bg1);border:1px solid var(--b1);
  border-radius:13px;padding:10px 13px;min-width:140px;
}
.ag-hora{font-size:9.5px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
.ag-titulo{font-size:12.5px;font-weight:700;margin-bottom:2px;}
.ag-tipo{font-size:10.5px;color:var(--ink3);}

/* Estado vazio */
.empty{display:flex;flex-direction:column;align-items:center;padding:28px 16px;color:var(--ink3);font-size:13px;text-align:center;gap:8px;}
.empty-icon{font-size:28px;opacity:0.25;}

/* Chat */
#chat-fab{
  position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));right:16px;z-index:200;
  width:48px;height:48px;border-radius:50%;
  background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  cursor:pointer;transition:all 0.2s;box-shadow:0 4px 20px rgba(168,85,247,0.2);
  -webkit-tap-highlight-color:transparent;
}
#chat-fab:active{transform:scale(0.93);}
#chat-win{
  position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:12px;right:12px;
  z-index:199;background:rgba(11,11,20,0.97);border:1px solid var(--b2);
  border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.7);
  display:none;flex-direction:column;max-height:50dvh;
  backdrop-filter:blur(40px);
}
.cw-head{padding:11px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;}
.cw-titulo{font-size:12.5px;font-weight:700;color:var(--purple);display:flex;align-items:center;gap:6px;}
.cw-close{font-size:15px;color:var(--ink3);cursor:pointer;}
.cw-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;}
.cw-msg{max-width:86%;padding:8px 12px;border-radius:13px;font-size:12.5px;line-height:1.55;}
.cw-msg.user{background:var(--blue-g);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.cw-msg.ai{background:var(--bg3);color:var(--ink2);align-self:flex-start;border-bottom-left-radius:3px;}
.cw-input-row{padding:9px;border-top:1px solid var(--b1);display:flex;gap:6px;}
.cw-input{flex:1;background:var(--bg2);border:1px solid var(--b1);border-radius:11px;padding:9px 12px;color:var(--ink);font-family:var(--font);font-size:13.5px;outline:none;}
.cw-input::placeholder{color:var(--ink4);}
.cw-send{width:36px;height:36px;border-radius:10px;border:none;background:rgba(168,85,247,0.18);color:var(--purple);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Toasts */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{background:rgba(11,11,20,0.98);border:1px solid var(--b2);border-radius:22px;padding:9px 16px;font-size:12.5px;font-weight:600;backdrop-filter:blur(24px);box-shadow:0 4px 24px rgba(0,0,0,0.6);display:flex;align-items:center;gap:8px;white-space:nowrap;animation:tIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both,tOut 0.2s 2.7s ease both;}
.tdot{width:5px;height:5px;border-radius:50%;}
@keyframes tIn{from{opacity:0;transform:translateY(-10px) scale(0.88);}to{opacity:1;transform:none;}}
@keyframes tOut{to{opacity:0;transform:translateY(-8px);}}
::-webkit-scrollbar{width:0;height:0;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="toasts"></div>

<div class="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="t-logo">
      <div class="t-dot">5</div>
      <div class="t-info">
        <div class="t-nome">Studio</div>
        <div class="t-date" id="t-date"></div>
      </div>
    </div>
    <div class="t-right">
      <div class="t-pill" id="pill-semana">⏱ 0h esta semana</div>
    </div>
  </div>

  <!-- FAIXA DE CLIENTES -->
  <div class="clientes-strip">
    <div class="clientes-scroll" id="clientes-scroll">
      <div style="display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12px;padding:16px 0">Carregando…</div>
    </div>
  </div>

  <!-- DASHBOARD PRINCIPAL -->
  <div class="dashboard" id="dashboard">
    <!-- Estado inicial -->
    <div class="empty" id="dash-empty">
      <div class="empty-icon">↑</div>
      <p>Selecione um cliente acima para ver as tarefas do dia</p>
    </div>

    <!-- Conteúdo do cliente (hidden até selecionar) -->
    <div id="dash-content" style="display:none">

      <!-- Header do cliente -->
      <div class="dash-header">
        <div class="dash-cliente-info">
          <div class="dash-avatar" id="dash-avatar"></div>
          <div>
            <div class="dash-nome" id="dash-nome"></div>
            <div class="dash-empresa" id="dash-empresa"></div>
          </div>
        </div>
        <div class="dash-actions">
          <button class="dash-btn" onclick="abrirReport()">📡 Report</button>
        </div>
      </div>

      <!-- Stats da semana -->
      <div class="stats-row" id="stats-row"></div>

      <!-- Timer ativo -->
      <div class="timer-ativo" id="timer-ativo">
        <div class="ta-pulse"></div>
        <div class="ta-info">
          <div class="ta-titulo" id="ta-titulo"></div>
          <div class="ta-cat" id="ta-cat"></div>
        </div>
        <div class="ta-time" id="ta-time">00:00</div>
        <div class="ta-stop" onclick="pararTimer()">■</div>
      </div>

      <!-- Agenda do dia -->
      <div id="agenda-section"></div>

      <!-- Nova tarefa -->
      <div class="nova-tarefa">
        <input class="nt-input" id="nt-input"
          placeholder="Nova tarefa… ex: Editar vídeo produto X"
          onkeydown="if(event.key==='Enter')adicionarTarefa()">
        <select class="nt-cat" id="nt-cat">
          <option value="geral">📌</option>
          <option value="design">🎨</option>
          <option value="edicao">🎬</option>
          <option value="captacao">📸</option>
          <option value="trafego">📊</option>
          <option value="reuniao">📅</option>
          <option value="pesquisa">🔍</option>
          <option value="copy">✍️</option>
          <option value="dev">💻</option>
        </select>
        <button class="nt-add" onclick="adicionarTarefa()">+</button>
      </div>

      <!-- Lista de tarefas -->
      <div id="tarefas-lista"></div>

    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chat-fab" onclick="toggleChat()">✦</div>
<div id="chat-win">
  <div class="cw-head">
    <span class="cw-titulo"><span style="color:var(--purple)">✦</span> Assistente</span>
    <span class="cw-close" onclick="toggleChat()">✕</span>
  </div>
  <div class="cw-msgs" id="cw-msgs">
    <div class="cw-msg ai">Olá! Posso ajudar com tarefas, reports, análise de tempo ou qualquer dúvida sobre os clientes.</div>
  </div>
  <div class="cw-input-row">
    <input class="cw-input" id="cw-input" placeholder="Digite seu comando…" onkeydown="if(event.key==='Enter')enviarChat()">
    <button class="cw-send" onclick="enviarChat()">↑</button>
  </div>
</div>

  pesquisa:{l:'Pesquisa',e:'🔍'},copy:{l:'Copy',e:'✍️'},dev:{l:'Dev',e:'💻'}
};

const CORES=['#4C82FB','#A855F7','#2DD47A','#FF9A0A','#22D3EE','#FF3B45','#FBBF24','#F97316'];
const cor  = n=>{ let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))&0xFFFF; return CORES[h%CORES.length]; };
const ini  = n=>n?.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const fmtS = s=>{ s=Math.floor(s||0); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return h>0?`${h}h ${m.toString().padStart(2,'0')}m`:`${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`; };
const fmtL = s=>{ s=Math.floor(s||0); return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; };
const hoje = ()=>new Date().toISOString().split('T')[0];
const sb   = (p,o={})=>fetch(`${SB_URL}/rest/v1/${p}`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',...(o.headers||{})},...o}).then(r=>r.json());

// ESTADO
let clientes=[], clienteAtual=null, tarefas=[];
let timerInterval=null, timerTarefaId=null, timerInicio=null, timerSeg=0;
let chatAberto=false;

// ── INIT ──────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',async()=>{
  const d=new Date();
  document.getElementById('t-date').textContent=
    d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})
     .replace(/^\w/,c=>c.toUpperCase());

  // Restaura timer
  const saved=localStorage.getItem('timer5');
  if(saved){
    const t=JSON.parse(saved);
    timerTarefaId=t.tarefaId;
    timerInicio=new Date(t.inicio);
    timerSeg=(t.base||0)+Math.floor((Date.now()-timerInicio.getTime())/1000);
    iniciarInterval();
  }

  await carregarClientes();
  atualizarPillSemana();
});

// ── CLIENTES ──────────────────────────────────────────────────────
async function carregarClientes(){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/clientes?select=id,nome_completo,empresa,whatsapp&order=nome_completo`,
      {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    clientes=await r.json()||[];
    if(!Array.isArray(clientes)){
      console.error('Erro clientes:',clientes);
      clientes=[];
      toast('Erro ao carregar clientes','er');
    }
  }catch(e){
    console.error(e);
    toast('Erro de conexão com Supabase','er');
    clientes=[];
  }
  renderClienteStrip();
}

function renderClienteStrip(){
  const strip=document.getElementById('clientes-scroll');
  const saved=JSON.parse(localStorage.getItem('timer5')||'{}');

  strip.innerHTML=clientes.map(c=>{
    const c_cor=cor(c.nome_completo);
    const isTimer=saved.clienteId===c.id;
    const isSelected=clienteAtual?.id===c.id;
    const avatar=ini(c.nome_completo);
    return `
      <div class="c-card ${isSelected?'selected':''}" id="ccard-${c.id}" onclick="selecionarCliente('${c.id}')">
        <div class="c-avatar" style="background:${c.logo_url?'var(--bg2)':c_cor+'22'};color:${c_cor};border-color:${isSelected?'#fff':c_cor+'33'}">
          ${avatar}
          <div class="c-timer-dot ${isTimer?'show':''}" id="dot-${c.id}"></div>
        </div>
        <div class="c-nome">${c.nome_completo.split(' ')[0]}</div>
      </div>`;
  }).join('') + `
    <div class="c-add" onclick="adicionarEventual()">
      <div class="c-add-circle">+</div>
      <div class="c-add-label">Eventual</div>
    </div>`;
}

async function selecionarCliente(clienteId){
  // Atualiza seleção visual
  document.querySelectorAll('.c-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('ccard-'+clienteId)?.classList.add('selected');

  clienteAtual=clientes.find(c=>c.id===clienteId);
  if(!clienteAtual)return;

  const c_cor=cor(clienteAtual.nome_completo);

  // Header
  document.getElementById('dash-avatar').style.cssText=`background:${c_cor}22;color:${c_cor};border:2px solid ${c_cor}33`;
  document.getElementById('dash-avatar').textContent=ini(clienteAtual.nome_completo);
  document.getElementById('dash-nome').textContent=clienteAtual.nome_completo;
  document.getElementById('dash-empresa').textContent=clienteAtual.empresa||'';

  // Mostra conteúdo
  document.getElementById('dash-empty').style.display='none';
  document.getElementById('dash-content').style.display='block';

  // Scroll ao topo
  document.getElementById('dashboard').scrollTop=0;

  await Promise.all([carregarTarefas(), carregarStats(), carregarAgendaCliente()]);
  atualizarTimerDisplay();
}

// ── STATS ─────────────────────────────────────────────────────────
async function carregarStats(){
  const d=new Date(); d.setDate(d.getDate()-d.getDay());
  const semana=d.toISOString().split('T')[0];
  const sessoes=await sb(`tempo_sessoes?select=duracao,categoria&cliente_id=eq.${clienteAtual.id}&created_at=gte.${semana}T00:00:00`)||[];
  const total=sessoes.reduce((a,s)=>a+(s.duracao||0),0);
  const conc=tarefas.filter(t=>t.status==='concluida').length;
  const pend=tarefas.filter(t=>t.status!=='concluida').length;

  const catMap={};
  sessoes.forEach(s=>{catMap[s.categoria]=(catMap[s.categoria]||0)+(s.duracao||0);});
  const top=Object.entries(catMap).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card">
      <div class="stat-val" style="color:var(--blue)">${fmtS(total)}</div>
      <div class="stat-lbl">Esta semana</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--green)">${conc}</div>
      <div class="stat-lbl">Concluídas</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--orange)">${pend}</div>
      <div class="stat-lbl">Pendentes</div>
    </div>`;
}

async function atualizarPillSemana(){
  const d=new Date(); d.setDate(d.getDate()-d.getDay());
  const semana=d.toISOString().split('T')[0];
  const sessoes=await sb(`tempo_sessoes?select=duracao&created_at=gte.${semana}T00:00:00`)||[];
  const total=sessoes.reduce((a,s)=>a+(s.duracao||0),0);
  const h=Math.floor(total/3600), m=Math.floor((total%3600)/60);
  document.getElementById('pill-semana').textContent=`⏱ ${h}h${m>0?' '+m+'m':''} esta semana`;
}

// ── AGENDA ────────────────────────────────────────────────────────
async function carregarAgendaCliente(){
  const eventos=await sb(`agenda?select=id,titulo,tipo,hora,meet_link&data=eq.${hoje()}&order=hora`)||[];
  const sec=document.getElementById('agenda-section');
  if(!eventos.length){sec.innerHTML='';return;}
  sec.innerHTML=`
    <div class="tarefas-header"><span class="tarefas-lbl">Compromissos hoje</span></div>
    <div class="agenda-cards">
      ${eventos.map(e=>`
        <div class="ag-card" ${e.meet_link?`onclick="window.open('${e.meet_link}','_blank')"`:''} style="cursor:${e.meet_link?'pointer':'default'}">
          <div class="ag-hora">${e.hora?e.hora.slice(0,5):''}</div>
          <div class="ag-titulo">${e.titulo}</div>
          <div class="ag-tipo">${e.tipo||''}${e.meet_link?' · Meet':''}</div>
        </div>`).join('')}
    </div>`;
}

// ── TAREFAS ───────────────────────────────────────────────────────
async function carregarTarefas(){
  tarefas=await sb(`tarefas?select=*&cliente_id=eq.${clienteAtual.id}&order=created_at.desc`)||[];
  renderTarefas();
}

function renderTarefas(){
  const pend=tarefas.filter(t=>t.status!=='concluida');
  const conc=tarefas.filter(t=>t.status==='concluida').slice(0,4);
  const lista=document.getElementById('tarefas-lista');

  let html='';
  if(pend.length){
    html+=`<div class="tarefas-header"><span class="tarefas-lbl">Tarefas</span><span class="tarefas-count">${pend.length}</span></div>`;
    html+=pend.map(t=>tarefaHTML(t)).join('');
  } else {
    html+=`<div class="empty"><div class="empty-icon">◫</div><p>Nenhuma tarefa. Adicione acima!</p></div>`;
  }
  if(conc.length){
    html+=`<div class="tarefas-header" style="margin-top:10px"><span class="tarefas-lbl">Concluídas</span><span class="tarefas-count">${conc.length}</span></div>`;
    html+=conc.map(t=>tarefaHTML(t)).join('');
  }
  lista.innerHTML=html;
}

function tarefaHTML(t){
  const running=timerTarefaId===t.id;
  const conc=t.status==='concluida';
  const catInfo=CAT[t.categoria]||CAT.geral;
  const tempo=running?`<span class="tc-tempo running" id="ttempo-${t.id}">${fmtL(timerSeg)}</span>`:
              t.tempo_total>0?`<span class="tc-tempo">${fmtS(t.tempo_total)}</span>`:'';

  return `
    <div class="tarefa-card ${running?'running':''} ${conc?'concluida':''}" id="tc-${t.id}">
      <div class="tc-btn play ${running?'running':''} ${conc?'done':''}"
        onclick="${conc?'':running?`pararTimer()`:`iniciarTimer('${t.id}')`}">
        ${conc?'✓':running?'■':'▶'}
      </div>
      <div class="tc-info">
        <div class="tc-titulo">${t.titulo}</div>
        <div class="tc-row">
          <span class="tc-badge cat-${t.categoria}">${catInfo.e} ${catInfo.l}</span>
          ${tempo}
        </div>
      </div>
      ${!conc?`<div class="tc-ok" onclick="concluirTarefa('${t.id}')">✓</div>`:''}
    </div>`;
}

// ── ADICIONAR TAREFA ──────────────────────────────────────────────
async function adicionarTarefa(){
  const titulo=document.getElementById('nt-input').value.trim();
  const cat=document.getElementById('nt-cat').value;
  if(!titulo||!clienteAtual)return;
  document.getElementById('nt-input').value='';

  const res=await fetch(`${SB_URL}/rest/v1/tarefas`,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({cliente_id:clienteAtual.id,titulo,categoria:cat,status:'pendente',tempo_total:0,created_at:new Date().toISOString()})
  }).then(r=>r.json());

  if(res?.[0]){
    tarefas.unshift(res[0]);
    renderTarefas();
    toast(`Tarefa adicionada!`);
  }
}

// ── TIMER ─────────────────────────────────────────────────────────
async function iniciarTimer(tarefaId){
  if(timerTarefaId&&timerTarefaId!==tarefaId) await pararTimer();
  const t=tarefas.find(x=>x.id===tarefaId);
  if(!t)return;

  timerTarefaId=tarefaId;
  timerInicio=new Date();
  timerSeg=t.tempo_total||0;

  const sessao=await fetch(`${SB_URL}/rest/v1/tempo_sessoes`,{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},
    body:JSON.stringify({tarefa_id:tarefaId,cliente_id:clienteAtual?.id,inicio:timerInicio.toISOString(),categoria:t.categoria})
  }).then(r=>r.json());

  localStorage.setItem('timer5',JSON.stringify({
    tarefaId,sessaoId:sessao?.[0]?.id,
    clienteId:clienteAtual?.id,
    tarefaTitulo:t.titulo,categoria:t.categoria,
    inicio:timerInicio.toISOString(),base:t.tempo_total||0
  }));

  await fetch(`${SB_URL}/rest/v1/tarefas?id=eq.${tarefaId}`,{
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({status:'em_andamento'})
  });

  const idx=tarefas.findIndex(x=>x.id===tarefaId);
  if(idx>=0) tarefas[idx].status='em_andamento';

  iniciarInterval();
  atualizarTimerDisplay();
  renderTarefas();
  document.getElementById('dot-'+clienteAtual?.id)?.classList.add('show');
  toast(`▶ ${CAT[t.categoria]?.e||'📌'} ${t.titulo}`);
}

async function pararTimer(){
  if(!timerTarefaId)return;
  clearInterval(timerInterval); timerInterval=null;

  const saved=JSON.parse(localStorage.getItem('timer5')||'{}');
  const duracao=Math.floor((Date.now()-new Date(saved.inicio).getTime())/1000);
  const totalNovo=(saved.base||0)+duracao;

  if(saved.sessaoId) await fetch(`${SB_URL}/rest/v1/tempo_sessoes?id=eq.${saved.sessaoId}`,{
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({fim:new Date().toISOString(),duracao})
  });

  await fetch(`${SB_URL}/rest/v1/tarefas?id=eq.${timerTarefaId}`,{
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({tempo_total:totalNovo})
  });

  const idx=tarefas.findIndex(x=>x.id===timerTarefaId);
  if(idx>=0) tarefas[idx].tempo_total=totalNovo;

  localStorage.removeItem('timer5');
  document.querySelectorAll('.c-timer-dot').forEach(d=>d.classList.remove('show'));
  timerTarefaId=null; timerInicio=null; timerSeg=0;

  document.getElementById('timer-ativo').classList.remove('show');
  renderTarefas();
  await carregarStats();
  await atualizarPillSemana();
  toast(`■ ${fmtS(duracao)} registrados`);
}

function iniciarInterval(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timerSeg++;
    document.getElementById('ta-time').textContent=fmtL(timerSeg);
    const el=document.getElementById('ttempo-'+timerTarefaId);
    if(el) el.textContent=fmtL(timerSeg);
  },1000);
}

function atualizarTimerDisplay(){
  const saved=JSON.parse(localStorage.getItem('timer5')||'{}');
  const div=document.getElementById('timer-ativo');
  if(timerTarefaId&&saved.tarefaTitulo){
    document.getElementById('ta-titulo').textContent=saved.tarefaTitulo;
    document.getElementById('ta-cat').textContent=(CAT[saved.categoria]?.e||'📌')+' '+(CAT[saved.categoria]?.l||'Geral');
    document.getElementById('ta-time').textContent=fmtL(timerSeg);
    div.classList.add('show');
  } else {
    div.classList.remove('show');
  }
}

// ── CONCLUIR ──────────────────────────────────────────────────────
async function concluirTarefa(tarefaId){
  if(timerTarefaId===tarefaId) await pararTimer();
  await fetch(`${SB_URL}/rest/v1/tarefas?id=eq.${tarefaId}`,{
    method:'PATCH',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({status:'concluida',concluida_em:new Date().toISOString()})
  });
  const idx=tarefas.findIndex(t=>t.id===tarefaId);
  if(idx>=0){tarefas[idx].status='concluida';}
  renderTarefas();
  await carregarStats();
  toast('✅ Concluída!');
}

// ── EVENTUAL ──────────────────────────────────────────────────────
function adicionarEventual(){
  const nome=prompt('Nome do cliente ou projeto eventual:');
  if(!nome)return;
  const temp={id:'temp-'+Date.now(),nome_completo:nome,empresa:'Eventual',whatsapp:'',logo_url:''};
  clientes.unshift(temp);
  renderClienteStrip();
  selecionarCliente(temp.id);
}

// ── REPORT ────────────────────────────────────────────────────────
function abrirReport(){
  window.open('workflow-5essencia.html','_blank');
}

// ── CHAT ──────────────────────────────────────────────────────────
function toggleChat(){
  chatAberto=!chatAberto;
  document.getElementById('chat-win').style.display=chatAberto?'flex':'none';
  if(chatAberto) document.getElementById('cw-input').focus();
}

async function enviarChat(){
  const input=document.getElementById('cw-input');
  const msg=input.value.trim();
  if(!msg)return;
  input.value='';

  const msgs=document.getElementById('cw-msgs');
  msgs.innerHTML+=`<div class="cw-msg user">${msg}</div><div class="cw-msg ai" id="cw-typing">···</div>`;
  msgs.scrollTop=msgs.scrollHeight;

  let ctx=`Você é o assistente pessoal de Patrick, CEO da 5essência Marketing (agência premium em Balneário Camboriú). Ajude com organização de tarefas, análise de tempo e gestão de clientes. Seja direto e prático. Responda em português.`;
  if(clienteAtual){
    ctx+=` Cliente selecionado: ${clienteAtual.nome_completo}. Tarefas pendentes: ${tarefas.filter(t=>t.status!=='concluida').length}. Concluídas hoje: ${tarefas.filter(t=>t.status==='concluida').length}.`;
  }

  try{
    const r=await fetch(`${SB_URL}/functions/v1/chat-assistant`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      body:JSON.stringify({system:ctx,messages:[{role:'user',content:msg}]})
    });
    const d=await r.json();
    document.getElementById('cw-typing').textContent=d.resposta||'Não consegui processar.';
  }catch(e){
    document.getElementById('cw-typing').textContent='Erro de conexão.';
  }
  msgs.scrollTop=msgs.scrollHeight;
}

// ── TOAST ─────────────────────────────────────────────────────────
function toast(msg,tipo='ok'){
  const wrap=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast';
  const c=tipo==='er'?'#FF3B45':'#2DD47A';
  el.innerHTML=`<div class="tdot" style="background:${c};box-shadow:0 0 8px ${c}"></div>${msg}`;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
</script>
