<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quintessência · Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

/* ── TOKENS ── */
:root {
  --bg:       #F7F6F3;
  --surface:  #FFFFFF;
  --surface2: #F2F1EE;
  --surface3: #ECEAE6;
  --border:   #E4E2DD;
  --border2:  #D4D2CB;

  --ink:      #18181B;
  --ink2:     #52525B;
  --ink3:     #A1A1AA;
  --ink4:     #D4D4D8;

  --accent:   #1C4ED8;
  --accent-l: #EEF2FF;
  --accent-m: #C7D2FE;

  --green:    #16A34A;
  --green-l:  #DCFCE7;
  --orange:   #D97706;
  --orange-l: #FEF3C7;
  --red:      #DC2626;
  --red-l:    #FEE2E2;
  --purple:   #7C3AED;
  --purple-l: #EDE9FE;

  --r:  8px;
  --r2: 12px;
  --r3: 16px;
  --font: 'Inter', -apple-system, sans-serif;
  --sh: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --sh2: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; font-size: 13px; }

/* ── LAYOUT ── */
.app { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: 1fr auto; height: 100dvh; }

/* ── SIDEBAR ── */
.sidebar {
  grid-row: 1 / 3;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 2px;
  z-index: 20;
}
.sb-logo {
  width: 32px; height: 32px; border-radius: var(--r);
  background: var(--ink); display: flex; align-items: center;
  justify-content: center; margin-bottom: 14px; flex-shrink: 0;
}
.sb-logo svg { color: white; }
.sb-btn {
  width: 36px; height: 36px; border-radius: var(--r);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink3); transition: all 0.12s;
  position: relative; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.sb-btn:hover { background: var(--surface2); color: var(--ink2); }
.sb-btn.active { background: var(--accent-l); color: var(--accent); }
.sb-btn .badge {
  position: absolute; top: 4px; right: 4px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red); border: 1.5px solid var(--surface);
}
.sb-divider { width: 24px; height: 1px; background: var(--border); margin: 6px 0; }
.sb-bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.sb-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--ink); color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; cursor: pointer;
}

/* ── MAIN ── */
.main {
  overflow: hidden; display: flex; flex-direction: column;
  background: var(--bg);
}

/* ── TOPBAR ── */
.topbar {
  height: 48px; flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 18px; gap: 16px;
  position: relative; z-index: 10;
}
.tb-section { font-size: 13px; font-weight: 600; color: var(--ink); }
.tb-sep { width: 1px; height: 14px; background: var(--border); }
.tb-date { font-size: 12px; color: var(--ink3); font-weight: 400; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-weather {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink2); font-weight: 500;
  padding: 4px 10px; border-radius: 20px;
  background: var(--surface2); border: 1px solid var(--border);
}
.tb-btn {
  width: 28px; height: 28px; border-radius: var(--r);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink3); transition: all 0.12s;
  border: 1px solid transparent;
}
.tb-btn:hover { background: var(--surface2); color: var(--ink2); }
.timer-pill {
  display: none; align-items: center; gap: 7px;
  padding: 5px 12px 5px 9px; border-radius: 20px;
  background: var(--green-l); border: 1px solid #BBF7D0;
  font-size: 12px; font-weight: 600; color: var(--green);
  cursor: pointer; transition: all 0.15s;
}
.timer-pill.on { display: flex; }
.timer-pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1.5s ease infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.timer-pill-stop {
  width: 20px; height: 20px; border-radius: 4px;
  background: var(--red); display: flex; align-items: center;
  justify-content: center; margin-left: 4px; flex-shrink: 0;
}

/* ── CONTENT ── */
.content {
  flex: 1; overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 0;
}

.col-main { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.col-side { overflow-y: auto; border-left: 1px solid var(--border); background: var(--surface); }

/* ── CARD ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r3); overflow: hidden;
  box-shadow: var(--sh);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px 11px;
  border-bottom: 1px solid var(--border);
}
.card-title { font-size: 12px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.05em; }
.card-action { font-size: 12px; font-weight: 500; color: var(--accent); cursor: pointer; }
.card-body { padding: 12px 16px; }

/* ── PRIORITIES ── */
.priority-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: all 0.1s;
}
.priority-item:last-child { border-bottom: none; }
.priority-item:hover { opacity: 0.8; }
.pi-check {
  width: 16px; height: 16px; border-radius: 4px;
  border: 1.5px solid var(--border2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; cursor: pointer;
}
.pi-check.done { background: var(--green); border-color: var(--green); }
.pi-check svg { display: none; }
.pi-check.done svg { display: block; color: white; }
.pi-info { flex: 1; min-width: 0; }
.pi-titulo { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pi-titulo.done { text-decoration: line-through; color: var(--ink3); }
.pi-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.pi-client { font-size: 11px; color: var(--ink3); }
.pi-cat { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
.pi-timer-btn {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink3); transition: all 0.12s; flex-shrink: 0;
}
.pi-timer-btn:hover { background: var(--green-l); border-color: #BBF7D0; color: var(--green); }
.pi-timer-btn.running { background: var(--red-l); border-color: #FECACA; color: var(--red); }
.pi-tempo { font-size: 11px; font-weight: 600; color: var(--ink3); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
.pi-tempo.running { color: var(--green); }

/* Add task */
.add-task {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 0; border-top: 1px solid var(--border); margin-top: 4px;
}
.at-input {
  flex: 1; border: none; outline: none; font-family: var(--font);
  font-size: 13px; color: var(--ink); background: transparent;
}
.at-input::placeholder { color: var(--ink4); }
.at-cat {
  border: 1px solid var(--border); border-radius: 6px;
  font-family: var(--font); font-size: 12px; color: var(--ink2);
  padding: 4px 6px; outline: none; -webkit-appearance: none;
  background: var(--surface); cursor: pointer;
}
.at-add {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--ink2); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.12s;
}
.at-add:hover { background: var(--accent); border-color: var(--accent); color: white; }

/* ── AGENDA ── */
.agenda-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.agenda-item:last-child { border-bottom: none; }
.ag-time { font-size: 11px; font-weight: 600; color: var(--ink3); min-width: 38px; margin-top: 1px; }
.ag-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.ag-info { flex: 1; min-width: 0; }
.ag-titulo { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.ag-meta { font-size: 11px; color: var(--ink3); }

/* ── CLIENTS SIDE ── */
.side-section { padding: 14px 16px; }
.side-title { font-size: 11px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.client-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r); cursor: pointer;
  transition: all 0.1s; -webkit-tap-highlight-color: transparent;
  margin-bottom: 2px;
}
.client-row:hover { background: var(--surface2); }
.client-row.active { background: var(--accent-l); }
.cr-av {
  width: 28px; height: 28px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: white; flex-shrink: 0;
}
.cr-info { flex: 1; min-width: 0; }
.cr-nome { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-meta { font-size: 11px; color: var(--ink3); }
.cr-timer { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; animation: blink 1.5s ease infinite; display: none; }
.cr-timer.on { display: block; }
.cr-open { color: var(--ink4); flex-shrink: 0; opacity: 0; transition: opacity 0.1s; }
.client-row:hover .cr-open { opacity: 1; }

/* ── CHAT BAR ── */
.chatbar {
  grid-column: 2;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 18px 10px 70px;
  display: flex; align-items: center; gap: 10px;
  position: relative; z-index: 10;
}
.chat-icon {
  position: absolute; left: 68px;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink3); pointer-events: none;
}
.chatbar input {
  flex: 1; border: none; outline: none; font-family: var(--font);
  font-size: 13px; color: var(--ink); background: transparent;
  padding-left: 24px;
}
.chatbar input::placeholder { color: var(--ink4); }
.chat-result {
  font-size: 12px; color: var(--ink2);
  padding: 4px 10px; border-radius: 20px;
  background: var(--surface2); border: 1px solid var(--border);
  display: none; max-width: 400px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.chat-result.show { display: block; }
.chat-send {
  width: 28px; height: 28px; border-radius: 6px; border: none;
  background: var(--accent); color: white;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; transition: all 0.12s;
}
.chat-send:hover { opacity: 0.88; }
.chat-actions { display: flex; align-items: center; gap: 6px; margin-right: 6px; }
.chat-chip {
  font-size: 11px; font-weight: 500; color: var(--ink3);
  padding: 3px 9px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface2);
  cursor: pointer; white-space: nowrap; transition: all 0.1s;
}
.chat-chip:hover { border-color: var(--accent-m); color: var(--accent); background: var(--accent-l); }

/* ── CLIENTE PANEL (slide-in) ── */
.client-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 420px;
  background: var(--surface); border-left: 1px solid var(--border);
  box-shadow: var(--sh2); z-index: 100;
  transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.client-panel.open { transform: translateX(0); }
.cp-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
.cp-av { width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: white; flex-shrink: 0; }
.cp-info { flex: 1; min-width: 0; }
.cp-nome { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 2px; }
.cp-empresa { font-size: 12px; color: var(--ink3); }
.cp-close { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink3); transition: all 0.1s; }
.cp-close:hover { background: var(--surface2); }

.cp-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.cp-tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.1s; }
.cp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.cp-body { flex: 1; overflow-y: auto; }
.cp-section { padding: 14px 20px; border-bottom: 1px solid var(--border); }
.cp-section-title { font-size: 11px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.cp-add-btn { font-size: 11px; font-weight: 500; color: var(--accent); cursor: pointer; }

.service-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.service-item:last-child { border-bottom: none; }
.si-status { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.si-info { flex: 1; min-width: 0; }
.si-titulo { font-size: 13px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.si-prazo { font-size: 11px; color: var(--ink3); }
.si-add { font-size: 11px; font-weight: 600; color: var(--accent); cursor: pointer; padding: 3px 8px; border-radius: 4px; background: var(--accent-l); white-space: nowrap; }
.si-add:hover { background: var(--accent-m); }

.cp-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.cp-stat { background: var(--surface2); border-radius: var(--r); padding: 10px; }
.cp-stat-v { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 2px; }
.cp-stat-l { font-size: 10px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.05em; }

/* Actions no cp */
.cp-actions { display: flex; gap: 8px; padding: 14px 20px; }
.cp-action { flex: 1; padding: 8px; border-radius: var(--r); border: 1px solid var(--border); background: transparent; font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--ink2); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.1s; }
.cp-action:hover { background: var(--surface2); }
.cp-action.primary { background: var(--accent); color: white; border-color: var(--accent); }
.cp-action.primary:hover { opacity: 0.9; }

/* ── STATUS BADGES ── */
.badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 10.5px; font-weight: 600; }
.badge-green { background: var(--green-l); color: var(--green); }
.badge-blue { background: var(--accent-l); color: var(--accent); }
.badge-orange { background: var(--orange-l); color: var(--orange); }
.badge-red { background: var(--red-l); color: var(--red); }
.badge-gray { background: var(--surface3); color: var(--ink3); }

/* ── CAT BADGES ── */
.cat-design { background: #F3E8FF; color: #7C3AED; }
.cat-edicao { background: #E0F2FE; color: #0369A1; }
.cat-captacao { background: #FEF9C3; color: #854D0E; }
.cat-trafego { background: #EEF2FF; color: #3730A3; }
.cat-reuniao { background: #FFF7ED; color: #C2410C; }
.cat-pesquisa { background: #DCFCE7; color: #15803D; }
.cat-copy { background: #FFE4E6; color: #BE123C; }
.cat-dev { background: #F0F9FF; color: #0C4A6E; }
.cat-geral { background: var(--surface3); color: var(--ink3); }

/* ── EMPTY ── */
.empty-msg { text-align: center; padding: 24px 16px; color: var(--ink3); font-size: 12.5px; }

/* ── OVERLAY ── */
.overlay-bg { position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,0.15); backdrop-filter: blur(2px); display: none; }
.overlay-bg.show { display: block; }

/* ── SCROLLBARS ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── TOASTS ── */
#toasts { position: fixed; bottom: 56px; left: 72px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { background: var(--ink); color: white; border-radius: var(--r2); padding: 9px 14px; font-size: 12.5px; font-weight: 500; box-shadow: var(--sh2); animation: tIn 0.2s ease both, tOut 0.2s 2.5s ease both; display: flex; align-items: center; gap: 8px; }
.toast.ok::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.toast.er::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
@keyframes tIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
@keyframes tOut { to { opacity:0; transform:translateY(-4px); } }

/* ── MODAL ── */
.modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r3); width: 400px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.15); overflow: hidden; }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 14px; font-weight: 700; }
.modal-x { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink3); }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fg label { font-size: 11px; font-weight: 600; color: var(--ink3); letter-spacing: 0.03em; }
.fg input, .fg select, .fg textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); color: var(--ink); font-family: var(--font); font-size: 13px; padding: 8px 11px; outline: none; transition: all 0.12s; width: 100%; -webkit-appearance: none; }
.fg input:focus, .fg select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(28,78,216,0.1); }
.fg input::placeholder { color: var(--ink4); }
.fg select option { background: white; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: var(--r); border: 1px solid var(--border); cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 600; transition: all 0.12s; background: var(--surface2); color: var(--ink2); }
.btn:hover { background: var(--surface3); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { opacity: 0.9; }
</style>
</head>
<body>
<div id="toasts"></div>
<div class="overlay-bg" id="overlay-bg" onclick="fecharClientePanel()"></div>

<!-- MODAL NOVO SERVIÇO -->
<div class="modal-overlay" id="modal-servico">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Novo serviço</span>
      <button class="modal-x" onclick="fecharModal('modal-servico')">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg"><label>Serviço / entregável</label><input id="ms-titulo" placeholder="Ex: Landing Page, Gestão Meta Ads…"></div>
      <div class="row2">
        <div class="fg"><label>Prazo</label><input id="ms-prazo" type="date"></div>
        <div class="fg"><label>Status</label>
          <select id="ms-status">
            <option value="briefing">Briefing</option>
            <option value="em_andamento">Em andamento</option>

<script>
const SB  = 'https://zebudefzhakitwjswvkl.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplYnVkZWZ6aGFraXR3anN3dmtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MTE1MDksImV4cCI6MjA5MTQ4NzUwOX0.uKRcENdJFNirbC84qG7uIkkDFbn4McQ4DGxh3CKAyPM';
const CAT = {geral:'Geral',design:'Design',edicao:'Edição',captacao:'Captação',trafego:'Tráfego',reuniao:'Reunião',pesquisa:'Pesquisa',copy:'Copy',dev:'Dev'};
const CORES = ['#1C4ED8','#7C3AED','#16A34A','#D97706','#0891B2','#DC2626','#CA8A04','#EA580C'];
const cor = n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))&0xFFFF;return CORES[h%CORES.length];};
const ini = n=>n?.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const fmtS= s=>{s=Math.floor(s||0);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?`${h}h${m>0?' '+m+'m':''}`:`${m.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;};
const fmtL= s=>{s=Math.floor(s||0);return`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};
const hoje= ()=>new Date().toISOString().split('T')[0];
const semI= ()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().split('T')[0];};
const api = (p,o={})=>fetch(`${SB}/rest/v1/${p}`,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json',...(o.headers||{})},...o}).then(r=>r.json()).catch(()=>null);

let clientes=[], tasks=[], clienteAtual=null, cpTabAtiva='escopo';
let cpServicos=[], cpTarefas=[];
let timerInterval=null, timerTarefaId=null, timerInicio=null, timerSeg=0;

// ── INIT ──────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async()=>{
  const d = new Date();
  document.getElementById('tb-date').textContent =
    d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).replace(/^\w/,c=>c.toUpperCase());

  // Timer restaurado
  const sv = localStorage.getItem('timer5');
  if(sv){ const t=JSON.parse(sv); timerTarefaId=t.tarefaId; timerInicio=new Date(t.inicio); timerSeg=(t.base||0)+Math.floor((Date.now()-timerInicio.getTime())/1000); iniciarInterval(); atualizarTimerPill(t); }

  carregarClima();
  await carregarClientes();
  await Promise.all([carregarAgenda(), carregarTasks()]);
});

// ── CLIMA ─────────────────────────────────────────────────────────
async function carregarClima(){
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-26.99&longitude=-48.63&current_weather=true&temperature_unit=celsius');
    const d = await r.json();
    const t = d?.current_weather?.temperature;
    if(t!==undefined) document.getElementById('weather-txt').textContent = `${Math.round(t)}°C — Balneário Camboriú`;
  }catch(e){ document.getElementById('weather-txt').textContent = 'Balneário Camboriú'; }
}

// ── CLIENTES ──────────────────────────────────────────────────────
async function carregarClientes(){
  const d = await api('clientes?select=id,nome_completo,empresa,whatsapp&order=nome_completo');
  clientes = Array.isArray(d) ? d : [];
  renderClientes();
}

function renderClientes(){
  const saved = JSON.parse(localStorage.getItem('timer5')||'{}');
  document.getElementById('clients-list').innerHTML = clientes.map(c=>{
    const c_cor = cor(c.nome_completo);
    const hasTimer = saved.clienteId === c.id;
    return`<div class="client-row" id="cr-${c.id}" onclick="abrirCliente('${c.id}')">
      <div class="cr-av" style="background:${c_cor}">${ini(c.nome_completo)}</div>
      <div class="cr-info">
        <div class="cr-nome">${c.nome_completo}</div>
        <div class="cr-meta">${c.empresa||'—'}</div>
      </div>
      <div class="cr-timer ${hasTimer?'on':''}" id="crt-${c.id}"></div>
      <div class="cr-open">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>
    </div>`;
  }).join('');
}

// ── AGENDA ────────────────────────────────────────────────────────
async function carregarAgenda(){
  const d = await api(`agenda?select=id,titulo,tipo,hora,meet_link&data=eq.${hoje()}&order=hora`)||[];
  const body = document.getElementById('agenda-body');
  const cores = {captacao:'var(--accent)',entrega:'var(--green)',reuniao:'var(--purple)',outro:'var(--ink3)'};
  if(!d.length){ body.innerHTML='<div class="empty-msg">Nenhum compromisso para hoje</div>'; return; }
  body.innerHTML = d.map(e=>`
    <div class="agenda-item" ${e.meet_link?`style="cursor:pointer" onclick="window.open('${e.meet_link}','_blank')"`:''}>
      <span class="ag-time">${e.hora?e.hora.slice(0,5):'—'}</span>
      <div class="ag-dot" style="background:${cores[e.tipo]||cores.outro}"></div>
      <div class="ag-info">
        <div class="ag-titulo">${e.titulo}</div>
        <div class="ag-meta">${e.tipo||''}${e.meet_link?' · Meet':''}</div>
      </div>
    </div>`).join('');
}

// ── TASKS ─────────────────────────────────────────────────────────
async function carregarTasks(){
  const d = await api(`tarefas?select=*,clientes(nome_completo)&status=neq.concluida&order=created_at.desc`)||[];
  tasks = Array.isArray(d) ? d : [];
  renderTasks();
}

function renderTasks(){
  const lista = document.getElementById('tasks-list');
  if(!tasks.length){ lista.innerHTML='<div class="empty-msg">Nenhuma tarefa ainda. Adicione abaixo.</div>'; return; }
  lista.innerHTML = tasks.map(t => taskHTML(t)).join('');
}

function taskHTML(t){
  const running = timerTarefaId === t.id;
  const done = t.status === 'concluida';
  const catLabel = CAT[t.categoria]||'Geral';
  const clienteNome = t.clientes?.nome_completo?.split(' ')[0]||'';
  const tempo = running
    ? `<span class="pi-tempo running" id="pit-${t.id}">${fmtL(timerSeg)}</span>`
    : t.tempo_total > 0 ? `<span class="pi-tempo">${fmtS(t.tempo_total)}</span>` : '';

  return `<div class="priority-item" id="pi-${t.id}">
    <div class="pi-check ${done?'done':''}" onclick="concluirTask('${t.id}')">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="pi-info">
      <div class="pi-titulo ${done?'done':''}">${t.titulo}</div>
      <div class="pi-meta">
        ${clienteNome?`<span class="pi-client">${clienteNome}</span>`:''}
        <span class="pi-cat cat-${t.categoria}">${catLabel}</span>
      </div>
    </div>
    ${tempo}
    <div class="pi-timer-btn ${running?'running':''}" onclick="${running?'pararTimer()':'iniciarTimer(\''+t.id+'\')'}">
      ${running
        ? `<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18"/></svg>`
        : `<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>`
      }
    </div>
  </div>`;
}

async function addTask(){
  const titulo = document.getElementById('at-input').value.trim();
  const cat = document.getElementById('at-cat').value;
  if(!titulo) return;
  document.getElementById('at-input').value = '';
  const res = await fetch(`${SB}/rest/v1/tarefas`,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({titulo,categoria:cat,status:'pendente',tempo_total:0,created_at:new Date().toISOString()})}).then(r=>r.json());
  if(res?.[0]){ tasks.unshift({...res[0],clientes:null}); renderTasks(); toast('Tarefa adicionada'); }
}

async function concluirTask(id){
  if(timerTarefaId===id) await pararTimer();
  await fetch(`${SB}/rest/v1/tarefas?id=eq.${id}`,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({status:'concluida',concluida_em:new Date().toISOString()})});
  tasks = tasks.filter(t=>t.id!==id);
  renderTasks();
}

// ── TIMER ─────────────────────────────────────────────────────────
async function iniciarTimer(id){
  if(timerTarefaId&&timerTarefaId!==id) await pararTimer();
  const t = tasks.find(x=>x.id===id)||cpTarefas.find(x=>x.id===id);
  if(!t) return;
  timerTarefaId=id; timerInicio=new Date(); timerSeg=t.tempo_total||0;
  const cli = clienteAtual||clientes.find(c=>c.id===t.cliente_id);
  const sessao = await fetch(`${SB}/rest/v1/tempo_sessoes`,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({tarefa_id:id,cliente_id:t.cliente_id||null,inicio:timerInicio.toISOString(),categoria:t.categoria})}).then(r=>r.json());
  const sv = {tarefaId:id,sessaoId:sessao?.[0]?.id,clienteId:t.cliente_id,clienteNome:cli?.nome_completo?.split(' ')[0]||'',tarefaTitulo:t.titulo,inicio:timerInicio.toISOString(),base:t.tempo_total||0};
  localStorage.setItem('timer5',JSON.stringify(sv));
  await fetch(`${SB}/rest/v1/tarefas?id=eq.${id}`,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({status:'em_andamento'})});
  [tasks,cpTarefas].forEach(arr=>{const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i].status='em_andamento';});
  iniciarInterval(); atualizarTimerPill(sv); renderTasks();
  if(t.cliente_id){ document.getElementById('crt-'+t.cliente_id)?.classList.add('on'); renderClientes(); }
  toast(`Cronômetro iniciado — ${t.titulo}`,'ok');
}

async function pararTimer(){
  if(!timerTarefaId) return;
  clearInterval(timerInterval); timerInterval=null;
  const sv = JSON.parse(localStorage.getItem('timer5')||'{}');
  const duracao = Math.floor((Date.now()-new Date(sv.inicio).getTime())/1000);
  const total = (sv.base||0)+duracao;
  if(sv.sessaoId) await fetch(`${SB}/rest/v1/tempo_sessoes?id=eq.${sv.sessaoId}`,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({fim:new Date().toISOString(),duracao})});
  await fetch(`${SB}/rest/v1/tarefas?id=eq.${timerTarefaId}`,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({tempo_total:total})});
  [tasks,cpTarefas].forEach(arr=>{const i=arr.findIndex(x=>x.id===timerTarefaId);if(i>=0)arr[i].tempo_total=total;});
  localStorage.removeItem('timer5');
  document.querySelectorAll('.cr-timer').forEach(d=>d.classList.remove('on'));
  timerTarefaId=null; timerInicio=null; timerSeg=0;
  document.getElementById('timer-pill').classList.remove('on');
  renderTasks(); renderClientes();
  toast(`${fmtS(duracao)} registrados`,'ok');
}

function iniciarInterval(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timerSeg++;
    document.getElementById('timer-pill-label').textContent = fmtL(timerSeg);
    const el = document.getElementById('pit-'+timerTarefaId);
    if(el) el.textContent = fmtL(timerSeg);
  },1000);
}

function atualizarTimerPill(sv){
  document.getElementById('timer-pill-label').textContent = fmtL(timerSeg);
  document.getElementById('timer-pill').classList.add('on');
}

function irParaClienteTimer(){
  const sv = JSON.parse(localStorage.getItem('timer5')||'{}');
  if(sv.clienteId) abrirCliente(sv.clienteId);
}

// ── CLIENTE PANEL ─────────────────────────────────────────────────
async function abrirCliente(id){
  clienteAtual = clientes.find(c=>c.id===id);
  if(!clienteAtual) return;
  const c_cor = cor(clienteAtual.nome_completo);

  document.getElementById('cp-header').innerHTML=`
    <div class="cp-av" style="background:${c_cor}">${ini(clienteAtual.nome_completo)}</div>
    <div class="cp-info">
      <div class="cp-nome">${clienteAtual.nome_completo}</div>
      <div class="cp-empresa">${clienteAtual.empresa||'—'}</div>
    </div>
    <button class="cp-close" onclick="fecharClientePanel()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>`;

  document.querySelectorAll('.client-row').forEach(r=>r.classList.remove('active'));
  document.getElementById('cr-'+id)?.classList.add('active');

  document.getElementById('client-panel').classList.add('open');
  document.getElementById('overlay-bg').classList.add('show');

  cpSetTab('escopo');
  await Promise.all([carregarCpStats(), carregarEscopoCliente(), carregarTarefasCliente()]);

  // Actions
  document.getElementById('cp-actions').innerHTML=`
    <button class="cp-action" onclick="abrirWorkflow()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Report
    </button>
    <button class="cp-action" onclick="abrirWorkflow()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 9.81 19.79 19.79 0 0 1 1.17 4.14 2 2 0 0 1 3.12 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16.92z"/></svg>
      WhatsApp
    </button>
    <button class="cp-action primary" onclick="abrirNovoServico()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Serviço
    </button>`;
}

function fecharClientePanel(){
  document.getElementById('client-panel').classList.remove('open');
  document.getElementById('overlay-bg').classList.remove('show');
  document.querySelectorAll('.client-row').forEach(r=>r.classList.remove('active'));
  clienteAtual = null;
}

function cpSetTab(tab){
  cpTabAtiva = tab;
  document.querySelectorAll('.cp-tab').forEach((t,i)=>{
    t.classList.toggle('active',['escopo','tarefas','tempo'][i]===tab);
  });
  renderCpBody();
}

async function carregarCpStats(){
  const [sess,proj] = await Promise.all([
    api(`tempo_sessoes?select=duracao&cliente_id=eq.${clienteAtual.id}&created_at=gte.${semI()}T00:00:00`),
    api(`projetos?select=status&cliente_id=eq.${clienteAtual.id}`)
  ]);
  const total = (sess||[]).reduce((a,s)=>a+(s.duracao||0),0);
  const ent = (proj||[]).filter(p=>p.status==='entregue').length;
  const at  = (proj||[]).filter(p=>p.status==='em_andamento').length;
  document.getElementById('cp-stats').innerHTML=`
    <div class="cp-stat"><div class="cp-stat-v" style="color:var(--accent)">${fmtS(total)}</div><div class="cp-stat-l">Semana</div></div>
    <div class="cp-stat"><div class="cp-stat-v" style="color:var(--green)">${ent}</div><div class="cp-stat-l">Entregues</div></div>
    <div class="cp-stat"><div class="cp-stat-v" style="color:var(--orange)">${at}</div><div class="cp-stat-l">Em andamento</div></div>`;
}

async function carregarEscopoCliente(){
  cpServicos = await api(`projetos?select=id,titulo,status,prazo&cliente_id=eq.${clienteAtual.id}&order=created_at.desc`)||[];
}

async function carregarTarefasCliente(){
  cpTarefas = await api(`tarefas?select=*&cliente_id=eq.${clienteAtual.id}&order=created_at.desc`)||[];
}

function renderCpBody(){
  const body = document.getElementById('cp-body');
  if(cpTabAtiva==='escopo') renderEscopo(body);
  else if(cpTabAtiva==='tarefas') renderCpTarefas(body);
  else renderCpTempo(body);
}

function renderEscopo(body){
  const statusCor={entregue:'var(--green)',em_andamento:'var(--accent)',briefing:'var(--orange)',revisao:'var(--purple)',pausado:'var(--ink3)'};
  body.innerHTML=`<div class="cp-section">
    <div class="cp-section-title">Serviços <span class="cp-add-btn" onclick="abrirNovoServico()">+ Adicionar</span></div>
    ${cpServicos.length
      ? cpServicos.map(s=>{
          const prazo=s.prazo?new Date(s.prazo+'T00:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'}):'Sem prazo';
          const c=statusCor[s.status]||'var(--ink3)';
          return`<div class="service-item">
            <div class="si-status" style="background:${c}"></div>
            <div class="si-info">
              <div class="si-titulo">${s.titulo}</div>
              <div class="si-prazo">${prazo}</div>
            </div>
            <div class="si-add" onclick="addServicoDia('${s.id}')">+ Hoje</div>
          </div>`;
        }).join('')
      :'<div class="empty-msg">Nenhum serviço cadastrado</div>'}
  </div>`;
}

function renderCpTarefas(body){
  const pend = cpTarefas.filter(t=>t.status!=='concluida');
  const conc = cpTarefas.filter(t=>t.status==='concluida').slice(0,5);
  body.innerHTML=`<div class="cp-section">
    <div class="cp-section-title">Tarefas</div>
    ${pend.length ? pend.map(t=>taskHTML(t)).join('') : '<div class="empty-msg">Sem tarefas pendentes</div>'}
    ${conc.length ? `<div style="margin-top:12px;font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Concluídas</div>${conc.map(t=>taskHTML(t)).join('')}` : ''}
  </div>`;
}

async function renderCpTempo(body){
  body.innerHTML='<div class="empty-msg">Carregando…</div>';
  const sessoes = await api(`tempo_sessoes?select=*,tarefas(titulo)&cliente_id=eq.${clienteAtual.id}&order=created_at.desc&limit=15`)||[];
  if(!sessoes.length){ body.innerHTML='<div class="empty-msg">Nenhuma sessão ainda</div>'; return; }
  body.innerHTML=`<div class="cp-section">${sessoes.map(s=>{
    const dt=new Date(s.created_at).toLocaleDateString('pt-BR',{day:'numeric',month:'short'});
    return`<div class="service-item">
      <div class="si-status" style="background:var(--accent)"></div>
      <div class="si-info">
        <div class="si-titulo">${s.tarefas?.titulo||'Sessão'}</div>
        <div class="si-prazo">${CAT[s.categoria]||'Geral'} · ${dt}</div>
      </div>
      <span style="font-size:13px;font-weight:700;color:var(--accent)">${fmtS(s.duracao||0)}</span>
    </div>`;
  }).join('')}</div>`;
}

// ── ESCOPO ────────────────────────────────────────────────────────
async function addServicoDia(projetoId){
  const s = cpServicos.find(x=>x.id===projetoId);
  if(!s) return;
  const res = await fetch(`${SB}/rest/v1/tarefas`,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({cliente_id:clienteAtual.id,projeto_id:projetoId,titulo:s.titulo,categoria:'geral',status:'pendente',tempo_total:0,created_at:new Date().toISOString()})}).then(r=>r.json());
  if(res?.[0]){
    tasks.unshift({...res[0],clientes:{nome_completo:clienteAtual.nome_completo}});
    cpTarefas.unshift(res[0]);
    renderTasks(); renderCpBody();
    await fetch(`${SB}/rest/v1/projetos?id=eq.${projetoId}`,{method:'PATCH',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({status:'em_andamento'})});
    toast(`"${s.titulo}" adicionado ao dia`);
  }
}

function abrirNovoServico(){
  document.getElementById('modal-servico').classList.add('open');
  setTimeout(()=>document.getElementById('ms-titulo')?.focus(),200);
}

async function salvarServico(){
  const titulo = document.getElementById('ms-titulo')?.value.trim();
  const prazo  = document.getElementById('ms-prazo')?.value;
  const status = document.getElementById('ms-status')?.value;
  if(!titulo||!clienteAtual){ toast('Preencha o nome do serviço','er'); return; }
  const res = await fetch(`${SB}/rest/v1/projetos`,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({cliente_id:clienteAtual.id,titulo,status:status||'briefing',prazo:prazo||null,created_at:new Date().toISOString()})}).then(r=>r.json());
  if(res?.[0]){ cpServicos.unshift(res[0]); renderCpBody(); fecharModal('modal-servico'); toast('Serviço adicionado'); }
}

// ── ESCOPO PICKER (do homepage) ────────────────────────────────────
function abrirEscopoPicker(){
  if(!clientes.length){ toast('Nenhum cliente ativo','er'); return; }
  if(!clienteAtual && clientes[0]) clienteAtual = clientes[0];
  // Abre o panel do cliente
  abrirCliente(clienteAtual?.id||clientes[0].id);
}

// ── MODAIS ────────────────────────────────────────────────────────
function fecharModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); });
});

// ── CHAT ──────────────────────────────────────────────────────────
function quickChat(msg){ document.getElementById('chat-in').value=msg; enviarChat(); }

async function enviarChat(){
  const input = document.getElementById('chat-in');
  const msg = input.value.trim(); if(!msg) return;
  input.value='';
  const result = document.getElementById('chat-result');
  result.textContent = 'Processando…'; result.classList.add('show');

  const tarefasPend = tasks.length;
  const clienteCtx = clienteAtual?`Cliente em foco: ${clienteAtual.nome_completo} (${clienteAtual.empresa||'—'}). `:'';
  const sistema = `Você é o assistente de Patrick, CEO da 5essência Marketing (agência premium, Balneário Camboriú, SC). ${clienteCtx}Tarefas hoje: ${tarefasPend}. Clientes: ${clientes.length}. Responda de forma direta, máximo 2 frases. Em português.`;

  try{
    const r = await fetch(`${SB}/functions/v1/chat-assistant`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({system:sistema,messages:[{role:'user',content:msg}]})});
    const d = await r.json();
    result.textContent = d.resposta||'Não consegui processar.';
  }catch(e){ result.textContent='Erro de conexão.'; }
}

// ── WORKFLOW ──────────────────────────────────────────────────────
function abrirWorkflow(){ window.open('workflow-5essencia.html','_blank'); }

// ── VIEWS (NAV) ───────────────────────────────────────────────────
function setView(v){
  document.getElementById('tb-section').textContent = {home:'Dashboard',clientes:'Clientes'}[v]||v;
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.remove('active'));
}

// ── TOAST ─────────────────────────────────────────────────────────
function toast(msg,tipo='ok'){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = `toast ${tipo}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}
</script>
